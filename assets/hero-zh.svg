    <path d="M239 20 h46" stroke="#343C59" stroke-width="1.5"/>
    <circle cx="291" cy="20" r="4" fill="#4BD5FF"/>
  </g>
</g>

<rect x=".75" y=".75" width="1598.5" height="638.5" rx="31.25" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1.5"/>
</svg>