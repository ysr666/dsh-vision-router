name: Exact staged native OCR Desktop acceptance
description: Run the existing real Electron renderer gate on the same runner that staged the exact audited native archive.
inputs:
  stage:
    required: true
    description: Absolute isolated stage directory
  bmp:
    required: true
    description: Absolute synthetic OCR input
  expected:
    required: true
    description: Exact expected synthetic OCR text
runs:
  using: composite
  steps:
    - name: Resolve reviewed current Host pin
      id: pin
      shell: bash
      run: node scripts/dsh-current-host-pin.mjs read
    - name: Checkout immutable DSH current Host
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: deepseek-ai/deepseek-harness
        ref: 9c2670d3bce5275e0d1610272958121af87787bb
        persist-credentials: false
        path: dsh-ocr-host
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      with:
        # This checkout has two different packageManager declarations. Read
        # the immutable RC4 Host manifest, not the DVR workspace root.
        package_json_file: dsh-ocr-host/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.21.0
    - name: Verify renderer E2E syntax before expensive Host dependencies
      shell: bash
      run: |
        node --check scripts/dsh-desktop-renderer-e2e.mjs
        node --check quality/native-ocr-desktop-acceptance.mjs
        node --test quality/test-native-ocr-desktop-acceptance.mjs
    - name: Build unmodified plugin package
      shell: bash
      run: |
        set -euo pipefail
        # DVR has a different pinned pnpm than the immutable DSH Host.
        # Install only DVR with its own exact pinned package manager.
        npm exec --yes --package=pnpm@11.20.0 -- pnpm install --frozen-lockfile --ignore-scripts
        node scripts/build-source-artifacts.mjs
        node scripts/build-source-artifacts.mjs --check
    - name: Install and build real current Host Desktop source
      working-directory: dsh-ocr-host
      shell: bash
      env:
        CI: 'true'
        LEFTHOOK: '0'
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
        test "pnpm@$(pnpm --version)" = "$(node -p 'require("./package.json").packageManager')"
        pnpm install --frozen-lockfile
        pnpm run build
    - name: Verify exact OCR tool evidence discrimination
      shell: bash
      run: node --test quality/test-native-ocr-desktop-acceptance.mjs
    - name: Exact native OCR through real Desktop settings and Agent tool
      working-directory: dsh-ocr-host
      shell: bash
      env:
        DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-ocr-host
        DVR_SOURCE_ROOT: ${{ github.workspace }}
        DSH_EXPECTED_VERSION: ${{ steps.pin.outputs.version }}
        DVR_DESKTOP_CHECK_WHOLE_TURN_ROUTING: '0'
        DVR_NATIVE_OCR_STAGE: ${{ inputs.stage }}
        DVR_NATIVE_OCR_BMP: ${{ inputs.bmp }}
        DVR_NATIVE_OCR_EXPECTED: ${{ inputs.expected }}
        DVR_NATIVE_OCR_DESKTOP_REPORT: ${{ inputs.stage }}/desktop-acceptance-evidence.json
      run: node --import tsx ../scripts/dsh-desktop-renderer-e2e.mjs
    - name: Preserve the production pins and source
      if: always()
      shell: bash
      run: git diff --exit-code -- src/lib/native-ocr-canary.js src/lib/native-ocr-download.js src/lib/native-ocr-bundle-metadata.js
    - name: Upload Desktop evidence JSON only
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-ocr-real-desktop-evidence-${{ runner.os }}
        path: ${{ inputs.stage }}/desktop-acceptance-evidence.json
        if-no-files-found: ignore
