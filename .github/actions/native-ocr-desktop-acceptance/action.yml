name: Exact staged native OCR Desktop acceptance
description: Run the existing real Electron renderer gate on the same runner that staged the exact audited native archive.
inputs:
  stage:
    required: true
    description: Absolute isolated stage directory
  bmp:
    required: true
    description: Absolute synthetic OCR input
  expected:
    required: true
    description: Exact expected synthetic OCR text
runs:
  using: composite
  steps:
    - name: Resolve reviewed RC4 pin
      id: pin
      shell: bash
      run: node scripts/dsh-rc4-pin.mjs read
    - name: Checkout immutable DSH RC4
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: deepseek-ai/deepseek-harness
        ref: 3f321d32bfe382212a8ed8785c1d47a5a300aa23
        persist-credentials: false
        path: dsh-ocr-host
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      with:
        version: 11.28.5
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.21.0
    - name: Build unmodified plugin package
      shell: bash
      run: |
        set -euo pipefail
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm build
        pnpm build:check
    - name: Install and build real RC4 Desktop source
      working-directory: dsh-ocr-host
      shell: bash
      env:
        CI: 'true'
        LEFTHOOK: '0'
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
        pnpm install --frozen-lockfile
        pnpm run build
    - name: Exact native OCR through real Desktop settings and worker
      working-directory: dsh-ocr-host
      shell: bash
      env:
        DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-ocr-host
        DVR_SOURCE_ROOT: ${{ github.workspace }}
        DSH_EXPECTED_VERSION: ${{ steps.pin.outputs.version }}
        DVR_DESKTOP_CHECK_WHOLE_TURN_ROUTING: '0'
        DVR_NATIVE_OCR_STAGE: ${{ inputs.stage }}
        DVR_NATIVE_OCR_BMP: ${{ inputs.bmp }}
        DVR_NATIVE_OCR_EXPECTED: ${{ inputs.expected }}
        DVR_NATIVE_OCR_DESKTOP_REPORT: ${{ inputs.stage }}/desktop-acceptance-evidence.json
      run: node --import tsx ../scripts/dsh-desktop-renderer-e2e.mjs
    - name: Preserve the production pins and source
      shell: bash
      run: git diff --exit-code -- src/lib/native-ocr-canary.js src/lib/native-ocr-download.js src/lib/native-ocr-bundle-metadata.js
    - name: Upload Desktop evidence JSON only
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-ocr-real-desktop-evidence-${{ runner.os }}
        path: ${{ inputs.stage }}/desktop-acceptance-evidence.json
        if-no-files-found: ignore
