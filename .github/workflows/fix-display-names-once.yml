name: fix-display-names-once

on:
  push:
    branches:
      - fix/unify-auto-vision-display-names
    paths:
      - '.github/workflows/fix-display-names-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unify-auto-vision-display-names
          fetch-depth: 0

      - name: Unify wrapper display names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.js')
          s = p.read_text()
          old = "const wrapName = (name) => `${name ?? 'DeepSeek'}（自动识图）`"
          new = "const wrapName = (name) => name ?? 'DeepSeek'"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one DeepSeek wrapName declaration, got {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s)

          # Keep existing wrapper tests aligned if they assert the old display label.
          t = Path('tests/core.test.js')
          ts = t.read_text()
          ts = ts.replace('DeepSeek-V4-Pro（自动识图）', 'DeepSeek-V4-Pro')
          ts = ts.replace('DeepSeek-V4-Flash（自动识图）', 'DeepSeek-V4-Flash')
          t.write_text(ts)
          PY

          grep -F "const wrapName = (name) => name ?? 'DeepSeek'" index.js
          ! grep -F 'DeepSeek-V4-Pro（自动识图）' index.js
          ! grep -F 'DeepSeek-V4-Flash（自动识图）' index.js

      - name: Run tests
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test

      - name: Commit clean fix and remove staging workflow
        shell: bash
        run: |
          rm .github/workflows/fix-display-names-once.yml
          git config user.name 'Shirui'
          git config user.email '77105194+ysr666@users.noreply.github.com'
          git add index.js tests/core.test.js .github/workflows/fix-display-names-once.yml
          git commit -m 'fix: unify auto-vision model display names'
          git push origin HEAD:fix/unify-auto-vision-display-names
