name: DSH pre-0.2.0 master source audit

on:
  pull_request:
    paths:
      - '.github/workflows/dsh-master-source-audit.yml'
      - 'cordis.patch.yml'
      - 'package.json'
      - 'lib/**'
      - 'scripts/dsh-alpha-source-contract.mjs'
      - 'scripts/dsh-proxy-egress-contract.mjs'
      - 'scripts/dsh-web-modules-overlay-contract.mjs'
      - 'scripts/dsh-web-connection-overlay-contract.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  master-source-contract:
    name: master@21638c5 source / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr

      - name: Checkout immutable pre-0.2.0 master source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 21638c56315ae6a2b552d6091945d3144c9af32e
          persist-credentials: false
          path: dsh-master

      - name: Install upstream package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Install Node 22 contract runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      - name: Install upstream workspace dependencies
        working-directory: dsh-master
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Run Vision Router against exact master source contracts
        working-directory: dsh-master
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-master
          DSH_EXPECTED_VERSION: 0.1.7-rc.2
          DSH_EXPECTED_COMMIT: 21638c56315ae6a2b552d6091945d3144c9af32e
        run: pnpm exec tsx ../dvr/scripts/dsh-alpha-source-contract.mjs

      - name: Verify Host proxy egress authority
        working-directory: dsh-master
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-master
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
        run: pnpm exec tsx ../dvr/scripts/dsh-proxy-egress-contract.mjs

      - name: Check modules to webServer overlay ownership
        working-directory: dsh-master
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-master
          DSH_MODULES_WEBSERVER_EXPECTED: shim-required
        run: pnpm exec tsx ../dvr/scripts/dsh-web-modules-overlay-contract.mjs

      - name: Check connection to webServer overlay ownership
        working-directory: dsh-master
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-master
          DSH_CONNECTION_WEBSERVER_EXPECTED: shim-required
        run: pnpm exec tsx ../dvr/scripts/dsh-web-connection-overlay-contract.mjs
