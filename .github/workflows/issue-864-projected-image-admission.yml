name: Issue 864 projected image admission proposal (diagnostic only)
on:
  push:
    branches: [diagnostics/issue-864-projected-image-admission]
permissions:
  contents: read
jobs:
  original-provider:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: 9c2670d3bce5275e0d1610272958121af87787bb
            node: 24.21.0
          - host: 4b399c39a6d1479cd84ca591b4d7c88e24d38a96
            node: 24.22.3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: dvr
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.host }}
          path: dsh-host
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - name: Build actual DVR candidate and run control regression tests
        working-directory: dvr
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          node --test tests/issue-865-native-vision-policy-command.test.js
          git diff --exit-code
      - name: Apply isolated typed Host proposal and upstream regression cases
        working-directory: dsh-host
        run: node ../dvr/scripts/issue-864-projected-image-host-proposal.mjs
      - name: Build Host proposal (disposable checkout)
        working-directory: dsh-host
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Run upstream receipt admission suite with proposed seam
        working-directory: dsh-host
        run: pnpm exec vitest run packages/api/session-controller/tests/commands-upload-file.host.spec.ts
      - name: Exercise real DVR public apply and real Agent with proposed ordinary image admission
        working-directory: dsh-host
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-host
        run: |
          git diff --check
          pnpm exec tsx ../dvr/scripts/issue-864-model-identity-policy.mjs
          git diff --check
