name: Apply advisory vision capability migration

on:
  push:
    branches:
      - agent/advisory-vision-capabilities-v2

concurrency:
  group: advisory-vision-capabilities-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/advisory-vision-capabilities-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Apply migration
        run: python3 scripts/apply-advisory-vision-capabilities.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run test suite
        run: pnpm test
      - name: Commit migrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js lib/client.js README.md README.zh.md tests/client.test.js tests/capability-advisory.test.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: treat vision capability metadata as advisory (#128)"
          git push origin HEAD:agent/advisory-vision-capabilities-v2
