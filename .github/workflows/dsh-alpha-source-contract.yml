name: DSH alpha source contract

on:
  pull_request:
    paths:
      - 'cordis.patch.yml'
      - 'package.json'
      - 'lib/client-host-compat-prelude.js'
      - 'lib/client-presentation-boundary.js'
      - 'lib/settings-factory-lifecycle.js'
      - 'lib/settings-ia-client-prelude.js'
      - 'lib/settings-limit-client-prelude.js'
      - 'lib/remote-settings-bridge.js'
      - 'lib/web/index.js'
      - 'lib/web/settings-controller.js'
      - 'lib/dsh-contract-compat.js'
      - 'lib/web-capability-boundary.js'
      - 'lib/client.js'
      - 'scripts/dsh-alpha-source-contract.mjs'
      - 'tests/alpha1-*.test.js'
      - 'tests/attachment-admission-policy.test.js'
      - '.github/workflows/dsh-alpha-source-contract.yml'
  push:
    branches: [main]
    paths:
      - 'cordis.patch.yml'
      - 'package.json'
      - 'lib/client-host-compat-prelude.js'
      - 'lib/client-presentation-boundary.js'
      - 'lib/settings-factory-lifecycle.js'
      - 'lib/settings-ia-client-prelude.js'
      - 'lib/settings-limit-client-prelude.js'
      - 'lib/remote-settings-bridge.js'
      - 'lib/web/index.js'
      - 'lib/web/settings-controller.js'
      - 'lib/dsh-contract-compat.js'
      - 'lib/web-capability-boundary.js'
      - 'lib/client.js'
      - 'scripts/dsh-alpha-source-contract.mjs'
      - 'tests/alpha1-*.test.js'
      - 'tests/attachment-admission-policy.test.js'
      - '.github/workflows/dsh-alpha-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha-source-contract:
    name: alpha.1 contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr

      - name: Checkout exact DSH alpha.1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: cd5ef8148158c3a752a658978873241fdf8e2bbc
          persist-credentials: false
          path: dsh-alpha

      - name: Install alpha package manager
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0

      - name: Install Node 22 contract runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: dsh-alpha/pnpm-lock.yaml

      - name: Install exact alpha workspace dependencies
        working-directory: dsh-alpha
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile

      - name: Run Vision Router against exact alpha source contracts
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
        run: pnpm exec tsx ../dvr/scripts/dsh-alpha-source-contract.mjs

      - name: Run DVR alpha compatibility unit contracts
        working-directory: dvr
        run: node --test tests/alpha1-client-host-compat.test.js tests/alpha1-settings-factory-lifecycle.test.js tests/alpha1-web-auth-boundary.test.js tests/attachment-admission-policy.test.js