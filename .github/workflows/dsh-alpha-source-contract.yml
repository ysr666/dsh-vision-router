name: DSH exact source contract

on:
  pull_request:
    paths:
      - 'cordis.patch.yml'
      - 'package.json'
      - 'lib/dsh-support-window.js'
      - 'lib/adapter-update-coalescer.js'
      - 'lib/client-host-compat-prelude.js'
      - 'lib/client-presentation-boundary.js'
      - 'lib/*-client-prelude.js'
      - 'lib/vision-model-visibility-boundary-main.js'
      - 'lib/vision-model-visibility-boundary.js'
      - 'lib/client-presentation-boundary-main.js'
      - 'lib/settings-factory-lifecycle.js'
      - 'lib/settings-ia-client-prelude.js'
      - 'lib/vision-provider-transport.js'
      - 'lib/legacy-global-proxy-boundary.js'
      - 'lib/proxy-routing.js'
      - 'scripts/dsh-proxy-egress-contract.mjs'
      - 'docs/architecture/host-first-proxy-convergence.md'
      - 'lib/settings-limit-client-prelude.js'
      - 'lib/remote-settings-bridge.js'
      - 'lib/web/**'
      - 'lib/dsh-contract-compat.js'
      - 'lib/web-capability-boundary.js'
      - 'lib/client.js'
      - 'lib/guide-vision-toggle-highlight.js'
      - 'lib/remote-settings-risk-confirmation.js'
      - 'lib/settings-client-rc8-lifecycle.js'
      - 'lib/settings-native-card-layout.js'
      - 'lib/v2-settings-ia-integration.js'
      - 'lib/vision-capability-benchmark-client.js'
      - 'lib/vision-exact-check-client.js'
      - 'lib/vision-routing-settings-prelude.js'
      - 'scripts/dsh-alpha-source-contract.mjs'
      - 'scripts/dsh-web-modules-overlay-contract.mjs'
      - 'tests/adapter-prepare-call-compat.test.js'
      - 'tests/rc6-rc7-compat.test.js'
      - 'tests/alpha1-*.test.js'
      - 'tests/attachment-admission-policy.test.js'
      - 'tests/clipboard-image-paste-compat.test.js'
      - 'tests/client-presentation-boundary.test.js'
      - '.github/workflows/dsh-alpha-source-contract.yml'
  push:
    branches: [main]
    paths:
      - 'cordis.patch.yml'
      - 'package.json'
      - 'lib/dsh-support-window.js'
      - 'lib/adapter-update-coalescer.js'
      - 'lib/client-host-compat-prelude.js'
      - 'lib/client-presentation-boundary.js'
      - 'lib/*-client-prelude.js'
      - 'lib/vision-model-visibility-boundary-main.js'
      - 'lib/vision-model-visibility-boundary.js'
      - 'lib/client-presentation-boundary-main.js'
      - 'lib/settings-factory-lifecycle.js'
      - 'lib/settings-ia-client-prelude.js'
      - 'lib/vision-provider-transport.js'
      - 'lib/legacy-global-proxy-boundary.js'
      - 'lib/proxy-routing.js'
      - 'scripts/dsh-proxy-egress-contract.mjs'
      - 'docs/architecture/host-first-proxy-convergence.md'
      - 'lib/settings-limit-client-prelude.js'
      - 'lib/remote-settings-bridge.js'
      - 'lib/web/**'
      - 'lib/dsh-contract-compat.js'
      - 'lib/web-capability-boundary.js'
      - 'lib/client.js'
      - 'lib/guide-vision-toggle-highlight.js'
      - 'lib/remote-settings-risk-confirmation.js'
      - 'lib/settings-client-rc8-lifecycle.js'
      - 'lib/settings-native-card-layout.js'
      - 'lib/v2-settings-ia-integration.js'
      - 'lib/vision-capability-benchmark-client.js'
      - 'lib/vision-exact-check-client.js'
      - 'lib/vision-routing-settings-prelude.js'
      - 'scripts/dsh-alpha-source-contract.mjs'
      - 'scripts/dsh-web-modules-overlay-contract.mjs'
      - 'tests/adapter-prepare-call-compat.test.js'
      - 'tests/rc6-rc7-compat.test.js'
      - 'tests/alpha1-*.test.js'
      - 'tests/attachment-admission-policy.test.js'
      - 'tests/clipboard-image-paste-compat.test.js'
      - 'tests/client-presentation-boundary.test.js'
      - '.github/workflows/dsh-alpha-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exact-source-contract:
    name: DSH ${{ matrix.dsh }} source / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dsh: 0.1.5-rc.1
          - os: macos-latest
            dsh: 0.1.5-rc.1
          - os: windows-latest
            dsh: 0.1.5-rc.1
          - os: ubuntu-latest
            dsh: 0.1.5-rc.2
          - os: macos-latest
            dsh: 0.1.5-rc.2
          - os: windows-latest
            dsh: 0.1.5-rc.2
          - os: ubuntu-latest
            dsh: 0.1.5-alpha.2
          - os: macos-latest
            dsh: 0.1.5-alpha.2
          - os: windows-latest
            dsh: 0.1.5-alpha.2
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr

      - name: Checkout exact DSH 0.1.5-rc.1 source
        if: matrix.dsh == '0.1.5-rc.1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 183f08e9c6dde7e36cd2318eaee70b0da08fb35e
          persist-credentials: false
          path: dsh-exact

      - name: Checkout exact DSH 0.1.5-rc.2 source
        if: matrix.dsh == '0.1.5-rc.2'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: fb2c4b9e698e30edb738bca4cf0618587db7d203
          persist-credentials: false
          path: dsh-exact

      - name: Checkout exact DSH 0.1.5-alpha.2 source
        if: matrix.dsh == '0.1.5-alpha.2'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b2e3b2a0125854567a4a5fcba75782e42fe84901
          persist-credentials: false
          path: dsh-exact

      - name: Install exact Host package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Install Node 22 contract runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      - name: Install exact Host workspace dependencies
        working-directory: dsh-exact
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile

      - name: Run Vision Router against exact 0.1.5-rc.1 source contracts
        if: matrix.dsh == '0.1.5-rc.1'
        working-directory: dsh-exact
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-exact
          DSH_EXPECTED_VERSION: 0.1.5-rc.1
          DSH_EXPECTED_COMMIT: 183f08e9c6dde7e36cd2318eaee70b0da08fb35e
        run: pnpm exec tsx ../dvr/scripts/dsh-alpha-source-contract.mjs

      - name: Run Vision Router against exact 0.1.5-rc.2 source contracts
        if: matrix.dsh == '0.1.5-rc.2'
        working-directory: dsh-exact
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-exact
          DSH_EXPECTED_VERSION: 0.1.5-rc.2
          DSH_EXPECTED_COMMIT: fb2c4b9e698e30edb738bca4cf0618587db7d203
        run: pnpm exec tsx ../dvr/scripts/dsh-alpha-source-contract.mjs

      - name: Run Vision Router against exact 0.1.5-alpha.2 source contracts
        if: matrix.dsh == '0.1.5-alpha.2'
        working-directory: dsh-exact
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-exact
          DSH_EXPECTED_VERSION: 0.1.5-alpha.2
          DSH_EXPECTED_COMMIT: b2e3b2a0125854567a4a5fcba75782e42fe84901
        run: pnpm exec tsx ../dvr/scripts/dsh-alpha-source-contract.mjs

      - name: Verify Host proxy egress authority for Vision Router
        working-directory: dsh-exact
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-exact
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
        run: pnpm exec tsx ../dvr/scripts/dsh-proxy-egress-contract.mjs

      - name: Assert modules -> webServer compatibility overlay still belongs to DVR
        working-directory: dsh-exact
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-exact
          DSH_MODULES_WEBSERVER_EXPECTED: shim-required
        run: pnpm exec tsx ../dvr/scripts/dsh-web-modules-overlay-contract.mjs

      - name: Run DVR release-family compatibility unit contracts
        working-directory: dvr
        run: >-
          node --test
          tests/adapter-prepare-call-compat.test.js
          tests/alpha1-client-host-compat.test.js
          tests/alpha1-settings-factory-lifecycle.test.js
          tests/alpha1-browser-lifecycle-integration.test.js
          tests/alpha1-web-auth-boundary.test.js
          tests/attachment-admission-policy.test.js
          tests/clipboard-image-paste-compat.test.js
          tests/client-presentation-boundary.test.js
