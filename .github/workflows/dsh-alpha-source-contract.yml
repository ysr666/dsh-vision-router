name: DSH alpha source contract

on:
  pull_request:
    paths:
      - 'cordis.patch.yml'
      - 'package.json'
      - 'lib/adapter-update-coalescer.js'
      - 'lib/client-host-compat-prelude.js'
      - 'lib/client-presentation-boundary.js'
      - 'lib/*-client-prelude.js'
      - 'lib/vision-model-visibility-boundary-main.js'
      - 'lib/vision-model-visibility-boundary.js'
      - 'lib/client-presentation-boundary-main.js'
      - 'lib/settings-factory-lifecycle.js'
      - 'lib/settings-ia-client-prelude.js'
      - 'lib/settings-limit-client-prelude.js'
      - 'lib/remote-settings-bridge.js'
      - 'lib/web/**'
      - 'lib/dsh-contract-compat.js'
      - 'lib/web-capability-boundary.js'
      - 'lib/client.js'
      - 'lib/guide-vision-toggle-highlight.js'
      - 'lib/remote-settings-risk-confirmation.js'
      - 'lib/settings-client-rc8-lifecycle.js'
      - 'lib/settings-native-card-layout.js'
      - 'lib/v2-settings-ia-integration.js'
      - 'lib/vision-capability-benchmark-client.js'
      - 'lib/vision-exact-check-client.js'
      - 'lib/vision-routing-settings-prelude.js'
      - 'scripts/dsh-alpha-source-contract.mjs'
      - 'tests/adapter-prepare-call-compat.test.js'
      - 'tests/alpha1-*.test.js'
      - 'tests/attachment-admission-policy.test.js'
      - 'tests/clipboard-image-paste-compat.test.js'
      - 'tests/client-presentation-boundary.test.js'
      - '.github/workflows/dsh-alpha-source-contract.yml'
  push:
    branches: [main]
    paths:
      - 'cordis.patch.yml'
      - 'package.json'
      - 'lib/adapter-update-coalescer.js'
      - 'lib/client-host-compat-prelude.js'
      - 'lib/client-presentation-boundary.js'
      - 'lib/*-client-prelude.js'
      - 'lib/vision-model-visibility-boundary-main.js'
      - 'lib/vision-model-visibility-boundary.js'
      - 'lib/client-presentation-boundary-main.js'
      - 'lib/settings-factory-lifecycle.js'
      - 'lib/settings-ia-client-prelude.js'
      - 'lib/settings-limit-client-prelude.js'
      - 'lib/remote-settings-bridge.js'
      - 'lib/web/**'
      - 'lib/dsh-contract-compat.js'
      - 'lib/web-capability-boundary.js'
      - 'lib/client.js'
      - 'lib/guide-vision-toggle-highlight.js'
      - 'lib/remote-settings-risk-confirmation.js'
      - 'lib/settings-client-rc8-lifecycle.js'
      - 'lib/settings-native-card-layout.js'
      - 'lib/v2-settings-ia-integration.js'
      - 'lib/vision-capability-benchmark-client.js'
      - 'lib/vision-exact-check-client.js'
      - 'lib/vision-routing-settings-prelude.js'
      - 'scripts/dsh-alpha-source-contract.mjs'
      - 'tests/adapter-prepare-call-compat.test.js'
      - 'tests/alpha1-*.test.js'
      - 'tests/attachment-admission-policy.test.js'
      - 'tests/clipboard-image-paste-compat.test.js'
      - 'tests/client-presentation-boundary.test.js'
      - '.github/workflows/dsh-alpha-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  alpha-source-contract:
    name: 0.1.5-alpha.1 contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr

      - name: Checkout exact DSH 0.1.5-alpha.1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 5dda764ed3aa172535a7967b06ff95d9cbfe536a
          persist-credentials: false
          path: dsh-alpha

      - name: Install alpha package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Install Node 22 contract runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: dsh-alpha/pnpm-lock.yaml

      - name: Install exact alpha workspace dependencies
        working-directory: dsh-alpha
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile

      - name: Run Vision Router against exact alpha source contracts
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DSH_EXPECTED_VERSION: 0.1.5-alpha.1
          DSH_EXPECTED_COMMIT: 5dda764ed3aa172535a7967b06ff95d9cbfe536a
        run: pnpm exec tsx ../dvr/scripts/dsh-alpha-source-contract.mjs

      - name: Run DVR alpha compatibility unit contracts
        working-directory: dvr
        run: >-
          node --test
          tests/adapter-prepare-call-compat.test.js
          tests/alpha1-client-host-compat.test.js
          tests/alpha1-settings-factory-lifecycle.test.js
          tests/alpha1-browser-lifecycle-integration.test.js
          tests/alpha1-web-auth-boundary.test.js
          tests/attachment-admission-policy.test.js
          tests/clipboard-image-paste-compat.test.js
          tests/client-presentation-boundary.test.js
