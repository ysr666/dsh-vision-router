name: Finalize read-image hardening

on:
  push:
    branches:
      - agent/read-image-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve attachment lookup before sanitizing tool images
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text()
          old = """    const rawMessages = decision.messages ?? payload.messages ?? []
              // Hard invariant: tool-produced image blocks never reach a model request.
          """
          new = """    const rawMessages = decision.messages ?? payload.messages ?? []
              // Record refs BEFORE sanitizing nested tool-result images so a later
              // vision_describe(attachmentIds=...) can still reopen the generated image.
              const rawImageRefs = rewriteImageBlocks(rawMessages)
              recordUploadedAttachments(session, rawImageRefs.attachments)
              // Hard invariant: tool-produced image blocks never reach a model request.
          """
          if old not in s:
              raise SystemExit('missing pre-step attachment anchor')
          s = s.replace(old, new, 1)

          old = """    if (hasImage) {
              const rewrite = rewriteImageBlocks(messages)
              recordUploadedAttachments(session, rewrite.attachments)
          """
          new = """    if (hasImage) {
          """
          if old not in s:
              raise SystemExit('missing duplicate attachment-registration anchor')
          s = s.replace(old, new, 1)

          s = s.replace(
              '`[tool result produced image “${name}”, attachment id “${id}”. ` +',
              '`[tool result produced image "${name}", attachment id "${id}". ` +',
              1,
          )
          s = s.replace(
              '`To inspect it, call vision_describe with attachmentIds: [“${id}”] when available, ` +',
              '`To inspect it, call vision_describe with attachmentIds: ["${id}"] when available, ` +',
              1,
          )
          p.write_text(s)
      - run: pnpm test
      - run: git diff --check
      - name: Commit final implementation
        run: |
          rm .github/workflows/agent-read-image-hardening-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js .github/workflows
          git commit -m "fix: preserve generated-image attachment lookup"
          git push origin HEAD:agent/read-image-hardening
