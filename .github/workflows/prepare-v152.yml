name: Prepare v1.5.2 hotfix

on:
  push:
    branches:
      - release/v1.5.2
    paths:
      - .github/workflows/prepare-v152.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.5.2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare release metadata
        run: python3 .github/scripts/prepare_v152.py
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release metadata
        run: |
          test "$(node -p "require('./package.json').version")" = "1.5.2"
          grep -q 'v1.5.2' README.md
          grep -q 'v1.5.2' README.zh.md
          grep -q '^## v1.5.2$' CHANGELOG.md
          node --check lib/client.js
          git diff --check
      - name: Run full tests
        run: pnpm test
      - name: Commit release prep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md README.zh.md CHANGELOG.md
          git commit -m "chore: prepare v1.5.2 hotfix release"
          git push origin HEAD:release/v1.5.2
