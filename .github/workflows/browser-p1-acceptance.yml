name: Browser P1 acceptance

on:
  pull_request:
    paths:
      - 'lib/client.js'
      - 'lib/settings-native-card-layout.js'
      - 'lib/settings-ia-client-prelude.js'
      - 'lib/vision-capability-benchmark-client.js'
      - 'tests/browser-p1-acceptance.test.js'
      - '.github/workflows/browser-p1-acceptance.yml'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Chrome executable
        shell: bash
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium executable found on ubuntu-latest' >&2
            exit 1
          fi
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Run real-browser P1 acceptance
        run: node --test tests/browser-p1-acceptance.test.js
