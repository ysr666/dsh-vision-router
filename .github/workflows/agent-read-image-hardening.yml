name: Apply read-image hardening

on:
  push:
    branches:
      - agent/read-image-hardening

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply deterministic patch
        run: node scripts/apply-read-image-hardening.mjs
      - name: Run regression tests
        run: pnpm test
      - name: Check diff
        run: git diff --check
      - name: Commit hardened implementation
        run: |
          rm scripts/apply-read-image-hardening.mjs
          rm .github/workflows/agent-read-image-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js lib/client.js tests/core.test.js scripts .github/workflows
          git commit -m "fix: harden generated-image delivery and screenshot portability"
          git push origin HEAD:agent/read-image-hardening
