name: temp-fix-reason-punctuation

on:
  push:
    branches:
      - fix/failure-reason-punctuation

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Apply exact patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old[:60]!r}, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/vision-resilience.js',
              "const AUTH_PATTERNS = [/\\b401\\b/, /\\b403\\b/, /unauthorized/i, /invalid api[ -]?key/i, /forbidden/i, /authentication/i, /check the api key/i]",
              """/** Ensure a user-visible failure sentence ends with exactly one terminal mark. */
          export function ensureSentencePunctuation(value) {
            const text = String(value ?? '').trim()
            if (text === '') return ''
            return /[.!?。！？]$/.test(text) ? text : `${text}.`
          }

          const AUTH_PATTERNS = [/\\b401\\b/, /\\b403\\b/, /unauthorized/i, /invalid api[ -]?key/i, /forbidden/i, /authentication/i, /check the api key/i]""",
          )

          replace_once(
              'index.js',
              "  buildVisionFailure,\n",
              "  buildVisionFailure,\n  ensureSentencePunctuation,\n",
          )
          replace_once(
              'index.js',
              "? `All vision models failed: ${errors.slice(0, 6).join(' | ')}${errors.length > 6 ? ` | … ${errors.length - 6} more` : ''}.`",
              """? ensureSentencePunctuation(
                        `All vision models failed: ${errors.slice(0, 6).join(' | ')}${errors.length > 6 ? ` | … ${errors.length - 6} more` : ''}`,
                      )""",
          )

          replace_once(
              'tests/vision-resilience.test.js',
              "  buildVisionFailure,\n",
              "  buildVisionFailure,\n  ensureSentencePunctuation,\n",
          )
          marker = "test('qwenKeyEndpointHint flags Token Plan key/endpoint mismatches without hardcoding providers', () => {"
          insert = """test('ensureSentencePunctuation never doubles an existing adapter sentence mark', () => {
            assert.equal(ensureSentencePunctuation('adapter failed.'), 'adapter failed.')
            assert.equal(ensureSentencePunctuation('adapter failed'), 'adapter failed.')
            assert.equal(ensureSentencePunctuation('adapter failed!'), 'adapter failed!')
            assert.equal(ensureSentencePunctuation('适配器失败。'), '适配器失败。')
          })

          """
          replace_once('tests/vision-resilience.test.js', marker, insert + marker)
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.js lib/vision-resilience.js tests/vision-resilience.test.js
          git commit -m "fix: avoid duplicate punctuation in vision failure reasons"
          git push origin HEAD:fix/failure-reason-punctuation
