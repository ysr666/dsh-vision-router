name: Apply update-check patch

on:
  push:
    branches:
      - agent/update-check-settings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/update-check-settings
          fetch-depth: 0
      - name: Apply deterministic patch
        run: node scripts/apply-update-check-patch.mjs
      - name: Remove temporary patch machinery
        run: rm -f scripts/apply-update-check-patch.mjs .github/workflows/apply-update-check-patch.yml
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js lib/client.js package.json scripts/apply-update-check-patch.mjs .github/workflows/apply-update-check-patch.yml
          git commit -m "feat: add automatic update checks"
          git push origin HEAD:agent/update-check-settings
