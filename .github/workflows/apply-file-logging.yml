name: Apply file logging client patch

on:
  push:
    branches:
      - feature/file-logging
    paths:
      - .github/workflows/apply-file-logging.yml
      - scripts/patch-client-file-logging.mjs

permissions:
  contents: write

jobs:
  patch-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/file-logging
      - name: Patch client bundle
        run: node scripts/patch-client-file-logging.mjs
      - name: Commit generated client change
        shell: bash
        run: |
          if git diff --quiet -- lib/client.js; then
            echo "Client already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js
          git commit -m "feat: add open logs folder action to settings"
          git push origin HEAD:feature/file-logging
