# one-shot branch polish; removed by the job after successful validation
name: Polish guide lifecycle refactor

on:
  push:
    branches: [fix/guide-lifecycle-architecture]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guide-lifecycle-architecture
          fetch-depth: 0

      - name: Fix structural invalidation and add regression coverage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          client_path = Path('lib/client.js')
          source = client_path.read_text()

          old_runtime = """      const sync = () => scheduleGuideSync(guideTranslator)
      window.addEventListener('popstate', sync)
      window.addEventListener('resize', sync)
      document.addEventListener('scroll', sync, true)
      let observer
      const Observer = window.MutationObserver || globalThis.MutationObserver
      if (typeof Observer === 'function') {
        observer = new Observer(sync)
        observer.observe(document.body, {
childList: true,
subtree: true,
attributes: true,
attributeFilter: ['aria-expanded', 'aria-hidden', 'class'],
        })
      }
      guideRuntimeDispose = () => {
        window.removeEventListener('popstate', sync)
        window.removeEventListener('resize', sync)
        document.removeEventListener('scroll', sync, true)
        if (observer && typeof observer.disconnect === 'function') observer.disconnect()
      }
"""
          new_runtime = """      const sync = () => scheduleGuideSync(guideTranslator)
      // Structural host changes must bypass the short geometry cache. With the
      // old 600ms keep-alive removed, swallowing the one mutation that opens or
      // closes Settings could otherwise leave the guide stuck forever.
      const resolveSync = () => {
        visionGuideResolved.at = 0
        scheduleGuideSync(guideTranslator)
      }
      window.addEventListener('popstate', resolveSync)
      window.addEventListener('resize', sync)
      document.addEventListener('scroll', sync, true)
      let observer
      const Observer = window.MutationObserver || globalThis.MutationObserver
      if (typeof Observer === 'function') {
        observer = new Observer(resolveSync)
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['aria-expanded', 'aria-hidden', 'class'],
        })
      }
      guideRuntimeDispose = () => {
        window.removeEventListener('popstate', resolveSync)
        window.removeEventListener('resize', sync)
        document.removeEventListener('scroll', sync, true)
        if (observer && typeof observer.disconnect === 'function') observer.disconnect()
      }
"""
          if old_runtime not in source:
            raise SystemExit('guide runtime block not found')
          source = source.replace(old_runtime, new_runtime, 1)

          old_replay = """                    onClick: () => {
            guideHostUi.closeSettings()
            const reveal = () => showOnboarding(t, { auto: false, focus: true })
            if (typeof window.requestAnimationFrame === 'function') window.requestAnimationFrame(reveal)
            else reveal()
          },
"""
          new_replay = """                    onClick: () => {
                      guideHostUi.closeSettings()
                      const reveal = () => showOnboarding(t, { auto: false, focus: true })
                      if (typeof window.requestAnimationFrame === 'function') window.requestAnimationFrame(reveal)
                      else reveal()
                    },
"""
          if old_replay not in source:
            raise SystemExit('guide replay block not found')
          source = source.replace(old_replay, new_replay, 1)

          old_export_comment = """    // Guide lifecycle hooks for behavioral tests: the idle-path layout-cost
    // gate and the per-frame sync coalescing are the exact regression guards
    // against settings panel scroll stutter.
"""
          new_export_comment = """    // Guide lifecycle hooks for behavioral tests. The runtime is lazy: idle
    // sessions install no hot-path listeners, while active sessions coalesce
    // geometry work and invalidate target resolution on structural DOM changes.
"""
          if old_export_comment in source:
            source = source.replace(old_export_comment, new_export_comment, 1)

          client_path.write_text(source)

          test_path = Path('tests/guide-scroll-gate.test.js')
          tests = test_path.read_text()
          tests = tests.replace(
            """  const frames = []
  const target = fakeElement()
""",
            """  const frames = []
  let mutationCallback
  const target = fakeElement()
""",
            1,
          )
          tests = tests.replace(
            """  const window = {
    innerWidth: 1280, innerHeight: 800,
""",
            """  class FakeMutationObserver {
    constructor(callback) { mutationCallback = callback }
    observe() {}
    disconnect() { mutationCallback = undefined }
  }
  const window = {
    innerWidth: 1280, innerHeight: 800,
    MutationObserver: FakeMutationObserver,
""",
            1,
          )
          tests = tests.replace(
            """  return { counters, document, window, listeners,
    scroll() { const fn = listeners.get('document:scroll'); if (fn) fn() },
    frame() { const work = frames.splice(0); for (const fn of work) fn() },
  }
""",
            """  return { counters, document, window, listeners,
    scroll() { const fn = listeners.get('document:scroll'); if (fn) fn() },
    mutate() { if (typeof mutationCallback === 'function') mutationCallback([]) },
    frame() { const work = frames.splice(0); for (const fn of work) fn() },
  }
""",
            1,
          )
          marker = """test('ending a guide disposes global listeners so later scrolls stay inert', () => {
"""
          regression = """test('structural DOM mutations invalidate cached guide target resolution immediately', () => {
  const { h, bundle, dispose } = boot()
  const realNow = Date.now
  Date.now = () => 1000
  try {
    bundle.startVisionSettingsGuide((key) => key)
    h.frame()
    const beforeMutation = h.counters.queries
    h.mutate()
    h.frame()
    assert.ok(
      h.counters.queries > beforeMutation,
      'a structural mutation must bypass the 250ms target-resolution cache',
    )
  } finally {
    Date.now = realNow
    bundle.finishVisionSettingsGuide()
    dispose()
  }
})

"""
          if marker not in tests:
            raise SystemExit('guide test insertion marker not found')
          tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Format only the rewritten guide lifecycle block
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('lib/client.js').read_text()
          start = source.index("    const ONBOARDING_STORAGE_KEY = 'dsh-vision-router:onboarding:model-guide-v2'")
          end = source.index('    const LABEL_KEY = {', start)
          fragment = source[start:end]
          wrapped = 'function __formatGuideLifecycle__() {\n' + fragment + '\n}\n'
          Path('/tmp/guide-lifecycle.js').write_text(wrapped)
          Path('/tmp/guide-range.txt').write_text(f'{start}\n{end}\n')
          PY
          npx --yes prettier@3.6.2 /tmp/guide-lifecycle.js --write --parser babel --no-semi --single-quote --print-width 120 --trailing-comma all
          python3 <<'PY'
          from pathlib import Path
          source = Path('lib/client.js').read_text()
          start, end = map(int, Path('/tmp/guide-range.txt').read_text().splitlines())
          formatted = Path('/tmp/guide-lifecycle.js').read_text().splitlines()
          if not formatted[0].startswith('function __formatGuideLifecycle__()') or formatted[-1] != '}':
            raise SystemExit('unexpected prettier wrapper output')
          body = formatted[1:-1]
          fragment = '\n'.join(('  ' + line if line else '') for line in body).rstrip() + '\n\n'
          Path('lib/client.js').write_text(source[:start] + fragment + source[end:])
          PY

      - name: Run focused regression tests
        run: node --test tests/client.test.js tests/guide-scroll-gate.test.js

      - name: Commit polish
        shell: bash
        run: |
          rm -f .github/workflows/guide-lifecycle-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden guide lifecycle resolution (#207)"
          git push origin HEAD:fix/guide-lifecycle-architecture
