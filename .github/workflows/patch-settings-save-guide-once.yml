name: Patch settings save and guide persistence once

on:
  push:
    branches: [fix/settings-save-guide-persistence]
    paths:
      - '.github/workflows/patch-settings-save-guide-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/settings-save-guide-persistence
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Patch settings UX and persistence
        run: python .github/patch-settings-save-guide.py
      - name: Verify
        run: |
          pnpm install --frozen-lockfile
          node --check lib/client.js
          git diff --check
          pnpm test
      - name: Commit patch and remove one-shot helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/patch-settings-save-guide-once.yml .github/patch-settings-save-guide.py
          git add lib/client.js tests/client.test.js .github/workflows/patch-settings-save-guide-once.yml .github/patch-settings-save-guide.py
          git commit -m 'fix: make settings save and guide persistence resilient'
          git push origin HEAD:fix/settings-save-guide-persistence
