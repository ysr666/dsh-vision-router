name: Normalize Undici proxy compatibility fix

on:
  push:
    branches: [fix/undici-proxy-env-regression]

permissions:
  contents: write

jobs:
  normalize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/undici-proxy-env-regression
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Normalize proxy block
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.js')
          source = path.read_text()

          agent_lines = [
              '    let cachedAgentUrl',
              '    let cachedAgentPromise',
              '    const agentFor = (url) => {',
              '      if (cachedAgentUrl === url && cachedAgentPromise !== undefined) return cachedAgentPromise',
              '      cachedAgentUrl = url',
              '      // Do not import userland Undici at plugin/module load time. Loading a',
              "      // different Undici major can disturb the dispatcher used by the host's",
              "      // built-in fetch even when Vision Router's own proxy setting is empty.",
              "      // Load ProxyAgent only when this plugin's selective proxy is actually used.",
              "      cachedAgentPromise = import('undici')",
              '        .then(({ ProxyAgent }) => {',
              "          if (typeof ProxyAgent !== 'function') {",
              "            throw new Error('dsh-vision-router: undici ProxyAgent is unavailable')",
              '          }',
              '          return new ProxyAgent(url)',
              '        })',
              '        .catch((error) => {',
              '          if (cachedAgentUrl === url) {',
              '            cachedAgentUrl = undefined',
              '            cachedAgentPromise = undefined',
              '          }',
              '          throw error',
              '        })',
              '      return cachedAgentPromise',
              '    }',
              '    const patchedFetch',
          ]
          agent_replacement = '\n'.join(agent_lines)
          source, count = re.subn(
              r"    let cachedAgentUrl\n    let cachedAgentPromise\n    const agentFor = \(url\) => \{.*?\n    \}\n    const patchedFetch",
              agent_replacement,
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one lazy proxy agent block, found {count}')

          dispatch_lines = [
              '      return agentFor(proxyUrl).then((dispatcher) =>',
              '        originalFetch(input, { ...(init ?? {}), dispatcher }),',
              '      )',
          ]
          dispatch_replacement = '\n'.join(dispatch_lines)
          source, count = re.subn(
              r"      return agentFor\(proxyUrl\)\.then\(\(dispatcher\) =>\n\s*originalFetch\(input, \{ \.\.\.\(init \?\? \{\}\), dispatcher \}\),\n\s*\)",
              dispatch_replacement,
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one lazy proxy dispatch block, found {count}')

          path.write_text(source)

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test

      - name: Commit normalized patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.js
          git commit -m "style: normalize lazy proxy loader"
          git push origin HEAD:fix/undici-proxy-env-regression
