name: Stage Undici proxy compatibility fix

on:
  push:
    branches: [fix/undici-proxy-env-regression]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/undici-proxy-env-regression
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Apply proxy compatibility patch
        shell: python
        run: |
          from pathlib import Path
          import json

          index_path = Path('index.js')
          source = index_path.read_text()

          static_import = "import { ProxyAgent } from 'undici'\n"
          if static_import not in source:
              raise SystemExit('static ProxyAgent import not found')
          source = source.replace(static_import, '', 1)

          old_agent = """    let cachedAgentUrl
              let cachedAgent
              const agentFor = (url) => {
                if (cachedAgentUrl === url && cachedAgent !== undefined) return cachedAgent
                cachedAgentUrl = url
                cachedAgent = new ProxyAgent(url)
                return cachedAgent
              }
          """
          # Triple-quoted YAML/Python indentation is awkward; normalize the exact
          # source fragment explicitly instead of relying on incidental workflow indentation.
          old_agent = "    let cachedAgentUrl\n    let cachedAgent\n    const agentFor = (url) => {\n      if (cachedAgentUrl === url && cachedAgent !== undefined) return cachedAgent\n      cachedAgentUrl = url\n      cachedAgent = new ProxyAgent(url)\n      return cachedAgent\n    }\n"
          new_agent = """    let cachedAgentUrl
              let cachedAgentPromise
              const agentFor = (url) => {
                if (cachedAgentUrl === url && cachedAgentPromise !== undefined) return cachedAgentPromise
                cachedAgentUrl = url
                // Do not import userland Undici at plugin/module load time. Loading a
                // different Undici major can disturb the dispatcher used by the host's
                // built-in fetch even when Vision Router's own proxy setting is empty.
                // Load ProxyAgent only when this plugin's selective proxy is actually used.
                cachedAgentPromise = import('undici')
                  .then(({ ProxyAgent }) => {
                    if (typeof ProxyAgent !== 'function') {
                      throw new Error('dsh-vision-router: undici ProxyAgent is unavailable')
                    }
                    return new ProxyAgent(url)
                  })
                  .catch((error) => {
                    if (cachedAgentUrl === url) {
                      cachedAgentUrl = undefined
                      cachedAgentPromise = undefined
                    }
                    throw error
                  })
                return cachedAgentPromise
              }
          """
          # Remove the workflow indentation embedded in new_agent.
          new_agent = "\n".join(line[10:] if line.startswith('          ') else line for line in new_agent.splitlines()) + "\n"
          if old_agent not in source:
              raise SystemExit('proxy agent fragment not found')
          source = source.replace(old_agent, new_agent, 1)

          old_dispatch = "      return originalFetch(input, { ...(init ?? {}), dispatcher: agentFor(proxyUrl) })\n"
          new_dispatch = """      return agentFor(proxyUrl).then((dispatcher) =>
                originalFetch(input, { ...(init ?? {}), dispatcher }),
              )
          """
          new_dispatch = "\n".join(line[10:] if line.startswith('          ') else line for line in new_dispatch.splitlines()) + "\n"
          if old_dispatch not in source:
              raise SystemExit('proxy dispatch call not found')
          source = source.replace(old_dispatch, new_dispatch, 1)
          index_path.write_text(source)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          old_version = package.get('dependencies', {}).get('undici')
          if old_version != '>=6.15.0':
              raise SystemExit(f'unexpected undici dependency: {old_version!r}')
          package['dependencies']['undici'] = '^7.29.0'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          test_path = Path('tests/manifest-dependencies.test.js')
          tests = test_path.read_text()
          marker = "test('undici stays below v8 and is lazy-loaded for plugin proxy use'"
          if marker not in tests:
              tests += """

          test('undici stays below v8 and is lazy-loaded for plugin proxy use', async () => {
            const pkg = await manifest()
            assert.equal(pkg.dependencies?.undici, '^7.29.0')

            const source = await readFile(new URL('../index.js', import.meta.url), 'utf8')
            assert.doesNotMatch(source, /^\\s*import\\s+.*from\\s+['\"]undici['\"]/m)
            assert.match(source, /import\\(['\"]undici['\"]\\)/)
          })
          """
          test_path.write_text(tests)

      - name: Refresh lockfile and install
        run: pnpm install --no-frozen-lockfile

      - name: Run test suite
        run: pnpm test

      - name: Commit validated patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.js package.json pnpm-lock.yaml tests/manifest-dependencies.test.js
          git commit -m "fix: preserve host HTTPS proxy when vision router loads"
          git push origin HEAD:fix/undici-proxy-env-regression
