name: OCR Mac canonical staging diagnostic
on:
  push:
    branches: [diagnostic/ocr-mac-canonical-staging]
permissions:
  contents: read
concurrency:
  group: ocr-mac-canonical-staging
  cancel-in-progress: true
jobs:
  windows-labels:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test label reconstruction and exact hash rejection
        run: python -I quality/test-native-ocr-canonical-labels.py
      - name: Convert official pinned models and emit only label/format recipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -I quality/native-ocr-clean-conversion.py --work-dir "$env:RUNNER_TEMP/dvr-labels"
          if ($LASTEXITCODE -ne 0) { throw 'CONVERSION_FAILED' }
          python -I quality/native-ocr-canonical-labels.py --mode emit --models "$env:RUNNER_TEMP/dvr-labels/models" --recipe "$env:RUNNER_TEMP/canonical-labels.json"
          if ($LASTEXITCODE -ne 0) { throw 'LABEL_RECIPE_FAILED' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-canonical-label-recipe
          path: ${{ runner.temp }}/canonical-labels.json
          if-no-files-found: error
  mac-stage:
    needs: windows-labels
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-ocr-canonical-label-recipe
          path: ${{ runner.temp }}/recipe
      - name: Rebuild canonical model bytes from independently converted Mac graph
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dvr-native-worker"
          mkdir -p "$root"
          python3 -I quality/native-ocr-clean-conversion.py --work-dir "$root/conversion"
          python3 -I quality/native-ocr-canonical-labels.py --mode rebuild --models "$root/conversion/models" --recipe "$RUNNER_TEMP/recipe/canonical-labels.json" --out "$root/canonical"
          node quality/native-ocr-release-stage.mjs --verify-models --models "$root/canonical"
      - name: Build exact Mac candidate and stage with canonical models
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dvr-native-worker"
          git init "$root/ncnn"
          git -C "$root/ncnn" fetch --depth 1 https://github.com/Tencent/ncnn.git d1f6ac67e9fc91390cc70f7168573fd2626f1d66
          git -C "$root/ncnn" checkout --detach FETCH_HEAD
          git -C "$root/ncnn" submodule update --init --recursive
          export DVR_OCR_NCNN_SOURCE="$root/ncnn"
          export MACOSX_DEPLOYMENT_TARGET=13.0
          DVR_OCR_MAC_BUILD_ROOT="$root/build" bash quality/native-ocr-macos-build-LAB.sh
          node quality/native-ocr-release-stage.mjs --verify-worker --target darwin-arm64 --binary "$root/build/worker"
          python3 -I quality/native-ocr-candidate-fixture.py --output "$root/synthetic.bmp"
          python3 -I quality/native-ocr-candidate-smoke.py --worker "$root/build/worker" --models "$root/canonical" --bmp "$root/synthetic.bmp" --expected 'TEST 123' --report "$root/smoke-canonical-evidence.json"
          node quality/native-ocr-release-stage.mjs --stage --target darwin-arm64 --binary "$root/build/worker" --models "$root/canonical" --out "$root/release-stage"
      - name: Exact archive settings route, actual install, OCR and uninstall
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dvr-native-worker"
          node --test quality/test-native-ocr-staged-acceptance.mjs
          node quality/native-ocr-staged-acceptance.mjs --stage "$root/release-stage" --bmp "$root/synthetic.bmp" --expected 'TEST 123' --report "$root/release-stage/acceptance-evidence.json"
      - name: Save evidence only (never the staged archive, models or worker)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-mac-canonical-stage-evidence
          path: |
            ${{ runner.temp }}/dvr-native-worker/smoke-canonical-evidence.json
            ${{ runner.temp }}/dvr-native-worker/release-stage/staging-evidence.json
            ${{ runner.temp }}/dvr-native-worker/release-stage/acceptance-evidence.json
          if-no-files-found: ignore
