name: Apply structured bootstrap prototype

on:
  push:
    branches: [feat/structured-vision-bootstrap]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply prototype patch
        run: python3 scripts/apply-structured-vision-bootstrap.py
      - name: Check patch formatting
        run: git diff --check
      - name: Run focused tests
        run: node --test tests/structured-bootstrap.test.js
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js lib/client.js package.json
          git commit -m "feat: add opt-in structured vision bootstrap"
          git push origin HEAD:${GITHUB_REF_NAME}
