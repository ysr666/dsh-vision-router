name: Repro issue 160

on:
  push:
    branches:
      - fix/issue-160-host-routes
    paths:
      - .github/workflows/repro-issue160.yml

jobs:
  isolate-webserver-wrapper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install DSH rc.6
        shell: bash
        run: npm install --global @deepseek-ai/dsh@0.1.0-rc.6
      - name: Bypass only the stabilizer webServer child-context wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/local-vision-stabilizer.js')
          s = p.read_text()
          start_marker = "          if (Array.isArray(deps) && deps.includes('webServer') && childCtx?.webServer) {"
          end_marker = "          return callback(wrapped)"
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
          node --check lib/local-vision-stabilizer.js
      - name: Pack experimental plugin
        shell: bash
        run: |
          npm pack --json > pack.json
          node -e "const p=require('./pack.json'); if(!p[0]?.filename) process.exit(1); console.log(p[0].filename)" > tarball.txt
      - name: Install experimental plugin and probe host routes
        shell: bash
        run: |
          set -eu
          TARBALL="$(cat tarball.txt)"
          dsh plugin --profile web add "./$TARBALL"

          dsh web > dsh-issue160.log 2>&1 &
          DSH_PID=$!
          cleanup() { kill "$DSH_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3080/ >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$DSH_PID" >/dev/null 2>&1; then cat dsh-issue160.log || true; exit 1; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { cat dsh-issue160.log || true; exit 1; }

          assert_json_get() {
            route="$1"
            code="$(curl -sS -o body.txt -w '%{http_code}' "http://127.0.0.1:3080$route")"
            echo "GET $route -> $code"
            head -c 250 body.txt || true
            echo
            [ "$code" = 200 ]
            grep -qi '^{' body.txt
          }

          assert_json_get '/_dsh/vision-router/update-check?force=1'
          assert_json_get '/_dsh/vision-router/model-capabilities'

          code="$(curl -sS -X POST -o body.txt -w '%{http_code}' http://127.0.0.1:3080/_dsh/vision-router/self-update)"
          echo "POST self-update -> $code"
          cat body.txt || true
          echo
          [ "$code" = 403 ]
          grep -q 'invalid update token' body.txt

          code="$(curl -sS -o body.txt -w '%{http_code}' http://127.0.0.1:3080/_dsh/vision-router/test-connection)"
          echo "GET test-connection -> $code"
          head -c 250 body.txt || true
          echo
          [ "$code" = 200 ] || [ "$code" = 502 ]
          grep -qi '^{' body.txt

          echo '===== vision-router log ====='
          cat "$HOME/.dsh/logs/vision-router/vision-router.log" 2>/dev/null || true
          echo '===== dsh stdout/stderr ====='
          cat dsh-issue160.log || true
