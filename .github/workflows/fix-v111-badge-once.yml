name: fix-v111-badge-once

on:
  push:
    branches: [docs/v1.1.1-test-badge]
    paths:
      - .github/workflows/fix-v111-badge-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/v1.1.1-test-badge
      - name: Correct verified test count
        run: |
          sed -i 's/verified-101%20tests/verified-102%20tests/g; s/Verified: 101 tests/Verified: 102 tests/g' README.md README.zh.md
          rm .github/workflows/fix-v111-badge-once.yml
          git config user.name "Shirui"
          git config user.email "77105194+ysr666@users.noreply.github.com"
          git add README.md README.zh.md .github/workflows/fix-v111-badge-once.yml
          git commit -m "docs: correct v1.1.1 verified test count"
          git push origin HEAD:docs/v1.1.1-test-badge
