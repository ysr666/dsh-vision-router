name: DSH 0.1.7 browser smoke

on:
  pull_request:
    paths:
      - 'lib/public-entry.js'
      - 'lib/dsh-settings-017-compat.js'
      - 'lib/settings-client-017-compat.js'
      - 'lib/session-message-source-compat.js'
      - 'lib/web/**'
      - 'lib/client.js'
      - 'lib/*-client-prelude.js'
      - 'scripts/alpha-browser-cold-toggle-smoke.mjs'
      - 'scripts/dsh-preview-mixed-attachment-paste-smoke.mjs'
      - 'scripts/dsh-preview-settings-browser-lifecycle-smoke.mjs'
      - '.github/workflows/dsh-017-browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'lib/public-entry.js'
      - 'lib/dsh-settings-017-compat.js'
      - 'lib/settings-client-017-compat.js'
      - 'lib/session-message-source-compat.js'
      - 'lib/web/**'
      - 'lib/client.js'
      - 'lib/*-client-prelude.js'
      - 'scripts/alpha-browser-cold-toggle-smoke.mjs'
      - 'scripts/dsh-preview-mixed-attachment-paste-smoke.mjs'
      - 'scripts/dsh-preview-settings-browser-lifecycle-smoke.mjs'
      - '.github/workflows/dsh-017-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rc1-browser:
    name: DSH 0.1.7-rc.1 real Host + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr

      - name: Checkout exact DSH 0.1.7-rc.1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 46a7f68b0922371ce7144b668b90e377d8e799f4
          persist-credentials: false
          path: dsh-preview

      - name: Install upstream package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Install Node 22 browser runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: dsh-preview/pnpm-lock.yaml

      - name: Compute exact DSH web build cache key
        id: dsh-build-key
        working-directory: dsh-preview
        shell: bash
        run: |
          set -euo pipefail
          DSH_SHA="$(git rev-parse HEAD)"
          LOCK_SHA="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          TREE_SHA="$(git ls-tree -r --full-tree HEAD | sha256sum | awk '{print $1}')"
          KEY="dsh-web-v3-${RUNNER_OS}-node22-pnpm11.7.0-${DSH_SHA}-${LOCK_SHA}-${TREE_SHA}"
          printf 'key=%s\n' "$KEY" >> "$GITHUB_OUTPUT"

      - name: Install exact Host workspace dependencies
        working-directory: dsh-preview
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile

      - name: Restore trusted DSH web build cache
        id: dsh-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-preview/lib
            dsh-preview/packages/*/*/lib
            dsh-preview/vendor/*/lib
            dsh-preview/apps/*/lib
            dsh-preview/apps/web/dist
            dsh-preview/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}

      - name: Build exact DSH 0.1.7 web runtime
        if: steps.dsh-build-cache.outputs.cache-hit != 'true'
        working-directory: dsh-preview
        run: pnpm run build

      - name: Install Chromium for DSH Playwright
        working-directory: dsh-preview
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Run cold Vision toggle against exact 0.1.7 Host
        id: smoke
        working-directory: dsh-preview
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-preview
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.1.7-rc.1
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh017-browser-smoke-diagnostic.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh017-browser-smoke-page.png
        run: node ../dvr/scripts/alpha-browser-cold-toggle-smoke.mjs

      - name: Run mixed text + image + generic-file paste lifecycle
        working-directory: dsh-preview
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-preview
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.1.7-rc.1
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh017-browser-smoke-mixed-diagnostic.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh017-browser-smoke-mixed-page.png
        run: node ../dvr/scripts/dsh-preview-mixed-attachment-paste-smoke.mjs

      - name: Run real Settings mount, save, reload, and readback lifecycle
        working-directory: dsh-preview
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-preview
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.1.7-rc.1
          DVR_SETTINGS_017_TRACE: '1'
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh017-browser-smoke-settings-diagnostic.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh017-browser-smoke-settings-page.png
        run: node ../dvr/scripts/dsh-preview-settings-browser-lifecycle-smoke.mjs

      - name: Upload classified browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-017-browser-diagnostic
          path: ${{ runner.temp }}/dsh017-browser-smoke-*
          if-no-files-found: ignore
          retention-days: 2

      - name: Fail with classified cold-smoke detail
        if: steps.smoke.outputs.status == 'fail'
        env:
          SMOKE_STAGE: ${{ steps.smoke.outputs.stage }}
          SMOKE_KIND: ${{ steps.smoke.outputs.kind }}
          SMOKE_DETAIL: ${{ steps.smoke.outputs.detail }}
        run: |
          printf 'stage=%s\nkind=%s\n%s\n' "$SMOKE_STAGE" "$SMOKE_KIND" "$SMOKE_DETAIL"
          exit 1
