name: Apply dynamic wrapper delegate fix

on:
  push:
    branches:
      - fix/dynamic-wrapper-delegate

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dynamic-wrapper-delegate
          fetch-depth: 0

      - name: Apply focused source and regression patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.js')
          source = index.read_text()

          old_effort = "      const effortKey = `${delegateProvider}\\u0000${options.model ?? ''}`"
          new_effort = "      const currentDelegateProvider = liveValue(delegateProvider)\n      const effortKey = `${currentDelegateProvider}\\u0000${options.model ?? ''}`"
          if source.count(old_effort) != 1:
              raise SystemExit(f'expected exactly one stale effort key, found {source.count(old_effort)}')
          source = source.replace(old_effort, new_effort)

          old_dispatch = "        provider: delegateProvider,\n        messages: rewritten,"
          new_dispatch = "        provider: currentDelegateProvider,\n        messages: rewritten,"
          if source.count(old_dispatch) != 1:
              raise SystemExit(f'expected exactly one stale delegate dispatch, found {source.count(old_dispatch)}')
          source = source.replace(old_dispatch, new_dispatch)

          old_wrapper = "        delegateProvider: textProviderRoute(),"
          new_wrapper = "        delegateProvider: textProviderRoute,"
          if source.count(old_wrapper) != 1:
              raise SystemExit(f'expected exactly one eager text provider capture, found {source.count(old_wrapper)}')
          source = source.replace(old_wrapper, new_wrapper)
          index.write_text(source)

          test_file = Path('tests/runtime-e2e.test.js')
          tests = test_file.read_text()
          marker = "test('wrapper resolves delegate provider getter on every stream and partitions reasoning memory', async () => {"
          if marker not in tests:
              tests += r'''

// Regression: the special DeepSeek + 自动识图 wrapper must not capture the
// text provider at plugin apply time. Settings can switch the text provider
// to a relay later, and stream routing + reasoning memory must follow it.
test('wrapper resolves delegate provider getter on every stream and partitions reasoning memory', async () => {
  const calls = []
  const ctx = fakeCtx()
  ctx.llm = {
    stream: async function* (options) {
      calls.push(options)
      yield { type: 'finish', reason: { kind: 'stop' } }
    },
  }

  let delegateProvider = 'deepseek-official'
  const wrapper = createWrapperStreamBody(ctx, {
    imageMemory: new Map(),
    delegateProvider: () => delegateProvider,
  })
  const base = {
    model: 'deepseek-v4-pro',
    messages: [{ role: 'user', content: [{ type: 'text', text: 'hello' }] }],
  }
  const drain = async (stream) => {
    for await (const _chunk of stream) {
      // exhaust the delegated stream
    }
  }

  await drain(wrapper.stream({ ...base, reasoningEffort: 'high' }))
  delegateProvider = 'relay-openai'
  await drain(wrapper.stream(base))
  await drain(wrapper.stream({ ...base, reasoningEffort: 'low' }))
  delegateProvider = 'deepseek-official'
  await drain(wrapper.stream(base))

  assert.deepEqual(calls.map((call) => call.provider), [
    'deepseek-official',
    'relay-openai',
    'relay-openai',
    'deepseek-official',
  ])
  assert.equal(calls[0].reasoningEffort, 'high')
  assert.equal(calls[1].reasoningEffort, undefined)
  assert.equal(calls[2].reasoningEffort, 'low')
  assert.equal(calls[3].reasoningEffort, 'high')
})
'''
              test_file.write_text(tests)
          PY

          git diff --check
          git diff -- index.js tests/runtime-e2e.test.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite
        run: pnpm test

      - name: Commit verified fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-dynamic-wrapper-delegate.yml
          git add index.js tests/runtime-e2e.test.js
          git commit -m "fix: keep auto-vision delegate in sync with text provider"
          git push origin HEAD:fix/dynamic-wrapper-delegate
