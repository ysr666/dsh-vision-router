name: Star History

on:
  push:
    paths:
      - '.github/workflows/star-history.yml'
  schedule:
    - cron: '17 */6 * * *'
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  star-history:
    if: github.repository == 'ysr666/dsh-vision-router'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: star-history

      - uses: narayann7/star-history-action@a68d8f9d67ca20d55b682a264e69152dcf326e9c # v1.0.5
        with:
          repos: ${{ github.repository }}
          output-dir: assets/star-history
          width: '1000'
          update-readme: 'false'
          commit: 'true'
          commit-message: 'chore: update star history [skip ci]'
