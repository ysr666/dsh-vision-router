name: Architecture Closure

on:
  pull_request:
    paths:
      - 'entry.js'
      - 'index.js'
      - 'lib/public-entry.js'
      - 'lib/runtime-composition.js'
      - 'lib/core-vision-surface.js'
      - 'lib/session-vision-*.js'
      - 'lib/session-surface-policy.js'
      - 'lib/legacy-core-vision-policy-bridge.js'
      - 'lib/vision-provider-transport.js'
      - 'lib/http-compat.js'
      - 'lib/catalog-corrections.js'
      - 'lib/web/**'
      - 'lib/vision-routing-runtime.js'
      - 'lib/vision-routing-evidence.js'
      - 'lib/vision-capability-benchmark-service.js'
      - 'lib/vision-capability-benchmark-client.js'
      - 'lib/vision-capability-benchmark-presentation.js'
      - 'lib/vision-product-presentation.js'
      - 'docs/architecture/**'
      - 'tests/architecture-contract-baseline.test.js'
      - 'tests/compat-inventory-completeness.test.js'
      - 'tests/final-architecture-closure.test.js'
      - 'tests/core-vision-surface-parity.test.js'
      - 'tests/settings-impersonation-closure.test.js'
      - 'tests/presentation-convergence-parity.test.js'
      - 'tests/presentation-switch.test.js'
      - 'tests/capability-shadow-retirement.test.js'
      - 'tests/vision-routing-runtime-parity.test.js'
      - 'tests/session-runtime-core-wiring.test.js'
      - 'tests/session-vision-runtime-parity.test.js'
      - 'tests/vision-execution-order-core-wiring.test.js'
      - 'tests/session-vision-state-integration.test.js'
      - 'tests/session-surface-policy.test.js'
      - 'tests/session-vision-index.test.js'
      - 'tests/vision-artifact-store.test.js'
      - 'tests/vision-provider-transport.test.js'
      - 'tests/issue-289-native-nonintervention.test.js'
      - '.github/workflows/architecture-closure.yml'
  push:
    branches: [main]
    paths:
      - 'entry.js'
      - 'index.js'
      - 'lib/public-entry.js'
      - 'lib/runtime-composition.js'
      - 'lib/core-vision-surface.js'
      - 'lib/session-vision-*.js'
      - 'lib/session-surface-policy.js'
      - 'lib/legacy-core-vision-policy-bridge.js'
      - 'lib/vision-provider-transport.js'
      - 'lib/http-compat.js'
      - 'lib/catalog-corrections.js'
      - 'lib/web/**'
      - 'lib/vision-routing-runtime.js'
      - 'lib/vision-routing-evidence.js'
      - 'lib/vision-capability-benchmark-service.js'
      - 'lib/vision-capability-benchmark-client.js'
      - 'lib/vision-capability-benchmark-presentation.js'
      - 'lib/vision-product-presentation.js'
      - 'docs/architecture/**'
      - 'tests/architecture-contract-baseline.test.js'
      - 'tests/compat-inventory-completeness.test.js'
      - 'tests/final-architecture-closure.test.js'
      - 'tests/core-vision-surface-parity.test.js'
      - 'tests/settings-impersonation-closure.test.js'
      - 'tests/presentation-convergence-parity.test.js'
      - 'tests/presentation-switch.test.js'
      - 'tests/capability-shadow-retirement.test.js'
      - 'tests/vision-routing-runtime-parity.test.js'
      - 'tests/session-runtime-core-wiring.test.js'
      - 'tests/session-vision-runtime-parity.test.js'
      - 'tests/vision-execution-order-core-wiring.test.js'
      - 'tests/session-vision-state-integration.test.js'
      - 'tests/session-surface-policy.test.js'
      - 'tests/session-vision-index.test.js'
      - 'tests/vision-artifact-store.test.js'
      - 'tests/vision-provider-transport.test.js'
      - 'tests/issue-289-native-nonintervention.test.js'
      - '.github/workflows/architecture-closure.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frozen external and cross-boundary contracts
        run: >-
          node --test
          tests/architecture-contract-baseline.test.js
          tests/compat-inventory-completeness.test.js
          tests/final-architecture-closure.test.js
          tests/core-vision-surface-parity.test.js
          tests/settings-impersonation-closure.test.js
          tests/presentation-convergence-parity.test.js
          tests/presentation-switch.test.js
          tests/capability-shadow-retirement.test.js
          tests/session-runtime-core-wiring.test.js
          tests/session-vision-runtime-parity.test.js
          tests/vision-execution-order-core-wiring.test.js
          tests/session-vision-state-integration.test.js
          tests/session-surface-policy.test.js
          tests/session-vision-index.test.js
          tests/vision-artifact-store.test.js
          tests/vision-provider-transport.test.js
          tests/issue-289-native-nonintervention.test.js
