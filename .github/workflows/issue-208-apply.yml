name: Issue 208 staged refactor

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/issue-208-resource-governor' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-208-resource-governor
          fetch-depth: 0

      - name: Check whether final polish already landed
        id: guard
        shell: bash
        run: |
          if grep -q "SessionVisionStateStore 管理" index.js; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply final runtime polish
        if: steps.guard.outputs.skip != 'true'
        run: |
          node scripts/issue-208-polish.mjs
          node --check index.js
          pnpm test

      - name: Commit and push polish
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "chore: align vision memory comments with bounded policy"
          git push origin HEAD:agent/issue-208-resource-governor
