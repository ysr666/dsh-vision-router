name: "Issue 877 Windows Desktop RC upgrade differential"

# Isolated evidence only: immutable published npm DVR 3.2.1 -> 3.4.0;
# no production mutations, GitHub release, tags or protected-branch changes.
on:
  push:
    branches: [diagnostics/issue-877-rc1-rc3-upgrade]
    paths:
      - ".github/workflows/issue-877-rc1-rc3-upgrade-differential.yml"
      - "scripts/issue-877-desktop-upgrade-probe.mjs"

permissions:
  contents: read

jobs:
  desktop-hmr-upgrade:
    name: "Windows update published DVR / DSH ${{ matrix.dsh }} / Node24.21"
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh: 0.2.2-rc.1
            commit: 66491b05e3f05ad35bcdd4f6cd7ed26041d9e3db
          - dsh: 0.2.2-rc.3
            commit: 38a6a5c965aa99ab525161efb7cc5cf1fe62fced
          - dsh: 0.2.2-rc.4
            commit: 3f321d32bfe382212a8ed8785c1d47a5a300aa23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.commit }}
          persist-credentials: false
          path: dsh-host
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
      - name: Validate exact immutable DSH release
        working-directory: dsh-host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.commit }}"
          test "$(node -p "require('./package.json').version")" = "${{ matrix.dsh }}"
      - name: Install diagnostic dependencies
        working-directory: dvr
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build exact DSH Desktop Host
        working-directory: dsh-host
        env:
          CI: "true"
          LEFTHOOK: "0"
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Upgrade actual npm 3.2.1 to 3.4.0 through live HMR PluginManager
        working-directory: dsh-host
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-host
          DSH_EXPECTED_VERSION: ${{ matrix.dsh }}
          DVR_DESKTOP_BASE_PORT: "19763"
        run: node --import tsx ../dvr/scripts/issue-877-desktop-upgrade-probe.mjs
