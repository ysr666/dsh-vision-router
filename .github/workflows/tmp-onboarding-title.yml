name: tmp-onboarding-title
on:
  push:
    branches:
      - fix/onboarding-ready-title
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onboarding-ready-title
      - name: Update title and verify
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = 'lib/client.js'
          let source = fs.readFileSync(path, 'utf8')
          const zhOld = "onboardingTitle: '先分清：聊天的模型 ≠ 看图的模型 🎉'"
          const zhNew = "onboardingTitle: 'Vision Router 已准备好 🎉'"
          const enOld = "onboardingTitle: 'First: the chat model ≠ the vision model 🎉'"
          const enNew = "onboardingTitle: 'Vision Router is ready 🎉'"
          if (!source.includes(zhOld) || !source.includes(enOld)) throw new Error('expected onboarding titles not found')
          source = source.replace(zhOld, zhNew).replace(enOld, enNew)
          fs.writeFileSync(path, source)
          NODE
          node --check lib/client.js
      - name: Commit final change and remove temporary workflow
        run: |
          rm .github/workflows/tmp-onboarding-title.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js .github/workflows/tmp-onboarding-title.yml
          git commit -m "fix: restore ready onboarding title"
          git push origin HEAD:fix/onboarding-ready-title
