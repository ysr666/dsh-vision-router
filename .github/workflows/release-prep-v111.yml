name: release-prep-v111

on:
  push:
    branches: [release/v1.1.1]
    paths:
      - .github/workflows/release-prep-v111.yml

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.1.1
          fetch-depth: 0
      - name: Merge current main
        run: |
          git fetch origin main
          git merge --no-edit origin/main
      - name: Prepare v1.1.1 metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.version = '1.1.1'
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')

          function replaceExact(path, from, to) {
            let s = fs.readFileSync(path, 'utf8')
            if (!s.includes(from)) throw new Error(`${path}: missing expected text: ${from}`)
            s = s.replace(from, to)
            fs.writeFileSync(path, s)
          }

          for (const path of ['README.md', 'README.zh.md']) {
            let s = fs.readFileSync(path, 'utf8')
            s = s.replaceAll('releases/tag/v1.1.0', 'releases/tag/v1.1.1')
                 .replaceAll('release-v1.1.0', 'release-v1.1.1')
                 .replaceAll('Release v1.1.0', 'Release v1.1.1')
                 .replaceAll('verified-94%20tests', 'verified-101%20tests')
                 .replaceAll('Verified: 94 tests', 'Verified: 101 tests')
            fs.writeFileSync(path, s)
          }

          replaceExact(
            'README.md',
            '> 📌 **Announcement (v1.1.0)**\n>\n> Now supports **Extra vision wrappers**: any custom text route (e.g. opencode) sends images out of the box — plus long-screenshot OCR, a "Test connection" button and artifact preview cards in the settings panel. Stealth mode is off by default and the official DeepSeek row is no longer taken over implicitly.',
            '> 📌 **Announcement (v1.1.1)**\n>\n> Existing DSH providers are now **auto-wrapped on install**: text-only routes gain paste-and-go vision automatically, while native multimodal models keep their original image input and use Vision Router tools only when useful. Windows sharp/libvips startup conflicts are fixed by sharing the host sharp; install/update docs now distinguish npm/npx from source-checkout pnpm usage.'
          )
          replaceExact(
            'README.zh.md',
            '> 📌 **公告（v1.1.0）**\n>\n> 现已支持「**额外识图包装**」：opencode 等任意自定义文本路由开箱即可发图；另含长截图 OCR、设置卡片「测试连接」与视觉产物预览卡。隐身模式默认关闭，官方 DeepSeek 行不再被默认接管。',
            '> 📌 **公告（v1.1.1）**\n>\n> 现在安装后会**自动包装 DSH 已有模型**：纯文本路由自动获得粘贴即用的识图入口，原生多模态模型保留原图直传，仅在需要精确定位 / OCR / 像素验证时按需使用 Vision Router 工具。另修复 Windows sharp/libvips 启动冲突，并补齐 npm/npx 与源码 pnpm 两套安装/升级指引。'
          )

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          if (!changelog.includes('## v1.1.1')) {
            const marker = '\n## v1.1.0\n'
            if (!changelog.includes(marker)) throw new Error('CHANGELOG.md: v1.1.0 marker missing')
            const entry = `\n## v1.1.1\n\n### 新增 / Added\n\n- **已有模型自动包装**：安装后自动发现 DSH 当前已注册的 provider / model，并为它们生成「+ 自动识图」入口；后续新增或移除 provider 时也会随 \`llm/adapters-updated\` 动态同步，不再要求用户逐个填写「额外识图包装」。\n- **Automatic wrapping for existing models**: on install, discover the providers/models already registered in DSH and create \`+ auto vision\` twins automatically; later provider changes sync on \`llm/adapters-updated\`, so users no longer have to add every route manually.\n- **原生多模态采用软增强**：GLM 等本来就能看图的模型仍会生成自动识图入口，但原图继续直接传给源模型；grounding / crop / OCR / pixel diff 等工具只是按需增强，不再强制先图转文。\n- **Native multimodal soft enhancement**: models such as GLM still get an auto-vision entry, but their original image blocks pass through unchanged; grounding/crop/OCR/pixel-diff tools are optional precision aids rather than a forced image-to-text bridge.\n\n### 修复 / Fixed\n\n- **Windows sharp/libvips 冲突（#42）**：插件不再自带第二套 native \`sharp\`，改为通过 peer dependency 复用 DSH 宿主的 \`sharp >=0.35.3\`；Windows / macOS / Linux 均增加真实打包安装 + PNG 处理回归测试。\n- **Windows sharp/libvips conflict (#42)**: the plugin no longer installs a second native \`sharp\`; it uses the DSH host \`sharp >=0.35.3\` through a peer dependency, with packed-install + PNG smoke tests on Windows, macOS and Linux.\n- 安装 / 升级文档区分普通 npm/npx 用户与 DSH 源码 pnpm 用户，并补充 v0.x 手动 \`insert\` 升级到 bundle patch 时的重复挂载迁移说明。\n- Install/upgrade docs now distinguish normal npm/npx usage from source-checkout pnpm usage and document migration from the old v0.x manual \`insert\` to the bundle patch.\n`
            changelog = changelog.replace(marker, entry + marker)
            fs.writeFileSync('CHANGELOG.md', changelog)
          }
          NODE
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/release-prep-v111.yml
          git config user.name "Shirui"
          git config user.email "77105194+ysr666@users.noreply.github.com"
          git add package.json README.md README.zh.md CHANGELOG.md .github/workflows/release-prep-v111.yml
          git commit -m "release: prepare v1.1.1"
          git push origin HEAD:release/v1.1.1
