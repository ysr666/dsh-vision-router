name: Hotfix keyed settings slot

on:
  push:
    branches:
      - fix/key-settings-plugin-slot
    paths:
      - .github/workflows/hotfix-keyed-slot.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/key-settings-plugin-slot
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Patch keyed settings slot and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path('lib/client.js')
          text = client.read_text()
          old = """                name: 'settings.plugin.item',\n                id: 'vision-router',\n                order: 30,"""
          new = """                name: 'settings.plugin.item',\n                key: 'vision-router',\n                id: 'vision-router',\n                order: 30,"""
          assert text.count(old) == 1, f'expected one settings slot registration, got {text.count(old)}'
          client.write_text(text.replace(old, new))

          tests = Path('tests/client.test.js')
          source = tests.read_text()
          marker = "keyed settings.plugin.item requires an explicit slot key"
          if marker not in source:
              source += """\n\ntest('keyed settings.plugin.item requires an explicit slot key', () => {\n  const source = readFileSync(new URL('../lib/client.js', import.meta.url), 'utf8')\n  assert.match(source, /name: 'settings\\.plugin\\.item',\\s*key: 'vision-router',\\s*id: 'vision-router'/)\n})\n"""
              tests.write_text(source)
          PY
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate syntax and diff
        run: |
          node --check lib/client.js
          git diff --check
      - name: Run full tests
        run: pnpm test
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js tests/client.test.js
          git commit -m "fix: key the settings plugin slot"
          git push origin HEAD:fix/key-settings-plugin-slot
