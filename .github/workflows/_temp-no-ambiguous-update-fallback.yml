name: Patch no ambiguous update fallback
"on":
  push:
    branches:
      - fix/no-ambiguous-update-fallback
    paths:
      - .github/workflows/_temp-no-ambiguous-update-fallback.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused patch
        run: python3 .github/_temp_no_ambiguous_patch.py
      - name: Verify focused patch
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          node --check lib/client.js
          node --check lib/update-check.js
          git diff --check
          pnpm test
      - name: Commit focused patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp-no-ambiguous-update-fallback.yml
          rm .github/_temp_no_ambiguous_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: require exact version for update recovery"
          git push origin HEAD:fix/no-ambiguous-update-fallback
