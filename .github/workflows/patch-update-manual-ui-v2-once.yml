name: Patch manual update UI v2 once

on:
  push:
    branches:
      - ui/update-manual-card-v2
    paths:
      - .github/workflows/patch-update-manual-ui-v2-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/update-manual-card-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Apply patch
        run: python .github/patch_update_manual_ui.py
      - name: Verify
        run: |
          pnpm install --frozen-lockfile
          node --check lib/client.js
          git diff --check
          pnpm test
      - name: Commit patch
        run: |
          rm .github/workflows/patch-update-manual-ui-v2-once.yml
          rm .github/patch_update_manual_ui.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/client.js tests/client.test.js .github/workflows/patch-update-manual-ui-v2-once.yml .github/patch_update_manual_ui.py
          git commit -m 'style: clean up manual update command panel'
          git push origin HEAD:ui/update-manual-card-v2
