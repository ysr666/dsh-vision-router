name: P2 depth settings migration

on:
  push:
    branches:
      - fix/p2-depth-settings-contract

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/p2-depth-settings-contract
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.20.0
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repair guarded matcher
        run: node .github/scripts/p2-depth-settings-migrate-fix.mjs
      - name: Apply guarded P2 migration
        run: node .github/scripts/p2-depth-settings-migrate.mjs
      - name: Make the final Settings IA own depth semantics
        run: node .github/scripts/p2-depth-settings-ia-migrate.mjs
      - name: Run focused P2 regression suite
        run: |
          node --test \
            tests/depth-tier.test.js \
            tests/vision-turn-budget-client-prelude.test.js \
            tests/settings-section-order.test.js \
            tests/alpha1-browser-lifecycle-integration.test.js \
            tests/runtime-i18n.test.js \
            tests/client.test.js
      - name: Run full suite
        run: pnpm test
      - name: Commit migrated sources
        run: |
          rm -f .github/scripts/p2-depth-settings-migrate-fix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(settings): make vision depth controls first-class"
          git push origin HEAD:fix/p2-depth-settings-contract
