name: Finalize PR 98 integration

on:
  push:
    branches:
      - integrate/pr98-final

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integrate/pr98-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Apply verified integration patch
        run: python scripts/finalize-pr98.py

      - run: pnpm install --frozen-lockfile

      - name: Run full suite including PR 98 regressions
        run: pnpm test

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/finalize-pr98-integration.yml scripts/finalize-pr98.py
          git add index.js lib/client.js package.json README.md README.zh.md
          git commit -m "fix: integrate #98 with current settings and 1+x semantics"
          git push origin HEAD:integrate/pr98-final
