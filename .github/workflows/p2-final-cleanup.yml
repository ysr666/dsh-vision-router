name: P2 final diff cleanup

on:
  push:
    branches:
      - fix/p2-depth-settings-contract

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/p2-depth-settings-contract
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Remove stale quota comments and package newline noise
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'index.js'
          let source = fs.readFileSync(file, 'utf8')
          function replaceOnce(search, replacement, label) {
            const first = source.indexOf(search)
            if (first === -1) throw new Error(`${label}: pattern not found`)
            if (source.indexOf(search, first + search.length) !== -1) throw new Error(`${label}: pattern duplicated`)
            source = source.slice(0, first) + replacement + source.slice(first + search.length)
          }
          replaceOnce(
            `/**\n * 看图深度档位（移植自 dsh-vision 的 PRECISION 概念）：档位定「深挖轮数\n * 上限」，bootstrap 那一遍不计入。fast=1、deep=4、standard=不硬拦（现状\n * 行为，仅提示词引导）。undefined = 不设硬上限。\n */\nexport { depthLimitFor } from './lib/depth-guidance.js'`,
            `/**\n * 兼容导出：depthLimitFor 仍保留给历史直接 index.js 使用者。当前 fast /\n * standard / deep 只选择查证策略；只有显式 visionDepthMaxCalls > 0 时才\n * 返回独立调用上限，0 / 未设置表示不限。\n */\nexport { depthLimitFor } from './lib/depth-guidance.js'`,
            'depthLimitFor compatibility comment',
          )
          replaceOnce(
            `                  // 档位深度上限：fast/deep 硬拦、standard 不拦（现状行为）。\n                  // bootstrap 那 1 遍不计入；只数 evidence 深挖工具（structuredFollowupEvidenceTools）。`,
            `                  // 识图档位不在这里做调用次数拦截；显式 visionDepthMaxCalls 由\n                  // structured-flow hardening 统一执行，避免与 evidence 完成状态重复计数。`,
            'obsolete inner quota comment',
          )
          for (const stale of ['fast/deep 硬拦', 'fast=1、deep=4']) {
            if (source.includes(stale)) throw new Error(`stale quota semantics remain: ${stale}`)
          }
          fs.writeFileSync(file, source)

          const pkgFile = 'package.json'
          let pkg = fs.readFileSync(pkgFile, 'utf8')
          const semantic = JSON.stringify(JSON.parse(pkg))
          if (pkg.endsWith('\n')) pkg = pkg.slice(0, -1)
          if (JSON.stringify(JSON.parse(pkg)) !== semantic) throw new Error('package newline cleanup changed semantics')
          fs.writeFileSync(pkgFile, pkg)
          NODE
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quota ownership regression
        run: node --test tests/depth-tier.test.js tests/depth-quota-behavior.test.js tests/structured-flow-hardening.test.js tests/alpha1-browser-lifecycle-integration.test.js
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/p2-final-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove stale depth quota wording"
          git push origin HEAD:fix/p2-depth-settings-contract
