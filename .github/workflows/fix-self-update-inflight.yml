name: Fix self-update inFlight cleanup

on:
  push:
    branches: [agent/update-check-settings]
    paths:
      - .github/workflows/fix-self-update-inflight.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/update-check-settings
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fix-self-update-inflight.mjs
      - run: pnpm test
      - run: rm scripts/fix-self-update-inflight.mjs .github/workflows/fix-self-update-inflight.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.js scripts/fix-self-update-inflight.mjs .github/workflows/fix-self-update-inflight.yml
          git commit -m "fix: clean up failed self-update requests safely"
          git push
