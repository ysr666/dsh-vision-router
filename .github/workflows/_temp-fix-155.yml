name: Apply issue 155 fix
"on":
  push:
    branches:
      - "fix/issue-155-settings-mutate-loop"
    paths:
      - ".github/workflows/_temp-fix-155.yml"
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-155-settings-mutate-loop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
      - name: Apply patch
        run: python3 .github/scripts/_temp-fix155.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js tests/client.test.js
          git commit -m "fix: stop hidden settings mutate loops (#155)"
          git push origin HEAD:fix/issue-155-settings-mutate-loop
