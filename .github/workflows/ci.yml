name: CI

on:
  push:
    branches: [main, 3.0, feat/auto-wrap-providers]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # Required test (24.9)/(24.21) checks must be emitted for every PR, including docs-only PRs.
  # Keep push path filtering to avoid redundant post-merge builds.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.9.0', '24.21.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build canonical runtime artifacts
        run: pnpm build
      - name: Verify generated runtime artifacts
        run: pnpm build:check
      - name: Verify reproducible clean build
        if: matrix.node == '24.9.0'
        run: pnpm build:reproducible
      - name: Typecheck Host and Client contracts
        if: matrix.node == '24.9.0'
        run: pnpm typecheck
      - name: Lint canonical source ownership
        if: matrix.node == '24.9.0'
        run: pnpm lint
      - name: Verify source-to-artifact evidence
        if: matrix.node == '24.9.0'
        run: pnpm source:artifact:check
      - name: Verify generated browser source
        if: matrix.node == '24.9.0'
        run: pnpm client:check
      - run: pnpm test

  # PR-head checkout AND Git fetch can trigger medium CodeQL findings.
  # Read-only GitHub REST API supplies pinned JSON and exhaustive change paths.
  # Only the base-commit classifier executable is run.
  host_impact:
    name: trusted-base Host impact
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Read-only API data. PR-head Git checkout/fetch is forbidden in this job.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Classify changes using immutable base source and API metadata
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            printf 'heavy=true\nreason=main-push-requires-host\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo '::error::Invalid PR/base/head identity'; exit 1
          fi
          api="repos/${GITHUB_REPOSITORY}"
          gh api "$api/pulls/$PR_NUMBER" > "$RUNNER_TEMP/impact-pr-before.json"
          jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" \
            '.base.sha == $base and .head.sha == $head and (.changed_files | type == "number" and . >= 1)' \
            "$RUNNER_TEMP/impact-pr-before.json" >/dev/null
          count="$(jq -r '.changed_files' "$RUNNER_TEMP/impact-pr-before.json")"
          # API file listings stop at a single 100-file page here; a larger
          # PR is always heavy, never classified from partial evidence.
          if (( count > 100 )); then
            printf 'heavy=true\nreason=more-than-100-changed-paths\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "$api/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/impact-files.json"
          # All renames/copies/unknown statuses are heavy. This also blocks
          # source-to-doc renames from masquerading as documentation-only.
          if ! jq -e --argjson n "$count" '
            (length == $n) and
            all(.[]; (.filename | type == "string") and
              (.filename | contains("\n") | not) and
              (.filename | contains("\r") | not) and
              (.status == "added" or .status == "modified" or .status == "removed" or .status == "changed"))
          ' "$RUNNER_TEMP/impact-files.json" >/dev/null; then
            printf 'heavy=true\nreason=unknown-or-renamed-paths\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r '.[].filename' "$RUNNER_TEMP/impact-files.json" > "$RUNNER_TEMP/changed-paths.txt"
          # Check again for PR-head/base races before permitting any skip.
          gh api "$api/pulls/$PR_NUMBER" > "$RUNNER_TEMP/impact-pr-after.json"
          jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" --argjson n "$count" \
            '.base.sha == $base and .head.sha == $head and .changed_files == $n' \
            "$RUNNER_TEMP/impact-pr-after.json" >/dev/null
          # Fetch immutable files as JSON/base64 DATA, not Git checkout/fetch.
          gh api "$api/contents/scripts/ci-heavy-host-impact.mjs?ref=$BASE_SHA" --jq '.content' \
            | base64 --decode > "$RUNNER_TEMP/trusted-host-impact.mjs"
          gh api "$api/contents/package.json?ref=$BASE_SHA" --jq '.content' \
            | base64 --decode > "$RUNNER_TEMP/base-package.json"
          gh api "$api/contents/package.json?ref=$HEAD_SHA" --jq '.content' \
            | base64 --decode > "$RUNNER_TEMP/head-package.json"
          node "$RUNNER_TEMP/trusted-host-impact.mjs" \
            --base-package "$RUNNER_TEMP/base-package.json" \
            --head-package "$RUNNER_TEMP/head-package.json" < "$RUNNER_TEMP/changed-paths.txt"

  # All three Host contracts are branch-protection obligations for runtime changes.
  floor_qualification:
    name: exact minimum DSH Host acceptance
    needs: host_impact
    if: needs.host_impact.outputs.heavy == 'true'
    uses: ./.github/workflows/dsh-021-rc5-validation.yml
    permissions:
      contents: read

  recommended_qualification:
    name: exact recommended DSH Host acceptance
    needs: host_impact
    if: needs.host_impact.outputs.heavy == 'true'
    uses: ./.github/workflows/dsh-022-rc1-host-gate.yml
    permissions:
      contents: read

  host_qualification:
    name: current exact DSH Host acceptance
    needs: host_impact
    if: needs.host_impact.outputs.heavy == 'true'
    uses: ./.github/workflows/dsh-022-rc3-host-gate.yml
    permissions:
      contents: read

  # Branch protection requires the exact contract (24.9.0) and
  # contract (24.21.0) statuses in addition to the full test matrix.
  # They must be real, independently executed checks on *every* PR, not
  # synthetic green statuses or paths-filtered jobs.
  contract:
    name: contract (${{ matrix.node }})
    needs: [host_impact, floor_qualification, recommended_qualification, host_qualification]
    # Non-success/unknown classification and skipped Host tests must fail closed.
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.9.0', '24.21.0']
    steps:
      - name: Enforce trusted impact and all three exact Host results
        shell: bash
        env:
          CLASSIFIER_RESULT: ${{ needs.host_impact.result }}
          HOST_IMPACT: ${{ needs.host_impact.outputs.heavy }}
          FLOOR_RESULT: ${{ needs.floor_qualification.result }}
          RECOMMENDED_RESULT: ${{ needs.recommended_qualification.result }}
          LATEST_RESULT: ${{ needs.host_qualification.result }}
        run: |
          set -euo pipefail
          if [ "$CLASSIFIER_RESULT" != success ]; then
            echo "::error::Trusted impact classifier did not succeed: $CLASSIFIER_RESULT"
            exit 1
          fi
          if [ "$HOST_IMPACT" = true ]; then
            for result in "$FLOOR_RESULT" "$RECOMMENDED_RESULT" "$LATEST_RESULT"; do
              if [ "$result" != success ]; then
                echo "::error::Required exact Host qualification did not succeed: $result"
                exit 1
              fi
            done
          elif [ "$HOST_IMPACT" = false ]; then
            for result in "$FLOOR_RESULT" "$RECOMMENDED_RESULT" "$LATEST_RESULT"; do
              if [ "$result" != skipped ]; then
                echo "::error::Light-only qualification state is inconsistent: $result"
                exit 1
              fi
            done
          else
            echo "::error::Invalid trusted impact verdict: $HOST_IMPACT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build canonical runtime artifacts
        run: pnpm build
      - name: Check generated runtime artifacts
        run: pnpm build:check
      - name: Typecheck Host, Client and declarations
        run: pnpm typecheck
      - name: Lint runtime ownership and lifecycle boundaries
        run: pnpm lint
      - name: Validate supported Host, activation and release contracts
        run: node --test tests/dsh-support-window.test.js tests/activation-shim-contract.test.js tests/release-state-machine.test.js tests/runtime-i18n.test.js

  package-contract:
    name: packed public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.9.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build canonical package artifacts
        run: pnpm build
      - name: Pack one package candidate
        run: |
          mkdir -p tmp-pack
          pnpm pack --pack-destination tmp-pack
      - name: Verify packed runtime and declaration surface
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(find tmp-pack -maxdepth 1 -name 'dsh-vision-router-*.tgz' -print -quit)"
          [ -n "$TARBALL" ]
          node scripts/verify-packed-public-api.mjs "$TARBALL"

  native-host-sharp:
    name: host sharp / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.9.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build canonical runtime artifacts
        run: pnpm build
      - name: Verify generated runtime artifacts
        run: pnpm build:check
      - name: Run cross-platform runtime and benchmark fixture regression tests
        run: node --test tests/file-logger.test.js tests/logging-ui.test.js tests/runtime-boundary-fixes.test.js tests/qa-screenshot-runtime.test.js tests/vision-capability-benchmark.test.js tests/release-state-machine.test.js
      - name: Prepare pack directory
        shell: node {0}
        run: |
          require('node:fs').mkdirSync('tmp-pack', { recursive: true })
      - name: Pack plugin
        run: pnpm pack --pack-destination tmp-pack
      - name: Install into a DSH-like host and verify one shared sharp
        shell: node {0}
        run: |
          const fs = require('node:fs')
          const path = require('node:path')
          const { spawnSync } = require('node:child_process')
          const { createRequire } = require('node:module')
          ;(async () => {
            const tgz = fs.readdirSync('tmp-pack').find((name) => name.endsWith('.tgz'))
            if (!tgz) throw new Error('packed plugin tarball not found')
            const tarball = path.resolve('tmp-pack', tgz).replaceAll('\\', '/')
            const hostDir = path.join(process.env.RUNNER_TEMP, 'dsh-vision-router-host')
            fs.rmSync(hostDir, { recursive: true, force: true })
            fs.mkdirSync(hostDir, { recursive: true })
            fs.writeFileSync(path.join(hostDir, 'package.json'), JSON.stringify({
              private: true,
              packageManager: 'pnpm@11.20.0',
              dependencies: {
                sharp: '0.35.3',
                'dsh-vision-router': `file:${tarball}`,
              },
            }, null, 2))
            const cmd = process.platform === 'win32' ? 'pnpm.cmd' : 'pnpm'
            const installed = spawnSync(cmd, ['install'], {
              cwd: hostDir,
              stdio: 'inherit',
              shell: process.platform === 'win32',
            })
            if (installed.status !== 0) process.exit(installed.status ?? 1)

            const hostRequire = createRequire(path.join(hostDir, 'host-check.cjs'))
            const pluginEntry = hostRequire.resolve('dsh-vision-router')
            const pluginRequire = createRequire(pluginEntry)
            const hostSharp = fs.realpathSync(hostRequire.resolve('sharp'))
            const pluginSharp = fs.realpathSync(pluginRequire.resolve('sharp'))
            console.log({ hostSharp, pluginSharp })
            if (hostSharp !== pluginSharp) {
              throw new Error('plugin installed/resolved a second sharp copy instead of using the host copy')
            }
            const sharp = hostRequire('sharp')
            const out = await sharp({
              create: {
                width: 8,
                height: 8,
                channels: 4,
                background: { r: 10, g: 20, b: 30, alpha: 1 },
              },
            }).resize(4, 4).png().toBuffer()
            if (!Buffer.isBuffer(out) || out.length === 0) throw new Error('shared sharp pixel smoke test failed')
            console.log(`shared sharp ${sharp.versions.sharp}; PNG bytes=${out.length}`)
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
