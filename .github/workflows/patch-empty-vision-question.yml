name: Patch empty vision question

on:
  push:
    branches: [agent/http-provider-compat-presets]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/http-provider-compat-presets
          fetch-depth: 0
      - run: node scripts/patch-empty-vision-question.mjs
      - run: |
          node --check index.js
          git diff --check
      - name: Commit hardening
        shell: bash
        run: |
          if git diff --quiet -- index.js; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js
          git commit -m 'fix: keep strict vision endpoints prompted on empty questions'
          git push origin HEAD:agent/http-provider-compat-presets
