name: v2 shadow routing patch

on:
  push:
    branches:
      - feat/v2-capability-router

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v2-capability-router
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply phase-2 shadow routing patch
        run: node scripts/patch-v2-shadow.mjs
      - name: Run focused tests
        run: node --test tests/vision-capability-router.test.js tests/capability-shadow.test.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.js lib/client.js lib/vision-capability-router.js docs/v2-capability-routing.md package.json tests/capability-shadow.test.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: add v2 capability routing shadow mode"
          git push origin HEAD:feat/v2-capability-router
