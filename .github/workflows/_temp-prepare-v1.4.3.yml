name: temp-prepare-v1.4.3

on:
  push:
    branches:
      - release/v1.4.3

permissions:
  contents: write

jobs:
  prepare-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Prepare v1.4.3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old[:80]!r}, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once('package.json', '"version": "1.4.2"', '"version": "1.4.3"')

          replace_once(
              'README.md',
              '<a href="https://github.com/ysr666/dsh-vision-router/releases/tag/v1.4.2"><img src="https://img.shields.io/badge/release-v1.4.2-5B4CF0?style=flat-square" alt="Release v1.4.2" /></a>',
              '<a href="https://github.com/ysr666/dsh-vision-router/releases/tag/v1.4.3"><img src="https://img.shields.io/badge/release-v1.4.3-5B4CF0?style=flat-square" alt="Release v1.4.3" /></a>',
          )
          replace_once(
              'README.md',
              '<a href="tests"><img src="https://img.shields.io/badge/verified-256%20tests-2EA44F?style=flat-square" alt="Verified: 256 tests" /></a>',
              '<a href="tests"><img src="https://img.shields.io/badge/verified-257%20tests-2EA44F?style=flat-square" alt="Verified: 257 tests" /></a>',
          )
          replace_once(
              'README.md',
              '> [!WARNING]\n> 📌 **Announcement (v1.4.2)**\n>\n> **v1.4.2 now supports** Oh-DSH Desktop — the plugin no longer races the stock DeepSeek route on the bundled DSH 0.1.0-rc.5 runtime (fixes "DSH runtime exited before readiness"), opencode-go qwen3.6-plus vision calls reach the correct Anthropic endpoint, and "+ Auto Vision" twins keep the picker\'s reasoning effort across multi-step turns.',
              '> [!WARNING]\n> 📌 **Announcement (v1.4.3)**\n>\n> **v1.4.3:** Custom vision backends are runtime-verified instead of blocked by DSH capability metadata, including WebSocket/private transports.',
          )

          replace_once(
              'README.zh.md',
              '<a href="https://github.com/ysr666/dsh-vision-router/releases/tag/v1.4.2"><img src="https://img.shields.io/badge/release-v1.4.2-5B4CF0?style=flat-square" alt="Release v1.4.2" /></a>',
              '<a href="https://github.com/ysr666/dsh-vision-router/releases/tag/v1.4.3"><img src="https://img.shields.io/badge/release-v1.4.3-5B4CF0?style=flat-square" alt="Release v1.4.3" /></a>',
          )
          replace_once(
              'README.zh.md',
              '<a href="tests"><img src="https://img.shields.io/badge/verified-256%20tests-2EA44F?style=flat-square" alt="Verified: 256 tests" /></a>',
              '<a href="tests"><img src="https://img.shields.io/badge/verified-257%20tests-2EA44F?style=flat-square" alt="Verified: 257 tests" /></a>',
          )
          replace_once(
              'README.zh.md',
              '> [!WARNING]\n> 📌 **公告（v1.4.2）**\n>\n> **v1.4.2 现已支持**：Oh-DSH Desktop 兼容——在内置的 DSH 0.1.0-rc.5 上不再与官方 DeepSeek 路由竞争导致启动崩溃（修复「DSH runtime exited before readiness」）；opencode-go qwen3.6-plus 视觉调用走正确的 Anthropic 端点；「+ 自动识图」twin 组在多步对话中保留选择器里的推理等级。',
              '> [!WARNING]\n> 📌 **公告（v1.4.3）**\n>\n> **v1.4.3：自定义视觉后端改为运行时验证，支持 WebSocket/私有协议。**',
          )

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if '\n## v1.4.3\n' in text:
              raise SystemExit('CHANGELOG.md already contains v1.4.3')
          marker = '\n## v1.4.2\n'
          if text.count(marker) != 1:
              raise SystemExit(f'CHANGELOG.md: expected one v1.4.2 marker, found {text.count(marker)}')
          lines = [
              '',
              '## v1.4.3',
              '',
              '### 改进 / Changed',
              '',
              '- **自定义视觉后端改为运行时验证（#128 / #130）**：DSH 的图片能力元数据现在只作提示，不再作为准入门槛。设置 → 模型中可调用的生成式模型都会出现在视觉后端链里；未声明图片能力或被标成仅文本的模型仍可手动选择并显示警告。运行时始终先走供应商已注册的 DSH adapter，HTTP、WebSocket、RPC 与私有协议保留原生传输；只有明确识别为 http(s) OpenAI Chat Completions 的渠道才允许进入直连兼容桥。实际图片调用失败后继续自动尝试下一后端；embedding/reranker 与插件自身包装路由仍结构性排除。`extraVisionModels` 降级为可选能力标记覆盖，不再是解锁模型的前置条件。',
              '- **Custom vision backends are now runtime-verified (#128 / #130)**: DSH image-capability metadata is advisory instead of an admission gate. Any callable generative model from Settings → Models can be selected in the vision chain; undeclared or text-only-labelled models remain selectable with warnings. Runtime dispatch is adapter-first, preserving native HTTP, WebSocket, RPC and private transports; the direct compatibility bridge is used only for positively identified http(s) OpenAI Chat Completions channels. A real image-call failure falls through to the next backend, while embedding/reranker endpoints and the plugin\'s own generated wrapper routes remain structurally excluded. `extraVisionModels` is now an optional capability-label override rather than an unlock requirement.',
              '',
              '### 修复 / Fixed',
              '',
              '- **视觉失败摘要不再出现重复句号（#131）**：当 adapter 自身错误已经以句号或其他句末标点结束时，整轮失败汇总不再额外追加一个 `.`，避免出现 `..`；新增回归测试覆盖英文与中文句末标点。',
              '- **Vision failure summaries no longer produce doubled punctuation (#131)**: when an adapter error already ends in terminal punctuation, the whole-turn failure summary no longer appends another period, avoiding `..`; regression coverage includes English and Chinese sentence endings.',
          ]
          section = '\n'.join(lines) + '\n'
          changelog.write_text(text.replace(marker, section + marker, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: npm pack --dry-run
      - name: Commit validated release prep
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json README.md README.zh.md CHANGELOG.md
          git commit -m "chore: prepare v1.4.3"
          git push origin HEAD:release/v1.4.3
