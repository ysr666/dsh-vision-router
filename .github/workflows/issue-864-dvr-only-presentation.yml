name: Issue 864 DVR-only directory consumer diagnostic
on:
  push:
    branches: [diagnostics/issue-864-dvr-only-presentation]
permissions:
  contents: read
jobs:
  upstream-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: dvr
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 4b399c39a6d1479cd84ca591b4d7c88e24d38a96
          path: dsh-host
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Nwflower/dsh-claude-style
          ref: 93e51bd044d20233a85e2bab8057054d6db97d61
          path: claude-style
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Install immutable upstream workspace
        working-directory: dsh-host
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Bundle unmodified Claude Style catalog consumer
        working-directory: claude-style
        run: |
          npm ci --ignore-scripts
          npx --no-install esbuild packages/client/src/features/model/catalog.ts --bundle --platform=node --format=esm --outfile=../dsh-host/packages/client/ui-model-selection/tests/dvr-claude-catalog.mjs
      - name: Verify actual DVR client compatibility paths
        working-directory: dvr
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          node --test tests/vision-mode-toggle-injection.test.js tests/issue-284-model-visibility.test.js tests/vision-toggle-root-hardening.test.js
      - name: Build immutable original upstream Host and client including generated contracts
        working-directory: dsh-host
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm run build
      - name: Export actual DVR registry catalog through the original Host
        working-directory: dsh-host
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-host
          DVR_864_CATALOG: ${{ runner.temp }}/dvr-864-catalog.json
        run: pnpm exec tsx ../dvr/scripts/issue-864-real-dvr-catalog.mjs
      - name: Install diagnostic-only test fixture alongside unmodified Host tests
        run: cp dvr/diagnostics/issue-864-dvr-only-consumer.client.spec.ts dsh-host/packages/client/ui-model-selection/tests/dvr-only-consumer.client.spec.ts
      - name: Run real Cordis browser model-selection tests and Host catalog tests
        working-directory: dsh-host
        env:
          DVR_864_CATALOG: ${{ runner.temp }}/dvr-864-catalog.json
          DVR_864_PRELUDE: ${{ github.workspace }}/dvr/lib/vision-model-visibility-boundary.js
          DVR_864_HARDENING: ${{ github.workspace }}/dvr/lib/vision-toggle-root-hardening.js
        run: |
          git diff --exit-code
          pnpm exec vitest run packages/client/ui-model-selection/tests/browser-plugin.client.spec.ts packages/api/session-controller/tests/session-models.host.spec.ts packages/client/ui-model-selection/tests/dvr-only-consumer.client.spec.ts
          git diff --exit-code
