name: v2 capability benchmark patch

on:
  push:
    branches:
      - feat/v2-capability-router
    paths:
      - scripts/patch-v2-capability-benchmark.mjs
      - .github/workflows/v2-capability-benchmark-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-capability-router
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact benchmark patch
        run: node scripts/patch-v2-capability-benchmark.mjs
      - name: Run focused tests
        run: node --test tests/vision-capability-router.test.js tests/vision-capability-reference.test.js tests/vision-capability-benchmark.test.js tests/capability-shadow.test.js
      - name: Syntax and diff check
        run: |
          node --check index.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js tests/capability-shadow.test.js
          git commit -m "feat: add exact-backend capability self-benchmark"
          git push origin HEAD:feat/v2-capability-router
