name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish to npm (skip when the version already exists)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-vision-router@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has $VERSION — skipping publish"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The yellow sticky-note announcement at the top of both READMEs must be
      # updated together with every release; tagging a version that the banner
      # does not mention fails the run.
      - name: Verify the README announcement banner matches the version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for f in README.md README.zh.md; do
            grep -q "v$VERSION" "$f" || { echo "$f: the announcement banner must mention v$VERSION — update it before tagging." >&2; exit 1; }
          done
      # Release notes must be bilingual (zh + en): the workflow requires a
      # hand-written CHANGELOG.md section for the tagged version and appends
      # the commit list as a supplement. Tagging a version without a section
      # fails the run instead of publishing English-only notes.
      - name: Compose bilingual release notes from CHANGELOG.md
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! awk -v v="v$VERSION" '$0 == "## " v { found=1 } END { exit found ? 0 : 1 }' CHANGELOG.md; then
            echo "CHANGELOG.md has no section for v$VERSION — add a bilingual entry before tagging." >&2
            exit 1
          fi
          {
            echo "# v$VERSION"
            echo
          } > release-notes.md
          awk -v v="v$VERSION" '$0 == "## " v { flag=1; next } /^## / && flag { exit } flag' CHANGELOG.md >> release-notes.md
          {
            echo
            echo "## Commits"
            echo
          } >> release-notes.md
          PREV_TAG=$(git describe --tags --abbrev=0 "v$VERSION"^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s' "$PREV_TAG..HEAD" >> release-notes.md
          else
            git log --pretty=format:'- %s' >> release-notes.md
          fi
      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
