name: tmp-run-vision-backend-ux
on:
  push:
    branches:
      - fix/vision-backend-ux
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-backend-ux
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Apply patch
        run: |
          python .github/scripts/apply-vision-backend-ux.py
          node <<'NODE'
          const fs = require('fs')
          let text = fs.readFileSync('index.js', 'utf8')
          const old = "  if (!allowDefault) return configured\n  const seen = new Set(configured.map((p) => `${p.name}/${p.model}`))"
          const next = "  if (!allowDefault) return configured\n  if (configured.length === 0) return DEFAULT_HTTP_PROVIDERS\n  const seen = new Set(configured.map((p) => `${p.name}/${p.model}`))"
          if (!text.includes(old)) throw new Error('httpProvidersOf compatibility insertion point missing')
          fs.writeFileSync('index.js', text.replace(old, next))

          text = fs.readFileSync('tests/core.test.js', 'utf8')
          const oldTest = `test('httpProvidersOf falls back to the built-in default unless disabled', () => {
  assert.equal(httpProvidersOf({}), DEFAULT_HTTP_PROVIDERS)
  assert.deepEqual(httpProvidersOf({}, false), [])
  const custom = [{ name: 'x', baseURL: 'https://x/v1', model: 'm' }]
  assert.deepEqual(httpProvidersOf({ httpProviders: custom }), custom)
  assert.deepEqual(httpProvidersOf({ httpProviders: custom }, false), custom)
})`
          const newTest = `test('httpProvidersOf keeps built-in OVH as final fallback unless disabled', () => {
  assert.equal(httpProvidersOf({}), DEFAULT_HTTP_PROVIDERS)
  assert.deepEqual(httpProvidersOf({}, false), [])
  const custom = [{ name: 'x', baseURL: 'https://x/v1', model: 'm' }]
  const withFallback = httpProvidersOf({ httpProviders: custom })
  assert.equal(withFallback[0], custom[0])
  assert.deepEqual(withFallback.slice(1), DEFAULT_HTTP_PROVIDERS)
  assert.deepEqual(httpProvidersOf({ httpProviders: custom }, false), custom)
})`
          if (!text.includes(oldTest)) throw new Error('old httpProvidersOf contract test missing')
          fs.writeFileSync('tests/core.test.js', text.replace(oldTest, newTest))
          NODE
      - name: Sanity checks
        run: |
          node --check index.js
          node --check lib/client.js
          pnpm test
          git diff --check
      - name: Commit patch
        run: |
          rm .github/workflows/tmp-run-vision-backend-ux.yml
          rm .github/scripts/apply-vision-backend-ux.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: clarify vision backend and OVH fallback UX'
          git push origin HEAD:fix/vision-backend-ux
