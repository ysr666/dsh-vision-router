name: tmp-run-vision-backend-ux
on:
  push:
    branches:
      - fix/vision-backend-ux
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-backend-ux
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Apply patch
        run: |
          python .github/scripts/apply-vision-backend-ux.py
          node -e 'const fs=require("fs");let s=fs.readFileSync("index.js","utf8");const a="  if (!allowDefault) return configured\n  const seen = new Set(configured.map((p) => `${p.name}/${p.model}`))";const b="  if (!allowDefault) return configured\n  if (configured.length === 0) return DEFAULT_HTTP_PROVIDERS\n  const seen = new Set(configured.map((p) => `${p.name}/${p.model}`))";if(!s.includes(a))throw new Error("httpProvidersOf insertion point missing");fs.writeFileSync("index.js",s.replace(a,b))'
          node -e 'const fs=require("fs");let s=fs.readFileSync("tests/core.test.js","utf8");s=s.replace("test(\x27httpProvidersOf falls back to the built-in default unless disabled\x27, () => {","test(\x27httpProvidersOf keeps built-in OVH as final fallback unless disabled\x27, () => {");const a="  assert.deepEqual(httpProvidersOf({ httpProviders: custom }), custom)";const b="  const withFallback = httpProvidersOf({ httpProviders: custom })\n  assert.equal(withFallback[0], custom[0])\n  assert.deepEqual(withFallback.slice(1), DEFAULT_HTTP_PROVIDERS)";if(!s.includes(a))throw new Error("old httpProvidersOf assertion missing");fs.writeFileSync("tests/core.test.js",s.replace(a,b))'
      - name: Sanity checks
        run: |
          node --check index.js
          node --check lib/client.js
          pnpm test
          git diff --check
      - name: Commit patch
        run: |
          rm .github/workflows/tmp-run-vision-backend-ux.yml
          rm .github/scripts/apply-vision-backend-ux.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: clarify vision backend and OVH fallback UX'
          git push origin HEAD:fix/vision-backend-ux
