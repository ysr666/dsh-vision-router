name: tmp-run-vision-backend-ux
on:
  push:
    branches:
      - fix/vision-backend-ux
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-backend-ux
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: python .github/scripts/apply-vision-backend-ux.py
      - name: Sanity checks
        run: |
          node --check index.js
          node --check lib/client.js
          npm test
          git diff --check
      - name: Commit patch
        run: |
          rm .github/workflows/tmp-run-vision-backend-ux.yml
          rm .github/scripts/apply-vision-backend-ux.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: clarify vision backend and OVH fallback UX'
          git push origin HEAD:fix/vision-backend-ux
