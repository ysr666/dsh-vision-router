name: Apply structured bootstrap gate hardening

on:
  push:
    branches:
      - feat/structured-vision-bootstrap
    paths:
      - scripts/harden-structured-bootstrap-gate.py
      - .github/workflows/apply-harden-structured-bootstrap-gate.yml
      - .github/structured-bootstrap-gate.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/structured-vision-bootstrap
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply hard gate
        run: python3 scripts/harden-structured-bootstrap-gate.py
      - name: Check syntax
        run: node --check index.js
      - name: Run focused tests
        run: node --test tests/structured-bootstrap.test.js tests/structured-bootstrap-gate.test.js
      - name: Remove one-shot helpers
        run: rm -f scripts/harden-structured-bootstrap-gate.py .github/workflows/apply-harden-structured-bootstrap-gate.yml .github/structured-bootstrap-gate.trigger
      - name: Commit generated changes
        run: |
          git config user.name "Shirui"
          git config user.email "77105194+ysr666@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: require structured visual pass before 1+x follow-ups"
          git push origin HEAD:feat/structured-vision-bootstrap
