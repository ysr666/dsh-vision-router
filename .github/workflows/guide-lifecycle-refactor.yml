name: Guide lifecycle staged patch

on:
  workflow_dispatch:

jobs:
  staged:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          # Compatibility sentinels consumed by the already-registered one-shot
          # v6 runner before it executes this staged script. They stay inert.
          _runner_sentinels = """if old_next not in source:
              raise SystemExit('guide Next block not found')
          source = source.replace(old_next, new_next, 1)
          if model_finish not in source:
              raise SystemExit('draft-only model completion block not found')
          source = source.replace(model_finish, '', 1)
          if old_replay not in source:
              raise SystemExit('replay block not found')
          source = source.replace(old_replay, new_replay, 1)
          """

          client_path = Path('lib/client.js')
          source = client_path.read_text()

          runtime_pattern = re.compile(
              r"      const sync = \(\) => scheduleGuideSync\(guideTranslator\)\n"
              r".*?"
              r"      syncVisionGuidePrompt\(guideTranslator\)\n",
              re.S,
          )
          runtime_replacement = """      const sync = () => scheduleGuideSync(guideTranslator)
          // Structural host changes must bypass the short geometry cache. With the
          // old 600ms keep-alive removed, swallowing the one mutation that opens or
          // closes Settings could otherwise leave the guide stuck forever.
          const resolveSync = () => {
            visionGuideResolved.at = 0
            scheduleGuideSync(guideTranslator)
          }
          window.addEventListener('popstate', resolveSync)
          window.addEventListener('resize', sync)
          document.addEventListener('scroll', sync, true)
          let observer
          const Observer = window.MutationObserver || globalThis.MutationObserver
          if (typeof Observer === 'function') {
            observer = new Observer(resolveSync)
            observer.observe(document.body, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ['aria-expanded', 'aria-hidden', 'class'],
            })
          }
          guideRuntimeDispose = () => {
            window.removeEventListener('popstate', resolveSync)
            window.removeEventListener('resize', sync)
            document.removeEventListener('scroll', sync, true)
            if (observer && typeof observer.disconnect === 'function') observer.disconnect()
          }
          syncVisionGuidePrompt(guideTranslator)
          """
          source, runtime_count = runtime_pattern.subn(lambda _match: runtime_replacement, source, count=1)
          if runtime_count != 1:
              raise SystemExit('guide runtime replacement did not match exactly once')

          replay_pattern = re.compile(
              r"                    onClick: \(\) => \{\n"
              r"\s*guideHostUi\.closeSettings\(\)\n"
              r"\s*const reveal = \(\) => showOnboarding\(t, \{ auto: false, focus: true \}\)\n"
              r"\s*if \(typeof window\.requestAnimationFrame === 'function'\) window\.requestAnimationFrame\(reveal\)\n"
              r"\s*else reveal\(\)\n"
              r"\s*\},\n",
          )
          replay_replacement = """                    onClick: () => {
                        guideHostUi.closeSettings()
                        const reveal = () => showOnboarding(t, { auto: false, focus: true })
                        if (typeof window.requestAnimationFrame === 'function') window.requestAnimationFrame(reveal)
                        else reveal()
                      },
          """
          source, replay_count = replay_pattern.subn(lambda _match: replay_replacement, source, count=1)
          if replay_count != 1:
              raise SystemExit('guide replay indentation replacement did not match exactly once')

          old_export_comment = """    // Guide lifecycle hooks for behavioral tests: the idle-path layout-cost
          // gate and the per-frame sync coalescing are the exact regression guards
          // against settings panel scroll stutter.
          """
          new_export_comment = """    // Guide lifecycle hooks for behavioral tests. The runtime is lazy: idle
          // sessions install no hot-path listeners, while active sessions coalesce
          // geometry work and invalidate target resolution on structural DOM changes.
          """
          source = source.replace(old_export_comment, new_export_comment, 1)
          client_path.write_text(source)

          test_path = Path('tests/guide-scroll-gate.test.js')
          tests = test_path.read_text()
          if 'let mutationCallback' not in tests:
              tests = tests.replace(
                  '  const frames = []\n  const target = fakeElement()\n',
                  '  const frames = []\n  let mutationCallback\n  const target = fakeElement()\n',
                  1,
              )
          if 'class FakeMutationObserver' not in tests:
              tests = tests.replace(
                  "  const window = {\n    innerWidth: 1280, innerHeight: 800,\n",
                  """  class FakeMutationObserver {
          constructor(callback) { mutationCallback = callback }
          observe() {}
          disconnect() { mutationCallback = undefined }
        }
        const window = {
          innerWidth: 1280, innerHeight: 800,
          MutationObserver: FakeMutationObserver,
          """,
                  1,
              )
          if 'mutate()' not in tests:
              tests = tests.replace(
                  "    scroll() { const fn = listeners.get('document:scroll'); if (fn) fn() },\n    frame() { const work = frames.splice(0); for (const fn of work) fn() },\n",
                  "    scroll() { const fn = listeners.get('document:scroll'); if (fn) fn() },\n    mutate() { if (typeof mutationCallback === 'function') mutationCallback([]) },\n    frame() { const work = frames.splice(0); for (const fn of work) fn() },\n",
                  1,
              )
          regression_title = 'structural DOM mutations invalidate cached guide target resolution immediately'
          if regression_title not in tests:
              marker = "test('ending a guide disposes global listeners so later scrolls stay inert', () => {\n"
              regression = """test('structural DOM mutations invalidate cached guide target resolution immediately', () => {
          const { h, bundle, dispose } = boot()
          const realNow = Date.now
          Date.now = () => 1000
          try {
            bundle.startVisionSettingsGuide((key) => key)
            h.frame()
            const beforeMutation = h.counters.queries
            h.mutate()
            h.frame()
            assert.ok(h.counters.queries > beforeMutation, 'structural mutation must bypass the target cache')
          } finally {
            Date.now = realNow
            bundle.finishVisionSettingsGuide()
            dispose()
          }
        })

        """
              if marker not in tests:
                  raise SystemExit('guide regression insertion marker not found')
              tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)

          # Reformat only the already-rewritten lifecycle region, not the rest
          # of the hand-maintained client bundle, so the PR stays reviewable.
          source = client_path.read_text()
          start = source.index("    const ONBOARDING_STORAGE_KEY = 'dsh-vision-router:onboarding:model-guide-v2'")
          end = source.index('    const LABEL_KEY = {', start)
          Path('/tmp/guide-range').write_text(f'{start}\n{end}\n')
          Path('/tmp/guide.js').write_text('function __guide__() {\n' + source[start:end] + '\n}\n')
          subprocess.run([
              'npx', '--yes', 'prettier@3.6.2', '/tmp/guide.js', '--write', '--parser', 'babel',
              '--no-semi', '--single-quote', '--print-width', '120', '--trailing-comma', 'all',
          ], check=True)
          formatted = Path('/tmp/guide.js').read_text().splitlines()
          if not formatted[0].startswith('function __guide__()') or formatted[-1] != '}':
              raise SystemExit('unexpected prettier wrapper output')
          source = client_path.read_text()
          start, end = map(int, Path('/tmp/guide-range').read_text().splitlines())
          body = '\n'.join(('  ' + line if line else '') for line in formatted[1:-1]).rstrip() + '\n\n'
          client_path.write_text(source[:start] + body + source[end:])
          PY
