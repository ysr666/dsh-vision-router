name: DSH pre-0.2.0 packaged Desktop audit

on:
  pull_request:
    paths:
      - '.github/workflows/dsh-020-packaged-desktop-audit.yml'
      - 'scripts/dsh020-packaged-desktop-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-packaged-desktop:
    name: master@21638c5 packaged Windows Desktop + DVR
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr

      - name: Checkout immutable pre-0.2.0 master source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 21638c56315ae6a2b552d6091945d3144c9af32e
          persist-credentials: false
          path: dsh

      - name: Install upstream package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Install Node 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: dsh/pnpm-lock.yaml

      - name: Install DSH workspace dependencies
        working-directory: dsh
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile

      - name: Build unsigned unpacked Windows Desktop through release packager
        working-directory: dsh
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm --filter @deepseek-ai/dsh-desktop exec tsx scripts/package-target.ts win-x64 --dir --unsigned

      - name: Run upstream packaged-runtime external-plugin smoke
        working-directory: dsh
        env:
          DSH_DESKTOP_TARGET_PLATFORM: win32
          DSH_DESKTOP_TARGET_ARCH: x64
        run: pnpm --filter @deepseek-ai/dsh-desktop exec tsx scripts/smoke-packaged-runtime.ts --unsigned

      - name: Run DVR against packaged ASAR Desktop runtime
        working-directory: dsh
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.1.7-rc.2
          DSH_DESKTOP_TARGET_PLATFORM: win32
          DSH_DESKTOP_TARGET_ARCH: x64
        run: node --import tsx ../dvr/scripts/dsh020-packaged-desktop-smoke.mjs
