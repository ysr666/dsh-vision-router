name: DSH preview browser smoke

on:
  pull_request:
    paths:
      - 'index.js'
      - 'package.json'
      - 'lib/dsh-support-window.js'
      - 'lib/client-presentation-boundary-main.js'
      - 'lib/client-presentation-boundary.js'
      - 'lib/*-client-prelude.js'
      - 'lib/vision-model-visibility-boundary-main.js'
      - 'lib/vision-model-visibility-boundary.js'
      - 'lib/client-host-compat-prelude.js'
      - 'lib/client.js'
      - 'lib/guide-vision-toggle-highlight.js'
      - 'lib/remote-settings-risk-confirmation.js'
      - 'lib/settings-client-rc8-lifecycle.js'
      - 'lib/settings-factory-lifecycle.js'
      - 'lib/settings-native-card-layout.js'
      - 'lib/v2-settings-ia-integration.js'
      - 'lib/vision-capability-benchmark-client.js'
      - 'lib/vision-exact-check-client.js'
      - 'lib/vision-routing-settings-prelude.js'
      - 'lib/web/**'
      - 'lib/session-affinity*.js'
      - 'lib/pi-ai-bridge-wire-compat.js'
      - 'scripts/alpha-browser-cold-toggle-smoke.mjs'
      - 'scripts/dsh-preview-mixed-attachment-paste-smoke.mjs'
      - '.github/workflows/dsh-preview-browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'package.json'
      - 'lib/dsh-support-window.js'
      - 'lib/client-presentation-boundary-main.js'
      - 'lib/client-presentation-boundary.js'
      - 'lib/*-client-prelude.js'
      - 'lib/vision-model-visibility-boundary-main.js'
      - 'lib/vision-model-visibility-boundary.js'
      - 'lib/client-host-compat-prelude.js'
      - 'lib/client.js'
      - 'lib/guide-vision-toggle-highlight.js'
      - 'lib/remote-settings-risk-confirmation.js'
      - 'lib/settings-client-rc8-lifecycle.js'
      - 'lib/settings-factory-lifecycle.js'
      - 'lib/settings-native-card-layout.js'
      - 'lib/v2-settings-ia-integration.js'
      - 'lib/vision-capability-benchmark-client.js'
      - 'lib/vision-exact-check-client.js'
      - 'lib/vision-routing-settings-prelude.js'
      - 'lib/web/**'
      - 'lib/session-affinity*.js'
      - 'lib/pi-ai-bridge-wire-compat.js'
      - 'scripts/alpha-browser-cold-toggle-smoke.mjs'
      - 'scripts/dsh-preview-mixed-attachment-paste-smoke.mjs'
      - '.github/workflows/dsh-preview-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview-browser:
    name: DSH ${{ matrix.dsh }} real Host + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh: 0.1.5-rc.2
            mixedGenericFiles: true
          - dsh: 0.1.5-alpha.2
            mixedGenericFiles: true
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr

      - name: Checkout immutable DSH 0.1.5-rc.2 source
        if: matrix.dsh == '0.1.5-rc.2'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: fb2c4b9e698e30edb738bca4cf0618587db7d203
          persist-credentials: false
          path: dsh-preview

      - name: Checkout immutable DSH 0.1.5-alpha.2 source
        if: matrix.dsh == '0.1.5-alpha.2'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.5-alpha.2
          persist-credentials: false
          path: dsh-preview

      - name: Install upstream package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Install Node 22 browser runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: dsh-preview/pnpm-lock.yaml

      - name: Compute exact DSH web build cache key
        id: dsh-build-key
        working-directory: dsh-preview
        shell: bash
        run: |
          set -euo pipefail
          DSH_SHA="$(git rev-parse HEAD)"
          LOCK_SHA="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          TREE_SHA="$(git ls-tree -r --full-tree HEAD | sha256sum | awk '{print $1}')"
          [[ "$DSH_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid DSH source SHA"; exit 1; }
          [[ "$LOCK_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid DSH lock hash"; exit 1; }
          [[ "$TREE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid DSH build-input hash"; exit 1; }
          KEY="dsh-web-v1-${RUNNER_OS}-node22-pnpm11.7.0-${DSH_SHA}-${LOCK_SHA}-${TREE_SHA}"
          printf 'key=%s\n' "$KEY" >> "$GITHUB_OUTPUT"
          printf 'Exact DSH build cache key: %s\n' "$KEY"

      - name: Install preview workspace dependencies
        working-directory: dsh-preview
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile

      - name: Restore trusted DSH web build cache
        id: dsh-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-preview/lib
            dsh-preview/packages/*/*/lib
            dsh-preview/apps/web/dist
            dsh-preview/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}

      - name: Build preview web runtime
        if: steps.dsh-build-cache.outputs.cache-hit != 'true'
        working-directory: dsh-preview
        run: pnpm run build

      - name: Save trusted DSH web build cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dsh-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-preview/lib
            dsh-preview/packages/*/*/lib
            dsh-preview/apps/web/dist
            dsh-preview/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}

      - name: Install Chromium for DSH Playwright
        working-directory: dsh-preview
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Run cold Vision toggle against preview Host and Chromium
        id: smoke
        working-directory: dsh-preview
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-preview
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: ${{ matrix.dsh }}
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/preview-browser-smoke-diagnostic.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/preview-browser-smoke-page.png
        run: node ../dvr/scripts/alpha-browser-cold-toggle-smoke.mjs

      - name: Run mixed text + normalized image + generic-file paste lifecycle
        if: matrix.mixedGenericFiles
        working-directory: dsh-preview
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-preview
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: ${{ matrix.dsh }}
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/preview-browser-smoke-mixed-diagnostic.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/preview-browser-smoke-mixed-page.png
        run: node ../dvr/scripts/dsh-preview-mixed-attachment-paste-smoke.mjs

      - name: Upload classified browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-preview-browser-diagnostic-${{ matrix.dsh }}
          path: ${{ runner.temp }}/preview-browser-smoke-*
          if-no-files-found: ignore
          retention-days: 2

      - name: Fail with classified smoke detail
        if: steps.smoke.outputs.status == 'fail'
        env:
          SMOKE_STAGE: ${{ steps.smoke.outputs.stage }}
          SMOKE_KIND: ${{ steps.smoke.outputs.kind }}
          SMOKE_DETAIL: ${{ steps.smoke.outputs.detail }}
        run: |
          printf 'stage=%s\nkind=%s\n%s\n' "$SMOKE_STAGE" "$SMOKE_KIND" "$SMOKE_DETAIL"
          exit 1
