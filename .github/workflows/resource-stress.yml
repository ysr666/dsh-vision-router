name: Large image resource stress

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.js'
      - 'entry.js'
      - 'lib/image-resource-governor.js'
      - 'lib/pixel-diff-stream.js'
      - 'tests/large-image-resource-integration.test.js'
      - 'scripts/image-resource-stress.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/resource-stress.yml'
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'entry.js'
      - 'lib/image-resource-governor.js'
      - 'lib/pixel-diff-stream.js'
      - 'tests/large-image-resource-integration.test.js'
      - 'scripts/image-resource-stress.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/resource-stress.yml'
  schedule:
    - cron: '37 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-stress:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: High-resolution functional regression
        run: node --test tests/large-image-resource-integration.test.js
      - name: 100MP compressed-image RSS stress (1/2/4 callers)
        run: node --expose-gc scripts/image-resource-stress.mjs
        env:
          STRESS_IMAGE_WIDTH: '10000'
          STRESS_IMAGE_HEIGHT: '10000'
          STRESS_MAX_DELTA_MIB: '256'

  cross-platform-stress:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: High-resolution functional regression
        run: node --test tests/large-image-resource-integration.test.js
      - name: 100MP compressed-image RSS stress (1/2/4 callers)
        run: node --expose-gc scripts/image-resource-stress.mjs
        env:
          STRESS_IMAGE_WIDTH: '10000'
          STRESS_IMAGE_HEIGHT: '10000'
          STRESS_MAX_DELTA_MIB: '256'
