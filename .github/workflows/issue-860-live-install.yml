name: Issue 860 real Host live install diagnostic
on:
  push:
    branches: [diagnostic/issue-860-live-install]
    paths:
      - 'scripts/dsh-issue-860-live-install.mjs'
      - '.github/workflows/issue-860-live-install.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-860-live-install-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rc4-live-install:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: dvr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 3f321d32bfe382212a8ed8785c1d47a5a300aa23
          persist-credentials: false
          path: dsh
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
      - name: Install exact upstream dependencies
        working-directory: dsh
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Build real Host
        working-directory: dsh
        run: pnpm run build
      - name: Reproduce live PluginManager installation of published DVR 3.4.0
        working-directory: dsh
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh
        run: node ../dvr/scripts/dsh-issue-860-live-install.mjs
