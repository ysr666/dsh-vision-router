name: Issue 860 Windows Desktop Shop diagnostic
on:
  push:
    branches: [diagnostic/issue-860-desktop-shop]
    paths:
      - 'scripts/dsh-issue-860-desktop-shop.mjs'
      - '.github/workflows/issue-860-live-install.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-860-desktop-shop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shop-present-live-install:
    name: Shop 0.9.4 installStart / ${{ matrix.version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '0.2.2-rc.4'
            sha: 3f321d32bfe382212a8ed8785c1d47a5a300aa23
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: dvr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.sha }}
          persist-credentials: false
          path: dsh
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.9.0
      - name: Install exact upstream dependencies
        working-directory: dsh
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Build real Host
        working-directory: dsh
        run: pnpm run build
      - name: Official Desktop Manager seeded Shop then real Shop install
        working-directory: dsh
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh
          DSH_EXPECTED_VERSION: ${{ matrix.version }}
          DVR_860_WITH_SHOP: '1'
          DVR_860_THROUGH_SHOP: '1'
        run: node --import tsx ../dvr/scripts/dsh-issue-860-desktop-shop.mjs
      - name: Same official Shop seed then direct Manager control
        if: always() && !cancelled()
        working-directory: dsh
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh
          DSH_EXPECTED_VERSION: ${{ matrix.version }}
          DVR_860_DIRECT_CONTROL: '1'
        run: node --import tsx ../dvr/scripts/dsh-issue-860-desktop-shop.mjs
