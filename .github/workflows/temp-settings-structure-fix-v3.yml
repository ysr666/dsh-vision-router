name: temp settings structure fix v3
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-structure-screenshot-permission
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Reuse focused patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temp-settings-structure-fix.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-settings-structure.py').write_text(script)
          PY
          python3 /tmp/apply-settings-structure.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/client.test.js')
          s = p.read_text()
          bad = '  assert.equal(source.includes("localOllamaEditor(),\n                      localLmStudioEditor(),"), true)\n'
          good = '  assert.equal(source.includes("localOllamaEditor()"), true)\n  assert.equal(source.includes("localLmStudioEditor()"), true)\n'
          if s.count(bad) != 1:
            raise SystemExit(f'expected one broken generated assertion, got {s.count(bad)}')
          p.write_text(s.replace(bad, good, 1))
          PY
      - run: pnpm test
      - name: Commit patch and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/temp-settings-structure-fix.yml
          rm -f .github/workflows/temp-settings-structure-fix-v2.yml
          rm -f .github/workflows/temp-settings-structure-fix-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/client.js lib/local-vision-stabilizer.js index.js tests/client.test.js tests/local-vision-stabilizer.test.js .github/workflows/
          git commit -m 'fix: unify first-pass settings and request screenshot permission [settings-structure-fix-applied]'
          git push origin HEAD:fix/settings-structure-screenshot-permission
