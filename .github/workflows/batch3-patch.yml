name: Batch3 one-shot patch

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-batch3-hardening.py'
      - 'scripts/fix-batch3-test-contracts.py'
      - '.github/workflows/batch3-patch.yml'
      - 'lib/http-body-limit.js'
      - 'lib/artifact-boundary.js'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.event.pull_request.head.ref == 'fix/first-principles-adversarial-batch3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Apply exact batch3 patch
        run: python3 scripts/apply-batch3-hardening.py
      - name: Migrate affected test contracts
        run: python3 scripts/fix-batch3-test-contracts.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run full test suite
        run: pnpm test
      - name: Check patch cleanliness
        run: git diff --check
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js lib tests
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "harden third-batch resource boundaries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
