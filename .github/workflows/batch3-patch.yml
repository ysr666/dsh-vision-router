name: Batch3 merged-tree verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/batch3-patch.yml'
      - 'scripts/merge-batch3-main-index.py'

permissions:
  contents: write

jobs:
  merge-semantics-and-verify:
    if: ${{ github.event.pull_request.head.ref == 'fix/first-principles-adversarial-batch3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Merge latest-main index semantics
        run: python3 scripts/merge-batch3-main-index.py
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run full test suite on combined tree
        run: pnpm test
      - name: Check patch cleanliness
        run: git diff --check
      - name: Commit verified semantic merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "integrate latest main settings with batch3 hardening"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
