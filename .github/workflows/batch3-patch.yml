name: Batch3 latest-main integration

on:
  push:
    branches:
      - fix/first-principles-adversarial-batch3
    paths:
      - '.github/workflows/batch3-patch.yml'
      - '.batch3-integrate-trigger'

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/first-principles-adversarial-batch3
          fetch-depth: 0
      - name: Merge latest main locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run full test suite on merged tree
        run: pnpm test
      - name: Check merged tree
        run: git diff --check HEAD^ HEAD
      - name: Publish verified integration
        run: git push origin HEAD:fix/first-principles-adversarial-batch3
