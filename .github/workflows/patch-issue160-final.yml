name: Patch issue 160 final

on:
  push:
    branches:
      - fix/issue-160-webserver-wrapper
    paths:
      - .github/workflows/patch-issue160-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-160-webserver-wrapper
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Apply patch
        run: python3 .github/scripts/patch_issue160_final.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate targeted tests
        run: |
          node --check index.js
          node --check lib/local-vision-stabilizer.js
          node --test tests/local-connection-probe.test.js tests/local-vision-stabilizer.test.js
          git diff --check
      - name: Full tests
        run: pnpm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js lib/local-vision-stabilizer.js tests/local-vision-stabilizer.test.js
          git commit -m "fix: preserve rc.6 host routes under local vision"
          git push origin HEAD:fix/issue-160-webserver-wrapper
