name: Apply issue 153 fix v2
"on":
  push:
    branches:
      - "fix/issue-153-attachment-materialize"
    paths:
      - ".github/workflows/_temp-fix-153-v2.yml"
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-153-attachment-materialize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
      - name: Apply patch
        run: python3 .github/scripts/_temp-fix153.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js lib/client.js tests/core.test.js README.md README.zh.md
          git commit -m "fix: materialize attachments for offline fallback (#153)"
          git push origin HEAD:fix/issue-153-attachment-materialize
