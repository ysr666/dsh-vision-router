name: DSH 0.2.0-rc.1 validation

on:
  pull_request:
    paths:
      - 'package.json'
      - 'cordis.patch.yml'
      - 'lib/**'
      - 'scripts/dsh-alpha-source-contract.mjs'
      - 'scripts/dsh-peer-admission-contract.mjs'
      - 'scripts/dsh-proxy-egress-contract.mjs'
      - 'scripts/dsh-web-modules-overlay-contract.mjs'
      - 'scripts/dsh-web-connection-overlay-contract.mjs'
      - 'scripts/alpha-browser-cold-toggle-smoke.mjs'
      - 'scripts/ci-heavy-host-impact.mjs'
      - 'scripts/dsh-preview-mixed-attachment-paste-smoke.mjs'
      - 'scripts/dsh-preview-settings-browser-lifecycle-smoke.mjs'
      - 'scripts/dsh017-bundle-recompose-smoke.mjs'
      - 'scripts/dsh017-desktop-host-injection-smoke.mjs'
      - 'scripts/dsh-desktop-renderer-e2e.mjs'
      - 'scripts/dsh017-desktop-multiplugin-smoke.mjs'
      - '.github/workflows/dsh-020-rc1-validation.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'cordis.patch.yml'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/dsh-020-rc1-validation.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DSH_VERSION: 0.2.0-rc.1
  DSH_SHA: 4878cdabd87d4041bdaff61d04c966883b9fd07a

jobs:
  impact:
    name: classify heavy Host impact
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify release-only vs Host-impacting change
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            printf 'heavy=true\nreason=trusted main/manual run seeds and validates Host caches\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'heavy=true\nreason=invalid PR identity: fail closed\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          if ! git cat-file -e "$BASE_SHA:scripts/ci-heavy-host-impact.mjs" 2>/dev/null; then
            printf 'heavy=true\nreason=trusted base classifier unavailable: fail closed\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "$BASE_SHA:scripts/ci-heavy-host-impact.mjs" > "$RUNNER_TEMP/ci-heavy-host-impact.mjs"
          git show "$BASE_SHA:package.json" > "$RUNNER_TEMP/base-package.json"
          git show "$HEAD_SHA:package.json" > "$RUNNER_TEMP/head-package.json"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          node "$RUNNER_TEMP/ci-heavy-host-impact.mjs" \
            --base-package "$RUNNER_TEMP/base-package.json" \
            --head-package "$RUNNER_TEMP/head-package.json" \
            < "$RUNNER_TEMP/changed-paths.txt"

  exact-source:
    needs: impact
    if: needs.impact.outputs.heavy == 'true'
    name: exact source / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr
      - name: Checkout immutable DSH 0.2.0-rc.1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 4878cdabd87d4041bdaff61d04c966883b9fd07a
          persist-credentials: false
          path: dsh-020
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
      - name: Install exact Host workspace dependencies
        working-directory: dsh-020
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Run exact source contract
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DSH_EXPECTED_VERSION: 0.2.0-rc.1
          DSH_EXPECTED_COMMIT: 4878cdabd87d4041bdaff61d04c966883b9fd07a
        run: pnpm exec tsx ../dvr/scripts/dsh-alpha-source-contract.mjs
      - name: Verify 0.2 train peer admission with official Host evaluator
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
        run: pnpm exec tsx ../dvr/scripts/dsh-peer-admission-contract.mjs
      - name: Verify Host proxy egress authority
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
        run: pnpm exec tsx ../dvr/scripts/dsh-proxy-egress-contract.mjs
      - name: Verify modules compatibility overlay is still required
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DSH_MODULES_WEBSERVER_EXPECTED: shim-required
        run: pnpm exec tsx ../dvr/scripts/dsh-web-modules-overlay-contract.mjs
      - name: Verify connection compatibility overlay is still required
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DSH_CONNECTION_WEBSERVER_EXPECTED: shim-required
        run: pnpm exec tsx ../dvr/scripts/dsh-web-connection-overlay-contract.mjs

      - name: Build exact macOS Desktop runtime
        if: matrix.os == 'macos-latest'
        working-directory: dsh-020
        run: pnpm run build
      - name: Run real macOS Desktop renderer lifecycle
        if: matrix.os == 'macos-latest'
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.2.0-rc.1
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-020-macos-desktop-renderer.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-020-macos-desktop-renderer.png
        run: node --import tsx ../dvr/scripts/dsh-desktop-renderer-e2e.mjs
      - name: Upload macOS Desktop renderer diagnostics on failure
        if: matrix.os == 'macos-latest' && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-020-macos-desktop-renderer-diagnostics
          path: ${{ runner.temp }}/dsh-020-macos-desktop-renderer.*
          if-no-files-found: ignore
          retention-days: 2

  real-host-browser:
    needs: impact
    if: needs.impact.outputs.heavy == 'true'
    name: real Host + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr
      - name: Checkout immutable DSH 0.2.0-rc.1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 4878cdabd87d4041bdaff61d04c966883b9fd07a
          persist-credentials: false
          path: dsh-020
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: dsh-020/pnpm-lock.yaml
      - name: Compute exact DSH web build cache key
        id: dsh-build-key
        working-directory: dsh-020
        shell: bash
        run: |
          set -euo pipefail
          DSH_SHA="$(git rev-parse HEAD)"
          LOCK_SHA="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          TREE_SHA="$(git ls-tree -r --full-tree HEAD | sha256sum | awk '{print $1}')"
          KEY="dsh-web-v4-${RUNNER_OS}-node22-pnpm11.7.0-${DSH_SHA}-${LOCK_SHA}-${TREE_SHA}"
          printf 'key=%s\n' "$KEY" >> "$GITHUB_OUTPUT"

      - name: Install DSH workspace dependencies
        working-directory: dsh-020
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Restore trusted DSH build cache
        id: dsh-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-020/lib
            dsh-020/packages/*/*/lib
            dsh-020/vendor/*/lib
            dsh-020/apps/*/lib
            dsh-020/apps/web/dist
            dsh-020/native/system/packages/*/lib
            dsh-020/native/system/packages/*/bin
            dsh-020/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}

      - name: Build exact Host runtime
        if: steps.dsh-build-cache.outputs.cache-hit != 'true'
        working-directory: dsh-020
        run: pnpm run build

      - name: Save trusted DSH build cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dsh-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-020/lib
            dsh-020/packages/*/*/lib
            dsh-020/vendor/*/lib
            dsh-020/apps/*/lib
            dsh-020/apps/web/dist
            dsh-020/native/system/packages/*/lib
            dsh-020/native/system/packages/*/bin
            dsh-020/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}
      - name: Install Chromium
        working-directory: dsh-020
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Run bundle recompose stability
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.2.0-rc.1
        run: node ../dvr/scripts/dsh017-bundle-recompose-smoke.mjs
      - name: Run cold Vision toggle
        id: cold-smoke
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.2.0-rc.1
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-020-cold-toggle.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-020-cold-toggle.png
        run: node ../dvr/scripts/alpha-browser-cold-toggle-smoke.mjs
      - name: Fail classified cold Vision smoke
        if: steps.cold-smoke.outputs.status == 'fail'
        env:
          SMOKE_STAGE: ${{ steps.cold-smoke.outputs.stage }}
          SMOKE_KIND: ${{ steps.cold-smoke.outputs.kind }}
          SMOKE_DETAIL: ${{ steps.cold-smoke.outputs.detail }}
        run: |
          printf 'stage=%s\nkind=%s\n%s\n' "$SMOKE_STAGE" "$SMOKE_KIND" "$SMOKE_DETAIL"
          exit 1
      - name: Run mixed attachment lifecycle
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.2.0-rc.1
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-020-mixed.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-020-mixed.png
        run: node ../dvr/scripts/dsh-preview-mixed-attachment-paste-smoke.mjs
      - name: Run Settings mount/save/reload/readback lifecycle
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.2.0-rc.1
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-020-settings.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-020-settings.png
        run: node ../dvr/scripts/dsh-preview-settings-browser-lifecycle-smoke.mjs
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-020-rc1-browser-diagnostics
          path: ${{ runner.temp }}/dsh-020-*
          if-no-files-found: ignore
          retention-days: 2

  windows-desktop-host:
    needs: impact
    if: needs.impact.outputs.heavy == 'true'
    name: Windows Desktop Host / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.21.0]
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr
      - name: Checkout immutable DSH 0.2.0-rc.1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 4878cdabd87d4041bdaff61d04c966883b9fd07a
          persist-credentials: false
          path: dsh-020
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: dsh-020/pnpm-lock.yaml
      - name: Compute exact DSH build cache key
        id: dsh-build-key
        working-directory: dsh-020
        shell: bash
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          set -euo pipefail
          DSH_SHA="$(git rev-parse HEAD)"
          LOCK_SHA="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          TREE_SHA="$(git ls-tree -r --full-tree HEAD | sha256sum | awk '{print $1}')"
          KEY="dsh-host-v4-${RUNNER_OS}-node${NODE_VERSION}-pnpm11.7.0-${DSH_SHA}-${LOCK_SHA}-${TREE_SHA}"
          printf 'key=%s\n' "$KEY" >> "$GITHUB_OUTPUT"

      - name: Install DSH workspace dependencies
        working-directory: dsh-020
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Restore trusted DSH build cache
        id: dsh-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-020/lib
            dsh-020/packages/*/*/lib
            dsh-020/vendor/*/lib
            dsh-020/apps/*/lib
            dsh-020/apps/web/dist
            dsh-020/native/system/packages/*/lib
            dsh-020/native/system/packages/*/bin
            dsh-020/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}

      - name: Build exact Desktop runtime
        if: steps.dsh-build-cache.outputs.cache-hit != 'true'
        working-directory: dsh-020
        run: pnpm run build

      - name: Save trusted DSH build cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dsh-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-020/lib
            dsh-020/packages/*/*/lib
            dsh-020/vendor/*/lib
            dsh-020/apps/*/lib
            dsh-020/apps/web/dist
            dsh-020/native/system/packages/*/lib
            dsh-020/native/system/packages/*/bin
            dsh-020/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}
      - name: Run authenticated Desktop Host contract
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.2.0-rc.1
        run: node --import tsx ../dvr/scripts/dsh017-desktop-host-injection-smoke.mjs
      - name: Run Node 24 multi-plugin ordering adversary
        if: matrix.node == '24.21.0'
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.2.0-rc.1
        run: node --import tsx ../dvr/scripts/dsh017-desktop-multiplugin-smoke.mjs

      - name: Run real Windows Desktop renderer lifecycle
        if: matrix.node == '24.21.0'
        working-directory: dsh-020
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-020
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.2.0-rc.1
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-020-windows-desktop-renderer.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-020-windows-desktop-renderer.png
        run: node --import tsx ../dvr/scripts/dsh-desktop-renderer-e2e.mjs
      - name: Upload Windows Desktop renderer diagnostics on failure
        if: matrix.node == '24.21.0' && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-020-windows-desktop-renderer-diagnostics
          path: ${{ runner.temp }}/dsh-020-windows-desktop-renderer.*
          if-no-files-found: ignore
          retention-days: 2
