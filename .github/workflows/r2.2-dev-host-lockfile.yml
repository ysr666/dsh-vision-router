name: R2.2 Dev Host Lockfile

on:
  push:
    branches: [2.3.0]
    paths:
      - .github/workflows/r2.2-dev-host-lockfile.yml

permissions:
  contents: write

concurrency:
  group: r2-2-dev-host-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: regenerate rc2 development lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Verify starting lockfile
        run: pnpm install --frozen-lockfile
      - name: Pin ordinary development Host to exact rc.2
        run: >-
          pnpm add -D --save-exact --lockfile-only
          @deepseek-ai/dsh-anonymous-user-id@0.2.0-rc.2
          @deepseek-ai/dsh-llm-deepseek@0.2.0-rc.2
      - name: Verify generated dependency policy
        shell: node {0}
        run: |
          const pkg = require('./package.json')
          for (const name of [
            '@deepseek-ai/dsh-anonymous-user-id',
            '@deepseek-ai/dsh-llm-deepseek',
          ]) {
            if (pkg.devDependencies?.[name] !== '0.2.0-rc.2') {
              throw new Error(`${name} must be pinned to exact 0.2.0-rc.2`)
            }
          }
      - name: Verify regenerated lockfile installs frozen
        run: pnpm install --frozen-lockfile
      - name: Verify dependency and support contracts
        run: pnpm test:contract
      - name: Refuse unrelated generated changes
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(package.json|pnpm-lock.yaml)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'unexpected generated changes:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check
      - name: Commit generated development dependency lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "development dependency lock already current"
            exit 0
          fi
          git commit -m "build(deps): pin development Host to rc2"
          git push origin HEAD:2.3.0
