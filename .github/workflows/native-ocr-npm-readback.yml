# Read-only verification of owner-published exact resource bytes. No publication or repository writes.
name: Native OCR public npm readback
on:
  push:
    branches: [verify/native-ocr-registry-1.0.0]
    paths:
      - '.github/workflows/native-ocr-npm-readback.yml'
permissions:
  contents: read
concurrency:
  group: native-ocr-public-readback-1.0.0
  cancel-in-progress: true
jobs:
  exact-public-pair:
    if: github.repository == 'ysr666/dsh-vision-router'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9edcd8f55d294c2051efd5521fad7ba4c62d5c3f
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify exact pair from public npm HTTPS
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mac-report.json" <<'JSON'
          {"schemaVersion":1,"target":"darwin-arm64","name":"dsh-vision-router-ocr-darwin-arm64","version":"1.0.0","filename":"dsh-vision-router-ocr-darwin-arm64-1.0.0.tgz","entry":{"url":"https://registry.npmjs.org/dsh-vision-router-ocr-darwin-arm64/-/dsh-vision-router-ocr-darwin-arm64-1.0.0.tgz","bytes":27917268,"sha256":"a5245c2420fa10ab9da124e2f8e308930a202c6239b4711b0dd73c14f29b78cd","npmBytes":27915270,"npmSha256":"905085d59e9daa1dc6c6f9be377f47d59c99aafb82924baff2325a4b9cc17aaa"},"distributionReady":false,"ownerPublicationAuthorized":false}
          JSON
          cat > "$RUNNER_TEMP/windows-report.json" <<'JSON'
          {"schemaVersion":1,"target":"win32-x64","name":"dsh-vision-router-ocr-win32-x64","version":"1.0.0","filename":"dsh-vision-router-ocr-win32-x64-1.0.0.tgz","entry":{"url":"https://registry.npmjs.org/dsh-vision-router-ocr-win32-x64/-/dsh-vision-router-ocr-win32-x64-1.0.0.tgz","bytes":35313963,"sha256":"fd5791ed9697dbd32ac59b1025600a8a299d8884c607acf6f977445310734ae0","npmBytes":35312250,"npmSha256":"acca7abc14b92b8d6441ce84e02cb67b18535cc29a57c299425fe16260229c75"},"distributionReady":false,"ownerPublicationAuthorized":false}
          JSON
          # Diagnose public availability independently of the fail-closed downloader.
          for target in darwin-arm64 win32-x64; do
            name="dsh-vision-router-ocr-$target"
            echo "Public npm metadata: $name@1.0.0"
            curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/$target-meta.json" \
              --write-out 'metadata HTTP %{http_code}\n' "https://registry.npmjs.org/$name/1.0.0" || true
            node --input-type=module - "$RUNNER_TEMP/$target-meta.json" <<'NODE'
          import {readFileSync} from 'node:fs'
          try {
            const p=JSON.parse(readFileSync(process.argv[2],'utf8'))
            console.log(JSON.stringify({name:p.name,version:p.version,dist:p.dist,error:p.error,reason:p.reason}))
          } catch(e) { console.log('Metadata not readable: '+e.message) }
          NODE
            curl --silent --show-error --max-time 20 --head \
              --write-out 'tarball HEAD HTTP %{http_code}\n' "https://registry.npmjs.org/$name/-/$name-1.0.0.tgz" || true
          done
          for attempt in 1 2 3 4; do
            if node quality/native-ocr-npm-handoff.mjs --verify-registry \
              --mac-report "$RUNNER_TEMP/mac-report.json" \
              --windows-report "$RUNNER_TEMP/windows-report.json" \
              --out "$RUNNER_TEMP/native-ocr-registry-readback.json"; then
              break
            fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 15
          done
          node --input-type=module - "$RUNNER_TEMP/native-ocr-registry-readback.json" <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const report=JSON.parse(readFileSync(process.argv[2],'utf8'))
          assert.equal(report.resourceVersion,'1.0.0')
          assert.equal(report.registryReadbackVerified,true)
          assert.equal(report.actualPublicHttps,true)
          assert.equal(report.distributionReady,false)
          assert.equal(report.ownerPublicationAuthorized,false)
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-registry-readback-1.0.0
          path: ${{ runner.temp }}/native-ocr-registry-readback.json
          if-no-files-found: error
