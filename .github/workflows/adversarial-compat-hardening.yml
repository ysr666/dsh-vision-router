name: DVR 3.2 capture and adversarial image regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clipboard-resource-budget:
    name: clipboard bitmap resource budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.9.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify browser-side BMP decode budget and existing clipboard behavior
        run: >-
          node --test
          tests/clipboard-image-paste-compat.test.js
          tests/client-presentation-boundary.test.js

  build-runtime-artifacts:
    name: build runtime artifacts for the pnpm-free Windows smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.9.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-lib
          path: lib
          if-no-files-found: error
          retention-days: 1

  windows-node24-screenshot:
    name: Windows Node 24 screenshot runtime
    needs: [build-runtime-artifacts]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.9.0'
      # The package no longer commits its build output (sources live in src/ and
      # build into lib/), so this pnpm-free Windows smoke takes the artifacts from
      # the build job instead of installing a package manager in a 5-minute job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-lib
          path: lib
      - name: Exercise the real PowerShell/DPI helper on the issue-409 runtime combination
        run: node --test tests/qa-screenshot-runtime.test.js tests/tesseract-node24-boot.test.js

  linux-desktop-screenshot:
    name: Linux X11 desktop screenshot runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.9.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prefer official Ubuntu apt mirror for X11 dependencies
        run: bash scripts/ci-prefer-ubuntu-archive.sh
      - name: Install X11 screenshot runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick scrot
      - name: Exercise the real Linux root-display capture
        run: xvfb-run -a node --test tests/linux-desktop-screenshot-runtime.test.js
