name: Adversarial compatibility hardening

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clipboard-resource-budget:
    name: clipboard bitmap resource budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify browser-side BMP decode budget and existing clipboard behavior
        run: >-
          node --test
          tests/clipboard-image-paste-compat.test.js
          tests/client-presentation-boundary.test.js

  windows-node24-screenshot:
    name: Windows Node 24 screenshot runtime
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Exercise the real PowerShell/DPI helper on the issue-409 runtime combination
        run: node --test tests/qa-screenshot-runtime.test.js tests/tesseract-node24-boot.test.js

  preview-host-contract:
    name: DSH ${{ matrix.dsh }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.1.5-rc.2', '0.1.5-alpha.2']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack Vision Router
        run: |
          mkdir -p tmp-pack
          pnpm pack --pack-destination tmp-pack
      - name: Install isolated release Host family
        shell: node {0}
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: |
          const fs = require('node:fs')
          const path = require('node:path')
          const { spawnSync } = require('node:child_process')

          const tgz = fs.readdirSync('tmp-pack').find((name) => name.endsWith('.tgz'))
          if (!tgz) throw new Error('packed plugin tarball not found')
          const tarball = path.resolve('tmp-pack', tgz).replaceAll('\\', '/')
          const v = process.env.DSH_VERSION
          const hostDir = path.join(
            process.env.RUNNER_TEMP,
            `dvr-release-${v}-node-${process.versions.node}`,
          )
          fs.rmSync(hostDir, { recursive: true, force: true })
          fs.mkdirSync(hostDir, { recursive: true })
          fs.writeFileSync(path.join(hostDir, 'package.json'), JSON.stringify({
            private: true,
            type: 'module',
            packageManager: 'pnpm@11.20.0',
            dependencies: {
              'dsh-vision-router': `file:${tarball}`,
              '@deepseek-ai/dsh-anonymous-user-id': v,
              '@deepseek-ai/dsh-attachment': v,
              '@deepseek-ai/dsh-attachment-local': v,
              '@deepseek-ai/dsh-llm': v,
              '@deepseek-ai/dsh-llm-deepseek': v,
              '@deepseek-ai/dsh-llm-pi-ai': v,
              '@deepseek-ai/dsh-settings': v,
              '@deepseek-ai/dsh-system-prompt': v,
              '@deepseek-ai/dsh-tools': v,
              '@deepseek-ai/dsh-session': v,
              '@deepseek-ai/dsh-session-projection': v,
              '@deepseek-ai/dsh-session-persistence-jsonl': v,
              '@deepseek-ai/dsh-agent': v,
              '@deepseek-ai/dsh-agent-loop': v,
              sharp: '0.35.3',
            },
          }, null, 2))
          fs.writeFileSync(path.join(hostDir, 'pnpm-workspace.yaml'), [
            'packages:',
            '  - .',
            'allowBuilds:',
            '  koffi: true',
            '  fs-ext: true',
            "  '@google/genai': true",
            '  protobufjs: true',
            '',
          ].join('\n'))
          const installed = spawnSync('pnpm', ['install'], {
            cwd: hostDir,
            stdio: 'inherit',
          })
          if (installed.status !== 0) process.exit(installed.status ?? 1)
          fs.appendFileSync(process.env.GITHUB_ENV, `DSH_CONTRACT_HOST_DIR=${hostDir}\n`)
      - name: Verify release Host capability contract
        env:
          EXPECT_BATCH: 'true'
          EXPECT_DIMENSION: 'true'
          EXPECT_CURRENT: 'true'
        run: node scripts/dsh-host-contract-smoke.mjs
      - name: Verify release pi-ai final OpenCode wire
        run: node tests/opencode-session-wire-contract.mjs
      - name: Verify release-family Session native image process-restart lifecycle
        run: node scripts/dsh-preview-native-lifecycle-contract.mjs
