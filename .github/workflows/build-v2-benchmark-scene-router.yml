name: build v2 benchmark scene router

on:
  push:
    branches:
      - feat/v2-benchmark-scene-router-test
    paths:
      - scripts/patch-benchmark-scene-router.mjs
      - .github/workflows/build-v2-benchmark-scene-router.yml

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-benchmark-scene-router-test
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact benchmark and scene-router patch
        run: node scripts/patch-benchmark-scene-router.mjs
      - name: Syntax checks
        run: |
          node --check index.js
          node --check lib/vision-scene-router.js
          node --check lib/structured-bootstrap.js
      - name: Focused tests
        run: |
          node --test \
            tests/vision-capability-router.test.js \
            tests/vision-capability-reference.test.js \
            tests/vision-capability-benchmark.test.js \
            tests/capability-shadow.test.js \
            tests/structured-bootstrap.test.js \
            tests/structured-bootstrap-gate.test.js \
            tests/vision-scene-router.test.js \
            tests/benchmark-scene-router-integration.test.js
      - name: Diff check
        run: git diff --check
      - name: Finalize test branch
        run: |
          rm -f scripts/patch-benchmark-scene-router.mjs
          rm -f .github/workflows/build-v2-benchmark-scene-router.yml
          rm -f scripts/patch-v2-capability-benchmark.mjs
          rm -f .github/workflows/v2-capability-benchmark-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire exact benchmark and post-bootstrap scene routing"
          git push origin HEAD:feat/v2-benchmark-scene-router-test
