name: Apply guide refactor final

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Harden structural guide resolution
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          client_path = Path('lib/client.js')
          source = client_path.read_text()
          old = """      const sync = () => scheduleGuideSync(guideTranslator)
      window.addEventListener('popstate', sync)
      window.addEventListener('resize', sync)
      document.addEventListener('scroll', sync, true)
      let observer
      const Observer = window.MutationObserver || globalThis.MutationObserver
      if (typeof Observer === 'function') {
        observer = new Observer(sync)
        observer.observe(document.body, {
childList: true,
subtree: true,
attributes: true,
attributeFilter: ['aria-expanded', 'aria-hidden', 'class'],
        })
      }
      guideRuntimeDispose = () => {
        window.removeEventListener('popstate', sync)
        window.removeEventListener('resize', sync)
        document.removeEventListener('scroll', sync, true)
        if (observer && typeof observer.disconnect === 'function') observer.disconnect()
      }
"""
          new = """      const sync = () => scheduleGuideSync(guideTranslator)
      // Structural host changes must bypass the short geometry cache. With the
      // old 600ms keep-alive removed, swallowing the one mutation that opens or
      // closes Settings could otherwise leave the guide stuck forever.
      const resolveSync = () => {
        visionGuideResolved.at = 0
        scheduleGuideSync(guideTranslator)
      }
      window.addEventListener('popstate', resolveSync)
      window.addEventListener('resize', sync)
      document.addEventListener('scroll', sync, true)
      let observer
      const Observer = window.MutationObserver || globalThis.MutationObserver
      if (typeof Observer === 'function') {
        observer = new Observer(resolveSync)
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['aria-expanded', 'aria-hidden', 'class'],
        })
      }
      guideRuntimeDispose = () => {
        window.removeEventListener('popstate', resolveSync)
        window.removeEventListener('resize', sync)
        document.removeEventListener('scroll', sync, true)
        if (observer && typeof observer.disconnect === 'function') observer.disconnect()
      }
"""
          if old not in source:
            raise SystemExit('guide runtime block not found')
          source = source.replace(old, new, 1)

          source = source.replace(
            """                    onClick: () => {
            guideHostUi.closeSettings()
            const reveal = () => showOnboarding(t, { auto: false, focus: true })
            if (typeof window.requestAnimationFrame === 'function') window.requestAnimationFrame(reveal)
            else reveal()
          },
""",
            """                    onClick: () => {
                      guideHostUi.closeSettings()
                      const reveal = () => showOnboarding(t, { auto: false, focus: true })
                      if (typeof window.requestAnimationFrame === 'function') window.requestAnimationFrame(reveal)
                      else reveal()
                    },
""",
            1,
          )
          client_path.write_text(source)

          test_path = Path('tests/guide-scroll-gate.test.js')
          tests = test_path.read_text()
          tests = tests.replace('  const frames = []\n  const target = fakeElement()\n', '  const frames = []\n  let mutationCallback\n  const target = fakeElement()\n', 1)
          tests = tests.replace(
            """  const window = {
    innerWidth: 1280, innerHeight: 800,
""",
            """  class FakeMutationObserver {
    constructor(callback) { mutationCallback = callback }
    observe() {}
    disconnect() { mutationCallback = undefined }
  }
  const window = {
    innerWidth: 1280, innerHeight: 800,
    MutationObserver: FakeMutationObserver,
""",
            1,
          )
          tests = tests.replace(
            """  return { counters, document, window, listeners,
    scroll() { const fn = listeners.get('document:scroll'); if (fn) fn() },
    frame() { const work = frames.splice(0); for (const fn of work) fn() },
  }
""",
            """  return { counters, document, window, listeners,
    scroll() { const fn = listeners.get('document:scroll'); if (fn) fn() },
    mutate() { if (typeof mutationCallback === 'function') mutationCallback([]) },
    frame() { const work = frames.splice(0); for (const fn of work) fn() },
  }
""",
            1,
          )
          marker = "test('ending a guide disposes global listeners so later scrolls stay inert', () => {\n"
          regression = """test('structural DOM mutations invalidate cached guide target resolution immediately', () => {
  const { h, bundle, dispose } = boot()
  const realNow = Date.now
  Date.now = () => 1000
  try {
    bundle.startVisionSettingsGuide((key) => key)
    h.frame()
    const beforeMutation = h.counters.queries
    h.mutate()
    h.frame()
    assert.ok(h.counters.queries > beforeMutation, 'structural mutation must bypass the target cache')
  } finally {
    Date.now = realNow
    bundle.finishVisionSettingsGuide()
    dispose()
  }
})

"""
          if marker not in tests:
            raise SystemExit('test insertion marker missing')
          tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Format rewritten lifecycle block only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('lib/client.js').read_text()
          start = source.index("    const ONBOARDING_STORAGE_KEY = 'dsh-vision-router:onboarding:model-guide-v2'")
          end = source.index('    const LABEL_KEY = {', start)
          Path('/tmp/guide-range').write_text(f'{start}\n{end}\n')
          Path('/tmp/guide.js').write_text('function __guide__() {\n' + source[start:end] + '\n}\n')
          PY
          npx --yes prettier@3.6.2 /tmp/guide.js --write --parser babel --no-semi --single-quote --print-width 120 --trailing-comma all
          python3 <<'PY'
          from pathlib import Path
          source = Path('lib/client.js').read_text()
          start, end = map(int, Path('/tmp/guide-range').read_text().splitlines())
          lines = Path('/tmp/guide.js').read_text().splitlines()
          if not lines[0].startswith('function __guide__()') or lines[-1] != '}':
            raise SystemExit('unexpected formatter wrapper')
          body = '\n'.join(('  ' + line if line else '') for line in lines[1:-1]).rstrip() + '\n\n'
          Path('lib/client.js').write_text(source[:start] + body + source[end:])
          PY

      - name: Run focused regression tests
        run: node --test tests/client.test.js tests/guide-scroll-gate.test.js

      - name: Commit validated hardening
        shell: bash
        run: |
          rm -f .github/workflows/guide-lifecycle-pr-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden guide lifecycle resolution (#207)"
          git push origin HEAD:${{ github.head_ref }}
