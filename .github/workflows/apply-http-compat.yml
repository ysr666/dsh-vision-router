name: Apply HTTP provider compatibility patch

on:
  push:
    branches: [agent/http-provider-compat-presets]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/http-provider-compat-presets
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: node scripts/apply-http-compat-fix.mjs
      - name: Syntax and whitespace checks
        run: |
          node --check index.js
          node --check lib/http-compat.js
          git diff --check
      - name: Commit patched core
        shell: bash
        run: |
          if git diff --quiet -- index.js; then
            echo 'index.js already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js
          git commit -m 'fix: wire HTTP provider compatibility into core'
          git push origin HEAD:agent/http-provider-compat-presets
