name: 2.3 Critical Architecture Gate

on:
  push:
    branches: [2.3.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full runtime regression
        run: pnpm test
      - name: Critical composition and architecture contracts
        run: >-
          node --test
          tests/architecture-contract-baseline.test.js
          tests/compat-inventory-completeness.test.js
          tests/final-architecture-closure.test.js
          tests/p3-entry-composition.test.js
          tests/qa-runtime-identity.test.js
          tests/fetch-wrapper-lifecycle.test.js
          tests/fetch-wrapper-composition.test.js
          tests/security-property-fuzz.test.js
      - name: Package public entry
        run: |
          mkdir -p tmp-pack
          pnpm pack --pack-destination tmp-pack
          test -n "$(find tmp-pack -maxdepth 1 -name 'dsh-vision-router-*.tgz' -print -quit)"

  current-host-contract:
    name: supported Host contract matrix
    uses: ./.github/workflows/dsh-contract.yml

  critical-gate:
    name: critical-gate
    if: always()
    needs: [contracts, current-host-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Require every constituent gate
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          HOST_RESULT: ${{ needs.current-host-contract.result }}
        run: |
          test "$CONTRACTS_RESULT" = success
          test "$HOST_RESULT" = success
