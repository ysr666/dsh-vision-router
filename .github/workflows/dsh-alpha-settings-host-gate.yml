name: Latest DSH Alpha Settings Host Gate

# The alpha channel is drift surveillance, not the support-policy evidence point: the
# canaries resolve a floating version, and the support window only moves when it is
# advanced explicitly. What the channel lacked was the real-Host settings lifecycle the
# 0.2.0-rc.2 boundary runs, so a settings-surface change could satisfy every contract check
# and still break mount / save / reload / readback on a real alpha Host. This lane builds
# the source a published alpha maps to and drives the same real browser lifecycle against
# it, so the drifting channel is measured end to end instead of only by contract.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: Exact DSH version to test (defaults to the published alpha dist-tag)
        required: false
        type: string
      source_sha:
        description: Upstream source commit to build (defaults to the tag of the resolved version)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dsh-alpha-settings-host-gate
  cancel-in-progress: false

jobs:
  alpha-settings-host:
    name: real alpha Host + Chromium settings lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # A published version is the only stable handle on a drifting channel: resolve the
      # dist-tag, then map it to the upstream source via its release tag. An annotated tag
      # points at a tag object, so dereference it once before checking out.
      - name: Resolve the alpha release and its source commit
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          VERSION="$REQUESTED_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="$(npm view @deepseek-ai/dsh dist-tags.alpha)"
          fi
          test -n "$VERSION"
          SHA="$REQUESTED_SHA"
          if [ -z "$SHA" ]; then
            REF="$(gh api "repos/deepseek-ai/deepseek-harness/git/ref/tags/dsh-v${VERSION}")"
            SHA="$(printf '%s' "$REF" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
            TYPE="$(printf '%s' "$REF" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["type"])')"
            if [ "$TYPE" = "tag" ]; then
              SHA="$(gh api "repos/deepseek-ai/deepseek-harness/git/tags/${SHA}" --jq '.object.sha')"
            fi
          fi
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::resolved alpha source is not a commit: $SHA"
            exit 1
          }
          echo "Testing @deepseek-ai/dsh $VERSION at $SHA"
          {
            printf 'version=%s\n' "$VERSION"
            printf 'sha=%s\n' "$SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Alpha settings host gate'
            echo
            echo "- DSH version: \`$VERSION\`"
            echo "- source commit: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr
      - name: Checkout the resolved alpha source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.resolve.outputs.sha }}
          persist-credentials: false
          path: dsh-alpha
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: dsh-alpha/pnpm-lock.yaml

      - name: Materialize Vision Router package artifacts
        working-directory: dvr
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm build:check
      - name: Install alpha Host workspace dependencies
        working-directory: dsh-alpha
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      # Weekly cadence would let a DSH build cache expire between runs, so this lane keeps
      # only the Playwright apt cache that the per-PR gates refresh.
      - name: Build the alpha Host runtime
        working-directory: dsh-alpha
        run: pnpm run build

      - name: Restore cached Playwright system packages
        id: playwright-apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/playwright-apt-archives
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}
      - name: Seed the apt package cache
        if: steps.playwright-apt-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo cp -n ~/playwright-apt-archives/*.deb /var/cache/apt/archives/ || true
      - name: Install Chromium
        working-directory: dsh-alpha
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Collect Playwright system packages
        id: playwright-apt-collect
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/playwright-apt-archives
          sudo cp -n /var/cache/apt/archives/*.deb ~/playwright-apt-archives/ || true
          sudo chown -R "$(id -u):$(id -g)" ~/playwright-apt-archives
          count="$(find ~/playwright-apt-archives -name '*.deb' | wc -l | tr -d ' ')"
          printf 'packages=%s\n' "$count" >> "$GITHUB_OUTPUT"
      # Only a run that downloaded packages has something worth caching, and an empty
      # archive would pin the shared key to a useless entry.
      - name: Save Playwright system packages
        if: steps.playwright-apt-cache.outputs.cache-hit != 'true' && steps.playwright-apt-collect.outputs.packages != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/playwright-apt-archives
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}

      # The gate this lane exists for: the same real browser lifecycle the 0.2.0-rc.2
      # boundary runs, against a Host built from the resolved alpha source.
      - name: Run Settings mount/save/reload/readback lifecycle
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: ${{ steps.resolve.outputs.version }}
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-alpha-settings.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-alpha-settings.png
        run: node ../dvr/scripts/dsh-preview-settings-browser-lifecycle-smoke.mjs
      - name: Run Desktop Host injection contract
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DVR_DESKTOP_BASE_PORT: '19410'
        run: node ../dvr/scripts/dsh017-desktop-host-injection-smoke.mjs

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-alpha-settings-host-diagnostics
          path: |
            ${{ runner.temp }}/dsh-alpha-settings.json
            ${{ runner.temp }}/dsh-alpha-settings.png
          if-no-files-found: ignore
