name: Latest DSH Alpha Settings Host Gate

# The alpha channel is drift surveillance, not the support-policy evidence point: the
# canaries resolve a floating version, and the support window only moves when it is
# advanced explicitly. What the channel lacked was the real-Host settings lifecycle the
# 0.2.0-rc.2 boundary runs, so a settings-surface change could satisfy every contract check
# and still break mount / save / reload / readback on a real alpha Host. This lane builds
# the source a published alpha maps to and drives the same real browser lifecycle against
# it, so the drifting channel is measured end to end instead of only by contract.
on:
  pull_request:
    paths:
      - '.github/workflows/dsh-alpha-settings-host-gate.yml'
      - 'scripts/build-source-artifacts.mjs'
      - 'scripts/dsh-alpha-source-contract.mjs'
      - 'scripts/dsh-peer-admission-contract.mjs'
      - 'scripts/dsh-proxy-egress-contract.mjs'
      - 'scripts/dsh017-bundle-recompose-smoke.mjs'
      - 'scripts/dsh017-desktop-host-injection-smoke.mjs'
      - 'scripts/dsh017-desktop-multiplugin-smoke.mjs'
      - 'scripts/dsh-desktop-renderer-e2e.mjs'
      - 'scripts/dsh-preview-mixed-attachment-paste-smoke.mjs'
      - 'scripts/dsh-preview-settings-browser-lifecycle-smoke.mjs'
      - 'scripts/alpha-browser-cold-toggle-smoke.mjs'
      - 'src/**'
  schedule:
    - cron: '23 5 * * 1'
  # Merging a pin bump is the review step for adopting a new alpha, so the gate re-runs on
  # the push that lands it instead of waiting for the next weekly run.
  push:
    branches: [main]
    paths:
      - '.github/workflows/dsh-alpha-settings-host-gate.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  alpha-exact-source:
    name: exact alpha source / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr
      - name: Checkout immutable DSH 0.2.1-alpha.1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 5badb15009ae1756c3afe0ae0cef1faafc290ccc
          persist-credentials: false
          path: dsh-alpha
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
      - name: Materialize Vision Router package artifacts
        working-directory: dvr
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm build:check
      - name: Install exact alpha Host workspace dependencies
        working-directory: dsh-alpha
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Run exact source and Host-owned Sharp contract
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DSH_EXPECTED_VERSION: 0.2.1-alpha.1
          DSH_EXPECTED_COMMIT: 5badb15009ae1756c3afe0ae0cef1faafc290ccc
        run: pnpm exec tsx ../dvr/scripts/dsh-alpha-source-contract.mjs
      - name: Verify public 0.2 train peer admission
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
        run: pnpm exec tsx ../dvr/scripts/dsh-peer-admission-contract.mjs
      - name: Verify Host proxy egress authority
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
        run: pnpm exec tsx ../dvr/scripts/dsh-proxy-egress-contract.mjs
      - name: Build exact macOS Desktop runtime
        if: matrix.os == 'macos-latest'
        working-directory: dsh-alpha
        run: pnpm run build
      - name: Run real macOS Desktop renderer lifecycle
        if: matrix.os == 'macos-latest'
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.2.1-alpha.1
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-alpha-macos-desktop-renderer.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-alpha-macos-desktop-renderer.png
        run: node --import tsx ../dvr/scripts/dsh-desktop-renderer-e2e.mjs
      - name: Upload macOS Desktop diagnostics on failure
        if: matrix.os == 'macos-latest' && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-alpha-macos-desktop-diagnostics
          path: ${{ runner.temp }}/dsh-alpha-macos-desktop-renderer.*
          if-no-files-found: ignore

  alpha-settings-host:
    name: real alpha Host + Chromium lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr
      - name: Checkout the resolved alpha source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 5badb15009ae1756c3afe0ae0cef1faafc290ccc # dsh-v0.2.1-alpha.1
          persist-credentials: false
          path: dsh-alpha
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      # No `cache: pnpm` here on purpose: this lane runs on a schedule from the default
      # branch and checks out a floating upstream ref, so anything it writes into a shared
      # cache would come from code nobody pinned. The store lives for this run only.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      - name: Read the Host version under test
        id: resolve
        working-directory: dsh-alpha
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test -n "$VERSION"
          echo "Testing @deepseek-ai/dsh $VERSION"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo '### Alpha settings host gate'
            echo
            echo "- DSH version: \`$VERSION\`"
            echo "- source commit: \`$(git rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Materialize Vision Router package artifacts
        working-directory: dvr
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm build:check
      - name: Install alpha Host workspace dependencies
        working-directory: dsh-alpha
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      # This lane touches no cache at all, on purpose: it runs from the default branch on a
      # schedule against a floating upstream ref, so anything it read from or wrote to a
      # shared cache would come from code nobody pinned. The Chromium install therefore pays
      # the mirror cost on its own, which a weekly lane can afford.
      - name: Build the alpha Host runtime
        working-directory: dsh-alpha
        run: pnpm run build

      - name: Install Chromium
        working-directory: dsh-alpha
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Run bundle recompose stability
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: ${{ steps.resolve.outputs.version }}
        run: node ../dvr/scripts/dsh017-bundle-recompose-smoke.mjs
      - name: Run cold Vision lifecycle
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: ${{ steps.resolve.outputs.version }}
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-alpha-cold-toggle.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-alpha-cold-toggle.png
        run: node ../dvr/scripts/alpha-browser-cold-toggle-smoke.mjs
      - name: Run mixed attachment lifecycle
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: ${{ steps.resolve.outputs.version }}
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-alpha-mixed.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-alpha-mixed.png
        run: node ../dvr/scripts/dsh-preview-mixed-attachment-paste-smoke.mjs
      - name: Run Settings mount/save/reload/readback lifecycle
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: ${{ steps.resolve.outputs.version }}
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-alpha-settings.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-alpha-settings.png
        run: node ../dvr/scripts/dsh-preview-settings-browser-lifecycle-smoke.mjs
      - name: Run Desktop Host injection contract
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DVR_DESKTOP_BASE_PORT: '19410'
        run: node --import tsx ../dvr/scripts/dsh017-desktop-host-injection-smoke.mjs

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-alpha-settings-host-diagnostics
          path: |
            ${{ runner.temp }}/dsh-alpha-*.json
            ${{ runner.temp }}/dsh-alpha-*.png
          if-no-files-found: ignore

  alpha-windows-desktop:
    name: Windows alpha Desktop / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.21.0]
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr
      - name: Checkout immutable DSH 0.2.1-alpha.1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 5badb15009ae1756c3afe0ae0cef1faafc290ccc
          persist-credentials: false
          path: dsh-alpha
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Materialize Vision Router package artifacts
        working-directory: dvr
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm build:check
      - name: Install exact alpha Host workspace dependencies
        working-directory: dsh-alpha
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Build exact Desktop runtime
        working-directory: dsh-alpha
        run: pnpm run build
      - name: Run authenticated Desktop Host contract
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.2.1-alpha.1
          DVR_DESKTOP_BASE_PORT: '19410'
        run: node --import tsx ../dvr/scripts/dsh017-desktop-host-injection-smoke.mjs
      - name: Run Node 24 Desktop renderer lifecycle
        if: matrix.node == '24.21.0'
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.2.1-alpha.1
          DVR_DESKTOP_BASE_PORT: '19510'
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-alpha-windows-desktop-renderer.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-alpha-windows-desktop-renderer.png
        run: node --import tsx ../dvr/scripts/dsh-desktop-renderer-e2e.mjs
      - name: Run Node 24 multi-plugin ordering adversary
        if: matrix.node == '24.21.0'
        working-directory: dsh-alpha
        shell: bash
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.2.1-alpha.1
          DVR_MULTIPLUGIN_BASE_PORT: '19600'
        run: |
          set -euo pipefail
          for index in 0 1; do
            DVR_MULTIPLUGIN_SHARD_COUNT=2 DVR_MULTIPLUGIN_SHARD_INDEX="$index" \
              node --import tsx ../dvr/scripts/dsh017-desktop-multiplugin-smoke.mjs
          done
      - name: Upload Windows Desktop diagnostics on failure
        if: matrix.node == '24.21.0' && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-alpha-windows-desktop-diagnostics
          path: ${{ runner.temp }}/dsh-alpha-windows-desktop-renderer.*
          if-no-files-found: ignore
