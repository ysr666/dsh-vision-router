name: Copilot review gate

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  copilot-review-gate:
    name: Copilot review gate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Require Copilot review of current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_REVIEW_LOGIN: ${{ github.event.review.user.login }}
          EVENT_REVIEW_TYPE: ${{ github.event.review.user.type }}
          EVENT_REVIEW_STATE: ${{ github.event.review.state }}
          EVENT_REVIEW_COMMIT_SHA: ${{ github.event.review.commit_id }}
          EVENT_REVIEW_BODY: ${{ github.event.review.body }}
          EVENT_REVIEW_ASSOCIATION: ${{ github.event.review.author_association }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_ACTION" == "submitted" \
            && "$EVENT_REVIEW_LOGIN" == "copilot-pull-request-reviewer[bot]" \
            && "$EVENT_REVIEW_TYPE" == "Bot" \
            && "$EVENT_REVIEW_COMMIT_SHA" == "$HEAD_SHA" \
            && "$EVENT_REVIEW_STATE" != "DISMISSED" \
            && "$EVENT_REVIEW_BODY" == *"<summary>Review details</summary>"* \
            && "$EVENT_REVIEW_BODY" == *"Files reviewed:"* ]]; then
            echo "Copilot review event covers current PR head $HEAD_SHA"
            exit 0
          fi

          MATCHING_REVIEW_ID="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
              --jq ".[] | select(.user.login == \"copilot-pull-request-reviewer[bot]\" and .user.type == \"Bot\" and .commit_id == \"$HEAD_SHA\" and .state != \"DISMISSED\" and ((.body // \"\") | contains(\"<summary>Review details</summary>\")) and ((.body // \"\") | contains(\"Files reviewed:\"))) | .id" \
              | sed -n '1p'
          )"

          if [[ -n "$MATCHING_REVIEW_ID" ]]; then
            echo "Copilot review $MATCHING_REVIEW_ID covers current PR head $HEAD_SHA"
            exit 0
          fi

          QUOTA_FAILURE_ID="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
              --jq ".[] | select(.user.login == \"copilot-pull-request-reviewer[bot]\" and .user.type == \"Bot\" and .commit_id == \"$HEAD_SHA\" and .state != \"DISMISSED\" and (((.body // \"\") | ascii_downcase) | test(\"quota limit|rate limit|usage limit|ai credits\"))) | .id" \
              | sed -n '1p'
          )"

          OWNER_FALLBACK_ID="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
              --jq ".[] | select(.commit_id == \"$HEAD_SHA\" and .state != \"DISMISSED\" and .author_association == \"OWNER\" and ((.body // \"\") | contains(\"[DVR_COPILOT_QUOTA_FALLBACK]\"))) | .id" \
              | sed -n '1p'
          )"

          if [[ -n "$QUOTA_FAILURE_ID" && -n "$OWNER_FALLBACK_ID" ]]; then
            echo "Copilot quota fallback review $OWNER_FALLBACK_ID covers current PR head $HEAD_SHA after quota failure $QUOTA_FAILURE_ID"
            exit 0
          fi

          echo "::error::Copilot has not completed a review for current PR head $HEAD_SHA; quota fallback requires a current-head OWNER review marked [DVR_COPILOT_QUOTA_FALLBACK] after an explicit Copilot quota/rate-limit failure"
          exit 1
