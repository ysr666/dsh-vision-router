name: Update dshpm compatibility note once

on:
  push:
    branches: ['docs/dshpm-042-compatible']
    paths:
      - '.github/workflows/update-dshpm-readme-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/dshpm-042-compatible
          fetch-depth: 0
      - name: Update bilingual README compatibility note
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text()
          old = '''For normal npm/npx installs, installation is a single command:\n\n```sh\nnpx @deepseek-ai/dsh plugin --profile web add dsh-vision-router\n```\n\nIf you run DeepSeek Harness from a source checkout with pnpm, use the workspace script instead — `dsh` is not necessarily on your shell `PATH`:'''
          new = '''For normal npm/npx installs, installation is a single command:\n\n```sh\nnpx @deepseek-ai/dsh plugin --profile web add dsh-vision-router\n```\n\n> [!NOTE]\n> Third-party `dsh-web-plugin-manager` / `dshpm` **v0.4.2+** is also compatible: its quality gate now correctly allows `@deepseek-ai/schemastery` as a runtime dependency. The official DSH CLI above remains the recommended install path.\n\nIf you run DeepSeek Harness from a source checkout with pnpm, use the workspace script instead — `dsh` is not necessarily on your shell `PATH`:'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('README.zh.md')
          s = p.read_text()
          old = '''普通 npm / npx 安装只需要一条命令：\n\n```sh\nnpx @deepseek-ai/dsh plugin --profile web add dsh-vision-router\n```\n\n如果你是从 DeepSeek Harness 源码仓库通过 pnpm 运行，`dsh` 不一定在系统 `PATH` 里，请改用工作区脚本：'''
          new = '''普通 npm / npx 安装只需要一条命令：\n\n```sh\nnpx @deepseek-ai/dsh plugin --profile web add dsh-vision-router\n```\n\n> [!NOTE]\n> 第三方 `dsh-web-plugin-manager` / `dshpm` **v0.4.2+** 现已兼容：其质量门已正确放行作为运行时依赖的 `@deepseek-ai/schemastery`。上面的官方 DSH CLI 仍是推荐安装方式。\n\n如果你是从 DeepSeek Harness 源码仓库通过 pnpm 运行，`dsh` 不一定在系统 `PATH` 里，请改用工作区脚本：'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/update-dshpm-readme-once.yml
          git add README.md README.zh.md
          git commit -m 'docs: note dshpm 0.4.2 compatibility'
          git push origin HEAD:docs/dshpm-042-compatible
