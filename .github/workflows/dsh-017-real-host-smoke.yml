name: DSH 0.1.7 real Host smoke

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/dsh-017-real-host-smoke.yml'
      - 'src/index.js'
      - 'cordis.patch.yml'
      - 'package.json'
      - 'src/lib/**'
      - 'scripts/alpha-browser-cold-toggle-smoke.mjs'
      - 'scripts/ci-heavy-host-impact.mjs'
      - 'scripts/dsh017-bundle-recompose-smoke.mjs'
      - 'scripts/dsh017-desktop-host-injection-smoke.mjs'
      - 'scripts/dsh-desktop-renderer-e2e.mjs'
      - 'scripts/dsh017-desktop-multiplugin-smoke.mjs'
      - 'scripts/dsh-preview-mixed-attachment-paste-smoke.mjs'
      - 'scripts/dsh-preview-settings-browser-lifecycle-smoke.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dsh-017-real-host-smoke.yml'
      - 'src/index.js'
      - 'cordis.patch.yml'
      - 'package.json'
      - 'src/lib/**'
      - 'scripts/alpha-browser-cold-toggle-smoke.mjs'
      - 'scripts/ci-heavy-host-impact.mjs'
      - 'scripts/dsh017-bundle-recompose-smoke.mjs'
      - 'scripts/dsh017-desktop-host-injection-smoke.mjs'
      - 'scripts/dsh-desktop-renderer-e2e.mjs'
      - 'scripts/dsh017-desktop-multiplugin-smoke.mjs'
      - 'scripts/dsh-preview-mixed-attachment-paste-smoke.mjs'
      - 'scripts/dsh-preview-settings-browser-lifecycle-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: classify heavy Host impact
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify release-only vs Host-impacting change
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            printf 'heavy=true\nreason=trusted main/manual run seeds and validates Host caches\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'heavy=true\nreason=invalid PR identity: fail closed\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          if ! git cat-file -e "$BASE_SHA:scripts/ci-heavy-host-impact.mjs" 2>/dev/null; then
            printf 'heavy=true\nreason=trusted base classifier unavailable: fail closed\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "$BASE_SHA:scripts/ci-heavy-host-impact.mjs" > "$RUNNER_TEMP/ci-heavy-host-impact.mjs"
          git show "$BASE_SHA:package.json" > "$RUNNER_TEMP/base-package.json"
          git show "$HEAD_SHA:package.json" > "$RUNNER_TEMP/head-package.json"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          node "$RUNNER_TEMP/ci-heavy-host-impact.mjs" \
            --base-package "$RUNNER_TEMP/base-package.json" \
            --head-package "$RUNNER_TEMP/head-package.json" \
            < "$RUNNER_TEMP/changed-paths.txt"

  dsh-017-real-host:
    needs: impact
    if: needs.impact.outputs.heavy == 'true'
    name: DSH 0.1.7-rc.2 real Host + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr

      - name: Checkout immutable DSH 0.1.7-rc.2 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 477b4f420553e8a52c2fbccc464d7561b239c443
          persist-credentials: false
          path: dsh-017

      - name: Install upstream package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Restore cached Node runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/node
          key: node-runtime-${{ runner.os }}-${{ runner.arch }}-22.19.0

      - name: Install Node 22 browser runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: dsh-017/pnpm-lock.yaml

      - name: Materialize Vision Router package artifacts
        working-directory: dvr
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm build:check
      - name: Compute exact DSH web build cache key
        id: dsh-build-key
        working-directory: dsh-017
        shell: bash
        run: |
          set -euo pipefail
          DSH_SHA="$(git rev-parse HEAD)"
          LOCK_SHA="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          TREE_SHA="$(git ls-tree -r --full-tree HEAD | sha256sum | awk '{print $1}')"
          KEY="dsh-web-v4-${RUNNER_OS}-node22-pnpm11.7.0-${DSH_SHA}-${LOCK_SHA}-${TREE_SHA}"
          printf 'key=%s\n' "$KEY" >> "$GITHUB_OUTPUT"

      - name: Install DSH workspace dependencies
        working-directory: dsh-017
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile

      - name: Restore trusted DSH build cache
        id: dsh-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-017/lib
            dsh-017/packages/*/*/lib
            dsh-017/vendor/*/lib
            dsh-017/apps/*/lib
            dsh-017/apps/web/dist
            dsh-017/native/system/packages/*/lib
            dsh-017/native/system/packages/*/bin
            dsh-017/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}

      - name: Build DSH 0.1.7 web runtime
        if: steps.dsh-build-cache.outputs.cache-hit != 'true'
        working-directory: dsh-017
        run: pnpm run build

      - name: Save trusted DSH build cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dsh-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-017/lib
            dsh-017/packages/*/*/lib
            dsh-017/vendor/*/lib
            dsh-017/apps/*/lib
            dsh-017/apps/web/dist
            dsh-017/native/system/packages/*/lib
            dsh-017/native/system/packages/*/bin
            dsh-017/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}

      # `playwright install --with-deps` fetches the Chromium OS packages with apt on
      # every run; when the runner image lacks them the mirror can take minutes. Caching
      # the downloaded .deb files keeps the install identical while removing that tail.
      - name: Restore cached Playwright system packages
        id: playwright-apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/playwright-apt-archives
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}

      - name: Seed the apt package cache
        if: steps.playwright-apt-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo cp -n ~/playwright-apt-archives/*.deb /var/cache/apt/archives/ || true

      - name: Install Chromium for DSH Playwright
        working-directory: dsh-017
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium


      - name: Collect Playwright system packages
        id: playwright-apt-collect
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/playwright-apt-archives
          sudo cp -n /var/cache/apt/archives/*.deb ~/playwright-apt-archives/ || true
          sudo chown -R "$(id -u):$(id -g)" ~/playwright-apt-archives
          count="$(find ~/playwright-apt-archives -name '*.deb' | wc -l | tr -d ' ')"
          printf 'packages=%s\n' "$count" >> "$GITHUB_OUTPUT"

      # Only a run that actually downloaded packages has something worth caching: an
      # empty archive would pin this key to a useless entry.
      - name: Save Playwright system packages from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-apt-cache.outputs.cache-hit != 'true' && steps.playwright-apt-collect.outputs.packages != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/playwright-apt-archives
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}
      # Five independent Host/browser scenarios: each builds its own temp home and asks
      # the Host for a free port (`--port 0`), so they run together instead of one after
      # another. Every assertion and diagnostic path is unchanged, and the step fails if
      # any scenario fails.
      - name: Run the DSH 0.1.7 Host scenarios
        working-directory: dsh-017
        shell: bash
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-017
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.1.7-rc.2
          DVR_DESKTOP_BASE_PORT: '19410'
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP:-/tmp}/dvr-host-suite"
          mkdir -p "$out"
          pids=(); names=()
          node ../dvr/scripts/dsh017-bundle-recompose-smoke.mjs > "$out/bundle-recompose.log" 2>&1 &
          pids+=("$!"); names+=("bundle-recompose")
          node --import tsx ../dvr/scripts/dsh017-desktop-host-injection-smoke.mjs > "$out/injection.log" 2>&1 &
          pids+=("$!"); names+=("injection")
          SMOKE_DIAGNOSTIC_PATH="$RUNNER_TEMP/dsh-017-cold-toggle.json" SMOKE_SCREENSHOT_PATH="$RUNNER_TEMP/dsh-017-cold-toggle.png" \
            node ../dvr/scripts/alpha-browser-cold-toggle-smoke.mjs > "$out/cold-toggle.log" 2>&1 &
          pids+=("$!"); names+=("cold-toggle")
          SMOKE_DIAGNOSTIC_PATH="$RUNNER_TEMP/dsh-017-mixed.json" SMOKE_SCREENSHOT_PATH="$RUNNER_TEMP/dsh-017-mixed.png" \
            node ../dvr/scripts/dsh-preview-mixed-attachment-paste-smoke.mjs > "$out/mixed.log" 2>&1 &
          pids+=("$!"); names+=("mixed")
          SMOKE_DIAGNOSTIC_PATH="$RUNNER_TEMP/dsh-017-settings.json" SMOKE_SCREENSHOT_PATH="$RUNNER_TEMP/dsh-017-settings.png" \
            node ../dvr/scripts/dsh-preview-settings-browser-lifecycle-smoke.mjs > "$out/settings.log" 2>&1 &
          pids+=("$!"); names+=("settings")
          status=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || { status=1; echo "::error::${names[$i]} failed"; }
          done
          for i in "${!pids[@]}"; do
            echo "::group::${names[$i]}"
            cat "$out/${names[$i]}.log" || true
            echo "::endgroup::"
          done
          exit "$status"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-017-real-host-diagnostics
          path: ${{ runner.temp }}/dsh-017-*
          if-no-files-found: ignore
          retention-days: 2

  dsh-017-windows-desktop-host:
    needs: impact
    if: needs.impact.outputs.heavy == 'true'
    name: DSH 0.1.7-rc.2 Windows Desktop Host (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.21.0]
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr

      - name: Checkout immutable DSH 0.1.7-rc.2 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 477b4f420553e8a52c2fbccc464d7561b239c443
          persist-credentials: false
          path: dsh-017

      - name: Install upstream package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Restore cached Node runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/node
          key: node-runtime-${{ runner.os }}-${{ runner.arch }}-${{ matrix.node }}

      - name: Install Node ${{ matrix.node }} Desktop runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: dsh-017/pnpm-lock.yaml

      - name: Materialize Vision Router package artifacts
        working-directory: dvr
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm build:check
      - name: Compute exact DSH build cache key
        id: dsh-build-key
        working-directory: dsh-017
        shell: bash
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          set -euo pipefail
          DSH_SHA="$(git rev-parse HEAD)"
          LOCK_SHA="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          TREE_SHA="$(git ls-tree -r --full-tree HEAD | sha256sum | awk '{print $1}')"
          KEY="dsh-host-v4-${RUNNER_OS}-node${NODE_VERSION}-pnpm11.7.0-${DSH_SHA}-${LOCK_SHA}-${TREE_SHA}"
          printf 'key=%s\n' "$KEY" >> "$GITHUB_OUTPUT"

      - name: Install DSH workspace dependencies
        working-directory: dsh-017
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile

      - name: Restore trusted DSH build cache
        id: dsh-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-017/lib
            dsh-017/packages/*/*/lib
            dsh-017/vendor/*/lib
            dsh-017/apps/*/lib
            dsh-017/apps/web/dist
            dsh-017/native/system/packages/*/lib
            dsh-017/native/system/packages/*/bin
            dsh-017/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}

      - name: Build DSH 0.1.7 Desktop runtime
        if: steps.dsh-build-cache.outputs.cache-hit != 'true'
        working-directory: dsh-017
        run: pnpm run build

      - name: Save trusted DSH build cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dsh-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-017/lib
            dsh-017/packages/*/*/lib
            dsh-017/vendor/*/lib
            dsh-017/apps/*/lib
            dsh-017/apps/web/dist
            dsh-017/native/system/packages/*/lib
            dsh-017/native/system/packages/*/bin
            dsh-017/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}

      - name: Run official Windows Desktop Host authenticated-request contract
        if: matrix.node != '24.21.0'
        working-directory: dsh-017
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-017
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.1.7-rc.2
        run: node --import tsx ../dvr/scripts/dsh017-desktop-host-injection-smoke.mjs

      - name: Run the Windows Desktop Host scenarios
        if: matrix.node == '24.21.0'
        working-directory: dsh-017
        shell: bash
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-017
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.1.7-rc.2
          DVR_SMOKE_TIMING: '1'
          DVR_MULTIPLUGIN_SHARD_COUNT: '2'
          DVR_MULTIPLUGIN_BASE_PORT: '19400'
          DVR_DESKTOP_BASE_PORT: '19410'
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-017-windows-desktop-renderer.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-017-windows-desktop-renderer.png
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP:-/tmp}/dvr-desktop-suite"
          mkdir -p "$out"
          pids=(); names=()
          # Three independent Desktop scenarios: each builds its own home, boots its
          # own Host and uses its own web port, so they run together instead of one
          # after another. Every load order, probe and assertion is unchanged.
          node --import tsx ../dvr/scripts/dsh017-desktop-host-injection-smoke.mjs > "$out/injection.log" 2>&1 &
          pids+=("$!"); names+=("injection")
          node --import tsx ../dvr/scripts/dsh-desktop-renderer-e2e.mjs > "$out/renderer.log" 2>&1 &
          pids+=("$!"); names+=("renderer")
          for index in 0 1; do
            DVR_MULTIPLUGIN_SHARD_INDEX="$index" node --import tsx ../dvr/scripts/dsh017-desktop-multiplugin-smoke.mjs > "$out/multiplugin-$index.log" 2>&1 &
            pids+=("$!"); names+=("multiplugin-$index")
          done
          status=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || { status=1; echo "::error::${names[$i]} failed"; }
          done
          for i in "${!pids[@]}"; do
            echo "::group::${names[$i]}"
            cat "$out/${names[$i]}.log" || true
            echo "::endgroup::"
          done
          exit "$status"

      - name: Upload Windows Desktop renderer diagnostics on failure
        if: matrix.node == '24.21.0' && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-017-windows-desktop-renderer-diagnostics
          path: ${{ runner.temp }}/dsh-017-windows-desktop-renderer.*
          if-no-files-found: ignore
          retention-days: 2

  dsh-017-macos-desktop-renderer:
    needs: impact
    if: needs.impact.outputs.heavy == 'true'
    name: DSH 0.1.7-rc.2 macOS real Desktop renderer
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr

      - name: Checkout immutable DSH 0.1.7-rc.2 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 477b4f420553e8a52c2fbccc464d7561b239c443
          persist-credentials: false
          path: dsh-017

      - name: Install upstream package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Restore cached Node runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/node
          key: node-runtime-${{ runner.os }}-${{ runner.arch }}-24.21.0

      - name: Install Node 24 Desktop runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: dsh-017/pnpm-lock.yaml

      - name: Materialize Vision Router package artifacts
        working-directory: dvr
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm build:check
      - name: Install DSH workspace dependencies
        working-directory: dsh-017
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile

      - name: Restore trusted macOS DSH build cache
        id: dsh-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-017/lib
            dsh-017/packages/*/*/lib
            dsh-017/vendor/*/lib
            dsh-017/apps/*/lib
            dsh-017/apps/web/dist
            dsh-017/native/system/packages/*/lib
            dsh-017/native/system/packages/*/bin
            dsh-017/.dsh-build
          key: dsh-desktop-renderer-v2-${{ runner.os }}-node24.21.0-pnpm11.7.0-477b4f420553e8a52c2fbccc464d7561b239c443-${{ hashFiles('dsh-017/pnpm-lock.yaml') }}

      - name: Build DSH 0.1.7 Desktop runtime
        if: steps.dsh-build-cache.outputs.cache-hit != 'true'
        working-directory: dsh-017
        run: pnpm run build

      - name: Save trusted macOS DSH build cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dsh-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dsh-017/lib
            dsh-017/packages/*/*/lib
            dsh-017/vendor/*/lib
            dsh-017/apps/*/lib
            dsh-017/apps/web/dist
            dsh-017/native/system/packages/*/lib
            dsh-017/native/system/packages/*/bin
            dsh-017/.dsh-build
          key: dsh-desktop-renderer-v2-${{ runner.os }}-node24.21.0-pnpm11.7.0-477b4f420553e8a52c2fbccc464d7561b239c443-${{ hashFiles('dsh-017/pnpm-lock.yaml') }}

      - name: Run real macOS Desktop renderer lifecycle
        working-directory: dsh-017
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-017
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.1.7-rc.2
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/dsh-017-macos-desktop-renderer.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/dsh-017-macos-desktop-renderer.png
        run: node --import tsx ../dvr/scripts/dsh-desktop-renderer-e2e.mjs

      - name: Upload macOS Desktop renderer diagnostics on failure
        if: failure()
