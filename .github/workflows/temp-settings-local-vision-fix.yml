name: temp settings local vision fix

on:
  push:
    branches: [fix/settings-local-vision-ux-perf]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[settings-local-vision-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-local-vision-ux-perf
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          p = Path('lib/client.js')
          s = p.read_text()
          s = rep(s,
              "      groupLocalOllama: '本地视觉（并入自 dsh-vision）',\n      localVisionOff: '未开启',",
              "      groupLocalOllama: '本地视觉 · Ollama / LM Studio',\n      localVisionHeroBadge: '本地 · 免费 · 隐私优先',\n      localVisionHeroHint: '让图片优先在本机识别；默认关闭，不改变现有云端识图链。',\n      localVisionOff: '未开启',",
              'zh copy')
          s = rep(s,
              "      groupLocalOllama: 'Local vision (merged from dsh-vision)',\n      localVisionOff: 'Off',",
              "      groupLocalOllama: 'Local vision · Ollama / LM Studio',\n      localVisionHeroBadge: 'Local · free · privacy-first',\n      localVisionHeroHint: 'Prefer on-device image understanding; off by default and does not change the existing cloud vision chain.',\n      localVisionOff: 'Off',",
              'en copy')
          s = rep(s,
              "      '.vr-group-summary{flex:1;min-width:0;font-size:11px;color:var(--dsw-alias-label-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}' +\n      '.vr-local-body{display:flex;flex-direction:column;gap:8px}' +",
              "      '.vr-group-summary{flex:1;min-width:0;font-size:11px;color:var(--dsw-alias-label-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}' +\n      '.vr-local-group{content-visibility:auto;contain-intrinsic-size:auto 96px;margin:8px 0 4px;padding:12px 13px;border:1px solid var(--dsw-alias-brand-primary);border-radius:12px;background:color-mix(in srgb,var(--dsw-alias-brand-primary) 7%,var(--dsw-alias-bg-layer-2));gap:7px}' +\n      '.vr-local-group .vr-group-head{align-items:center;gap:10px}' +\n      '.vr-local-headcopy{display:flex;flex-direction:column;gap:2px;min-width:0;flex:none}' +\n      '.vr-local-title{font-size:13px;font-weight:700;color:var(--dsw-alias-label-primary)}' +\n      '.vr-local-badge{font-size:10px;font-weight:600;color:var(--dsw-alias-brand-primary);letter-spacing:.01em}' +\n      '.vr-local-entry-hint{margin:0;color:var(--dsw-alias-label-secondary);font-size:11px;line-height:1.55}' +\n      '.vr-local-body{display:flex;flex-direction:column;gap:8px;padding-top:4px}' +",
              'hero css')
          s = rep(s,
              "      const catalogReady = catalog.status === 'ready' && catalog.groups.length > 0\n      const visionGroups = filterVisionBackendGroups(catalog.groups, visionCaps.capabilities)\n      const hiddenVisionBackends = useMemo(",
              "      const catalogReady = catalog.status === 'ready' && catalog.groups.length > 0\n      // Keep this derived catalog stable: rebuilding it on every card render\n      // invalidates the option memo and regresses large-catalog scroll smoothness.\n      const visionGroups = useMemo(\n        () => filterVisionBackendGroups(catalog.groups, visionCaps.capabilities),\n        [catalog.groups, visionCaps.capabilities],\n      )\n      const hiddenVisionBackends = useMemo(",
              'visionGroups memo')
          s = rep(s,
              "      const wrapGroupOptions = useMemo(\n        () => {\n          const chainValue = readValue(snapshot, 'chainRoute')\n          const wrapperValue = readValue(snapshot, 'wrapperRoute')",
              "      const chainRouteValue = readValue(snapshot, 'chainRoute')\n      const wrapperRouteValue = readValue(snapshot, 'wrapperRoute')\n      const wrapGroupOptions = useMemo(\n        () => {\n          const chainValue = chainRouteValue\n          const wrapperValue = wrapperRouteValue",
              'wrap values')
          s = rep(s,
              "        [catalog.groups, snapshot],\n      )\n      if (renderError !== undefined) {",
              "        [catalog.groups, chainRouteValue, wrapperRouteValue],\n      )\n      if (renderError !== undefined) {",
              'wrap deps')
          s = rep(s,
              "              // #98 local vision, adapted to #139 Settings UX v2: one collapsed\n              // group on the main surface; existing main controls remain in place.\n              h('div', { className: 'vr-group' },\n                h('button', {\n                  type: 'button', className: 'vr-group-head', 'aria-expanded': showLocalVision,\n                  'aria-controls': 'vr-local-vision-body',\n                  onClick: () => setShowLocalVision(!showLocalVision),\n                },\n                  h('span', { className: 'vr-group-title' }, t('groupLocalOllama')),\n                  h('span', { className: 'vr-group-summary', title: localVisionSummary() }, localVisionSummary()),\n                  h('span', { className: 'vr-chevron' + (showLocalVision ? ' vr-chevron-open' : '') }, '▾'),\n                ),\n                showLocalVision",
              "              // Local vision is a primary capability. Keep the heavy editors\n              // collapsed by default, but make the entry obvious at a glance.\n              h('div', { className: 'vr-local-group' },\n                h('button', {\n                  type: 'button', className: 'vr-group-head', 'aria-expanded': showLocalVision,\n                  'aria-controls': 'vr-local-vision-body',\n                  onClick: () => setShowLocalVision(!showLocalVision),\n                },\n                  h('span', { className: 'vr-local-headcopy' },\n                    h('span', { className: 'vr-group-title vr-local-title' }, t('groupLocalOllama')),\n                    h('span', { className: 'vr-local-badge' }, t('localVisionHeroBadge')),\n                  ),\n                  h('span', { className: 'vr-group-summary', title: localVisionSummary() }, localVisionSummary()),\n                  h('span', { className: 'vr-chevron' + (showLocalVision ? ' vr-chevron-open' : '') }, '▾'),\n                ),\n                h('p', { className: 'vr-local-entry-hint' }, t('localVisionHeroHint')),\n                showLocalVision",
              'hero render')
          p.write_text(s)

          p = Path('tests/client.test.js')
          t = p.read_text()
          t = rep(t,
              "  // Option vnode lists are memoized and the per-provider model lists cached,\n  // so re-renders no longer rebuild hundreds of option elements. The local\n  // vision merge keeps main's cache shape (Map) and does not memo visionGroups.\n  assert.equal(source.includes('const groupOptions = useMemo('), true)\n  assert.equal(source.includes('const visionGroupOptions = useMemo('), true)\n  assert.equal(source.includes('const wrapGroupOptions = useMemo('), true)\n  assert.equal(source.includes('const visionGroups = filterVisionBackendGroups('), true)",
              "  // Option vnode lists and expensive catalog derivations are memoized.\n  // visionGroups itself must stay stable: an always-new array defeats\n  // visionGroupOptions' memo and brings back large-catalog scroll stutter.\n  assert.equal(source.includes('const groupOptions = useMemo('), true)\n  assert.equal(source.includes('const visionGroupOptions = useMemo('), true)\n  assert.equal(source.includes('const wrapGroupOptions = useMemo('), true)\n  assert.equal(source.includes('const visionGroups = useMemo('), true)\n  assert.equal(source.includes('() => filterVisionBackendGroups(catalog.groups, visionCaps.capabilities)'), true)\n  assert.equal(source.includes('[catalog.groups, visionCaps.capabilities]'), true)\n  assert.equal(source.includes('[catalog.groups, chainRouteValue, wrapperRouteValue]'), true)\n  assert.equal(source.includes(\"const visionGroups = filterVisionBackendGroups(\"), false)",
              'perf guard')
          t = rep(t,
              "  assert.equal(source.includes(\"'aria-controls': 'vr-local-vision-body'\"), true)\n  assert.equal(source.includes(\"id: 'vr-local-vision-body'\"), true)",
              "  assert.equal(source.includes(\"'aria-controls': 'vr-local-vision-body'\"), true)\n  assert.equal(source.includes(\"id: 'vr-local-vision-body'\"), true)\n  assert.equal(source.includes(\"groupLocalOllama: '本地视觉 · Ollama / LM Studio'\"), true)\n  assert.equal(source.includes(\"localVisionHeroBadge: '本地 · 免费 · 隐私优先'\"), true)\n  assert.equal(source.includes(\"groupLocalOllama: 'Local vision · Ollama / LM Studio'\"), true)\n  assert.equal(source.includes(\"className: 'vr-local-group'\"), true)\n  assert.equal(source.includes(\"className: 'vr-local-badge'\"), true)\n  assert.equal(source.includes(\"className: 'vr-local-entry-hint'\"), true)",
              'ux guards')
          p.write_text(t)
          PY
      - run: pnpm test
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/temp-settings-local-vision-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js tests/client.test.js .github/workflows/temp-settings-local-vision-fix.yml
          git commit -m "fix: make local vision visible and restore settings performance [settings-local-vision-fix-applied]"
          git push origin HEAD:fix/settings-local-vision-ux-perf
