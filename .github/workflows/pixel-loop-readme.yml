name: Bootstrap Pixel Loop README

on:
  push:
    branches:
      - docs/pixel-loop-showcase

permissions:
  contents: write

jobs:
  patch-readmes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/pixel-loop-showcase
          fetch-depth: 0

      - name: Add Pixel Loop showcase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          edits = {
              "README.md": {
                  "old": "- **A verifiable pixel loop.** Reference → `vision_html_screenshot` → `vision_pixel_diff` (ratio + red heatmap + worst-region ranking) → fix → repeat until the diff reaches zero. UI restoration becomes measurable instead of eyeballed.",
                  "new": "- **A verifiable pixel loop.** Reference → `vision_html_screenshot` → `vision_pixel_diff` (ratio + red heatmap + worst-region ranking) → fix → repeat until the mismatch converges. UI restoration becomes measurable instead of eyeballed.",
                  "anchor": "\n## How it works\n",
                  "block": '''\n### Pixel loop in practice\n\n<p align="center">\n  <img src="assets/pixel-loop.png" width="100%" alt="Reference design and final agent rebuild, verified with vision_pixel_diff at 2.54% final difference." />\n</p>\n\nThe agent rebuilt the UI from the reference image, then verified the final result with `vision_pixel_diff`: **2.54% final diff** (32,939 / 1,296,000 differing pixels, threshold 16/channel).\n''',
              },
              "README.zh.md": {
                  "old": "- **可验证的像素闭环。** 参照图 → `vision_html_screenshot` → `vision_pixel_diff`（差异率 + 红色热力图 + 最差区域排行）→ 修复 → 再对比，直到差异归零。UI 还原从“目测”变成“实测”。",
                  "new": "- **可验证的像素闭环。** 参照图 → `vision_html_screenshot` → `vision_pixel_diff`（差异率 + 红色热力图 + 最差区域排行）→ 修复 → 再对比，直到差异收敛。UI 还原从“目测”变成“实测”。",
                  "anchor": "\n## 工作原理\n",
                  "block": '''\n### 像素闭环实测\n\n<p align="center">\n  <img src="assets/pixel-loop-zh.png" width="100%" alt="参考设计与 Agent 最终复刻，通过 vision_pixel_diff 实测最终差异为 2.54%。" />\n</p>\n\nAgent 仅根据参考图复刻 UI，再用 `vision_pixel_diff` 验证最终结果：**最终差异 2.54%**（32,939 / 1,296,000 个差异像素，threshold 16/channel）。\n''',
              },
          }

          for filename, spec in edits.items():
              p = Path(filename)
              text = p.read_text(encoding="utf-8")
              if spec["old"] in text:
                  text = text.replace(spec["old"], spec["new"], 1)
              if spec["block"].strip() not in text:
                  if spec["anchor"] not in text:
                      raise SystemExit(f"anchor not found in {filename}")
                  text = text.replace(spec["anchor"], spec["block"] + spec["anchor"], 1)
              p.write_text(text, encoding="utf-8")
          PY

      - name: Commit clean README update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pixel-loop-readme.yml
          git add README.md README.zh.md
          git commit -m "docs: add verified pixel-loop showcase"
          git push origin HEAD:docs/pixel-loop-showcase
