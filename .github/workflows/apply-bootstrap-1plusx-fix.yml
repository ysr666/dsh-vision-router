name: Apply bootstrap 1+x correction

on:
  push:
    branches:
      - feat/structured-vision-bootstrap
    paths:
      - scripts/fix-bootstrap-1plusx.py
      - .github/workflows/apply-bootstrap-1plusx-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/structured-vision-bootstrap
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply correction
        run: python3 scripts/fix-bootstrap-1plusx.py
      - name: Check syntax
        run: |
          node --check index.js
          node --check lib/structured-bootstrap.js
          node --check lib/client.js
      - name: Run focused tests
        run: node --test tests/structured-bootstrap.test.js tests/structured-bootstrap-gate.test.js
      - name: Remove one-shot helpers
        run: rm scripts/fix-bootstrap-1plusx.py .github/workflows/apply-bootstrap-1plusx-fix.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js lib/client.js lib/structured-bootstrap.js tests/structured-bootstrap.test.js tests/structured-bootstrap-gate.test.js scripts/fix-bootstrap-1plusx.py .github/workflows/apply-bootstrap-1plusx-fix.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "fix: require structured pass plus follow-up evidence call"
            git push origin HEAD:feat/structured-vision-bootstrap
          fi
