name: Apply sticky settings save bar

on:
  push:
    branches: [feat/structured-vision-bootstrap]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply UI patch
        run: python3 scripts/apply-sticky-settings-savebar.py
      - name: Remove one-shot helpers
        run: git rm .github/workflows/apply-sticky-settings-savebar.yml scripts/apply-sticky-settings-savebar.py
      - name: Check patch formatting
        run: git diff --check
      - name: Run focused tests
        run: node --test tests/client.test.js tests/structured-bootstrap.test.js
      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js
          git commit -m "fix: keep settings save actions visible"
          git push origin HEAD:${GITHUB_REF_NAME}
