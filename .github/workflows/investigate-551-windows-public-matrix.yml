name: Investigate 551 Windows public-plugin matrix

on:
  push:
    branches:
      - investigate/551-windows-public-matrix

permissions:
  contents: read

jobs:
  rc2-windows-node24:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Vision Router investigation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr

      - name: Checkout exact DSH 0.1.7-rc.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 477b4f420553e8a52c2fbccc464d7561b239c443
          persist-credentials: false
          path: dsh-017

      - name: Install pnpm 11.7.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Install Node 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: dsh-017/pnpm-lock.yaml

      - name: Install exact DSH workspace
        working-directory: dsh-017
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile

      - name: Build exact DSH workspace
        working-directory: dsh-017
        run: pnpm run build

      - name: Run report-time public plugin matrix
        working-directory: dsh-017
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}\dsh-017
          DSH_EXPECTED_COMMIT: 477b4f420553e8a52c2fbccc464d7561b239c443
          DVR551_REPORT_PATH: ${{ runner.temp }}\dvr551-windows-matrix.json
        run: node ../dvr/scripts/dsh017-windows-public-plugin-matrix.mjs

      - name: Upload matrix report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dvr551-windows-public-matrix
          path: ${{ runner.temp }}\dvr551-windows-matrix.json
          if-no-files-found: warn
          retention-days: 2
