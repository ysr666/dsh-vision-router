name: Refine provider diagnostic fix

on:
  push:
    branches:
      - fix/vision-provider-empty-dropdown

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-provider-empty-dropdown
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply refinement
        run: node scripts/refine-provider-diagnostic-fix.mjs
      - name: Run client tests
        run: node --test tests/client.test.js
      - name: Commit refined files
        run: |
          if git diff --quiet -- lib/client.js tests/client.test.js; then
            echo "No refinement changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js tests/client.test.js
          git commit -m "fix: ignore generated vision wrappers in diagnostics"
          git push origin HEAD:fix/vision-provider-empty-dropdown
