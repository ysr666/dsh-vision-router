name: P2 package format cleanup

on:
  push:
    branches:
      - fix/p2-depth-settings-contract

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/p2-depth-settings-contract
          fetch-depth: 0
      - name: Restore package formatting without semantic changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'package.json'
          let source = fs.readFileSync(file, 'utf8')
          const before = JSON.stringify(JSON.parse(source))
          function replaceOnce(search, replacement, label) {
            const first = source.indexOf(search)
            if (first === -1) throw new Error(`${label}: pattern not found`)
            if (source.indexOf(search, first + search.length) !== -1) throw new Error(`${label}: pattern duplicated`)
            source = source.slice(0, first) + replacement + source.slice(first + search.length)
          }
          replaceOnce(
            `  "peerDependenciesMeta": {\n    "@deepseek-ai/dsh-anonymous-user-id": {\n      "optional": true\n    },\n    "@deepseek-ai/dsh-llm-deepseek": {\n      "optional": true\n    },\n    "sharp": {\n      "optional": true\n    }\n  },`,
            `  "peerDependenciesMeta": {\n    "@deepseek-ai/dsh-anonymous-user-id": { "optional": true },\n    "@deepseek-ai/dsh-llm-deepseek": { "optional": true },\n    "sharp": { "optional": true }\n  },`,
            'peer dependency metadata formatting',
          )
          replaceOnce(
            `  "pnpm": {\n    "onlyBuiltDependencies": [\n      "sharp"\n    ]\n  },`,
            `  "pnpm": {\n    "onlyBuiltDependencies": ["sharp"]\n  },`,
            'pnpm formatting',
          )
          replaceOnce(
            `    },\n    "bundle": {\n      "patch": "./cordis.patch.yml"\n    }\n  }\n}`,
            `    },\n    "bundle": { "patch": "./cordis.patch.yml" }\n  }\n}`,
            'bundle formatting',
          )
          const parsed = JSON.parse(source)
          if (JSON.stringify(parsed) !== before) throw new Error('package formatting cleanup changed JSON semantics')
          if (!parsed.scripts.test.includes('tests/alpha1-browser-lifecycle-integration.test.js')) throw new Error('full test lifecycle gate missing')
          if (!parsed.scripts['test:web'].includes('tests/alpha1-browser-lifecycle-integration.test.js')) throw new Error('web lifecycle gate missing')
          fs.writeFileSync(file, source)
          NODE
      - name: Commit formatting cleanup
        run: |
          rm -f .github/workflows/p2-package-format-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: keep package diff minimal"
          git push origin HEAD:fix/p2-depth-settings-contract
