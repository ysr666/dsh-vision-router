name: Alpha browser cold toggle smoke

on:
  pull_request:
    paths:
      - 'lib/client-presentation-boundary-main.js'
      - 'lib/client-presentation-boundary.js'
      - 'lib/client.js'
      - 'scripts/alpha-browser-cold-toggle-smoke.mjs'
      - '.github/workflows/alpha-browser-cold-toggle-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'lib/client-presentation-boundary-main.js'
      - 'lib/client-presentation-boundary.js'
      - 'lib/client.js'
      - 'scripts/alpha-browser-cold-toggle-smoke.mjs'
      - '.github/workflows/alpha-browser-cold-toggle-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  alpha-browser-cold-toggle:
    name: alpha.4 real Host + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr

      - name: Checkout pre-#388 Vision Router baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ysr666/dsh-vision-router
          ref: c7c92d25f7c5ced65871db4cb40b00b5d5493ce9
          persist-credentials: false
          path: dvr-before-388

      - name: Checkout exact DSH alpha.4 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 4e84901e6471b79ec0338099867ebb4606d12bb5
          persist-credentials: false
          path: dsh-alpha

      - name: Install alpha package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Install Node 22 browser runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: dsh-alpha/pnpm-lock.yaml

      - name: Compute exact DSH web build cache key
        id: dsh-build-key
        working-directory: dsh-alpha
        shell: bash
        run: |
          set -euo pipefail
          DSH_SHA="$(git rev-parse HEAD)"
          LOCK_SHA="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          TREE_SHA="$(git ls-tree -r --full-tree HEAD | sha256sum | awk '{print $1}')"
          [[ "$DSH_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid DSH source SHA"; exit 1; }
          [[ "$LOCK_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid DSH lock hash"; exit 1; }
          [[ "$TREE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid DSH build-input hash"; exit 1; }
          KEY="dsh-web-v1-${RUNNER_OS}-node22-pnpm11.7.0-${DSH_SHA}-${LOCK_SHA}-${TREE_SHA}"
          printf 'key=%s\n' "$KEY" >> "$GITHUB_OUTPUT"
          printf 'Exact DSH build cache key: %s\n' "$KEY"

      - name: Install exact alpha workspace dependencies
        working-directory: dsh-alpha
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile

      - name: Restore trusted DSH web build cache
        id: dsh-build-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            dsh-alpha/lib
            dsh-alpha/packages/*/*/lib
            dsh-alpha/apps/web/dist
            dsh-alpha/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}

      - name: Build exact alpha web runtime
        if: steps.dsh-build-cache.outputs.cache-hit != 'true'
        working-directory: dsh-alpha
        run: pnpm run build

      - name: Save trusted DSH web build cache from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dsh-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            dsh-alpha/lib
            dsh-alpha/packages/*/*/lib
            dsh-alpha/apps/web/dist
            dsh-alpha/.dsh-build
          key: ${{ steps.dsh-build-key.outputs.key }}

      - name: Install Chromium for DSH Playwright
        working-directory: dsh-alpha
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Run cold Vision toggle against real Host and Chromium
        id: smoke
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr
          DSH_EXPECTED_VERSION: 0.1.2-alpha.4
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/alpha-browser-smoke-diagnostic.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/alpha-browser-smoke-page.png
        run: node ../dvr/scripts/alpha-browser-cold-toggle-smoke.mjs

      - name: Reproduce #387 with the real pre-fix plugin
        id: sensitivity
        if: steps.smoke.outputs.status == 'pass'
        working-directory: dsh-alpha
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-alpha
          DVR_SOURCE_ROOT: ${{ github.workspace }}/dvr-before-388
          DSH_EXPECTED_VERSION: 0.1.2-alpha.4
          SMOKE_DIAGNOSTIC_PATH: ${{ runner.temp }}/alpha-browser-baseline-diagnostic.json
          SMOKE_SCREENSHOT_PATH: ${{ runner.temp }}/alpha-browser-baseline-page.png
        run: node ../dvr/scripts/alpha-browser-cold-toggle-smoke.mjs

      - name: Verify #387 sensitivity baseline
        if: steps.smoke.outputs.status == 'pass'
        env:
          BASELINE_STATUS: ${{ steps.sensitivity.outputs.status }}
          BASELINE_STAGE: ${{ steps.sensitivity.outputs.stage }}
          BASELINE_KIND: ${{ steps.sensitivity.outputs.kind }}
          BASELINE_DETAIL: ${{ steps.sensitivity.outputs.detail }}
        run: |
          printf 'historical status=%s stage=%s kind=%s\n' "$BASELINE_STATUS" "$BASELINE_STAGE" "$BASELINE_KIND"
          if [[ "$BASELINE_STATUS" != 'fail' || "$BASELINE_KIND" != 'product-injection-regression' ]]; then
            printf 'Historical c7c92d25 baseline did not reproduce #387 exactly.\n%s\n' "$BASELINE_DETAIL"
            exit 1
          fi
          echo 'Historical c7c92d25 baseline reproduced #387 as product-injection-regression.'

      - name: Smoke failure detail
        if: steps.smoke.outputs.status == 'fail'
        env:
          SMOKE_STAGE: ${{ steps.smoke.outputs.stage }}
          SMOKE_KIND: ${{ steps.smoke.outputs.kind }}
          SMOKE_DETAIL: ${{ steps.smoke.outputs.detail }}
        run: |
          printf 'stage=%s\nkind=%s\n%s\n' "$SMOKE_STAGE" "$SMOKE_KIND" "$SMOKE_DETAIL"
          escaped="${SMOKE_DETAIL//'%'/'%25'}"
          escaped="${escaped//$'\r'/'%0D'}"
          escaped="${escaped//$'\n'/'%0A'}"
          printf '::error title=Alpha browser smoke failed (%s)::%s\n' "$SMOKE_STAGE" "$escaped"
          {
            printf '### Alpha browser smoke failure\n\n'
            printf -- '- stage: `%s`\n' "$SMOKE_STAGE"
            printf -- '- kind: `%s`\n\n' "$SMOKE_KIND"
            printf '```text\n%s\n```\n' "$SMOKE_DETAIL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke diagnostic
        if: steps.smoke.outputs.status == 'fail'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alpha-browser-smoke-diagnostic
          path: ${{ runner.temp }}/alpha-browser-smoke-*
          if-no-files-found: error
          retention-days: 1

      - name: Classified product regression — remote.session injection
        if: steps.smoke.outputs.kind == 'product-injection-regression'
        run: echo 'Cold toggle reproduced the remote.session injection regression.'

      - name: Classified browser regression — pageerror
        if: steps.smoke.outputs.kind == 'browser-pageerror'
        run: echo 'Cold toggle produced a browser pageerror.'

      - name: Chromium executable missing
        if: steps.smoke.outputs.kind == 'browser-executable-missing'
        run: echo 'Playwright resolved Chromium, but its expected executable is absent.'

      - name: Chromium missing shared library
        if: steps.smoke.outputs.kind == 'browser-missing-library'
        run: echo 'Chromium executable exists but a Linux shared library is missing.'

      - name: Chromium sandbox failure
        if: steps.smoke.outputs.kind == 'browser-sandbox'
        run: echo 'Chromium failed in its Linux sandbox layer.'

      - name: Chromium process crashed during launch
        if: steps.smoke.outputs.kind == 'browser-process-crash'
        run: echo 'Chromium executable exists but the browser process closed or crashed during launch.'

      - name: Other Chromium launch failure
        if: steps.smoke.outputs.kind == 'browser-launch-other'
        run: echo 'Chromium failed to launch for an unclassified reason.'

      - name: Classified harness stage — resolve Playwright
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'resolve-playwright'
        run: echo 'Smoke failed while resolving Playwright.'

      - name: Classified harness stage — install plugin
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'plugin-install'
        run: echo 'Smoke failed while installing the current DVR checkout.'

      - name: Classified harness stage — start Host
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'host-start'
        run: echo 'Smoke failed while starting the real DSH Host.'

      - name: Classified harness stage — launch browser
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'browser-launch'
        run: echo 'Smoke failed while launching Chromium.'

      - name: Classified harness stage — open page
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'open-page'
        run: echo 'Smoke failed while opening the real DSH Web page.'

      - name: Classified harness stage — first-run overlays
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'first-run-overlays'
        run: echo 'Smoke failed while dismissing the real first-run browser overlays.'

      - name: Classified harness stage — create session intent
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'new-session'
        run: echo 'Smoke failed while creating a fresh Session Intent.'

      - name: Classified harness stage — choose workspace
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'workspace-picker'
        run: echo 'Smoke failed while adopting a real Workspace through the alpha.4 directory flow.'

      - name: Classified harness stage — workspace adoption
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'workspace-adopt'
        run: echo 'Smoke failed after the Workspace picker closed but before the session-scoped composer became available.'

      - name: Classified harness stage — initial session scope
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'session-scope'
        run: echo 'Smoke failed before the first session-scoped Vision toggle became visible.'

      - name: Classified harness stage — cold reload
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'cold-reload'
        run: echo 'Smoke failed while hard-refreshing the browser before the required cold-session retest.'

      - name: Classified harness stage — cold first-run overlays
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'cold-overlays'
        run: echo 'Smoke failed while restoring the refreshed browser to an interactive state.'

      - name: Classified harness stage — refreshed Session Intent
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'cold-session-intent'
        run: echo 'Smoke failed while creating a new Session Intent after the hard refresh.'

      - name: Classified harness stage — refreshed Workspace selection
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'cold-workspace'
        run: echo 'Smoke failed while binding the refreshed Session Intent to the persisted real Workspace.'

      - name: Classified harness stage — cold toggle
        if: steps.smoke.outputs.status == 'fail' && steps.smoke.outputs.stage == 'cold-toggle'
        run: echo 'Smoke failed waiting for the Vision toggle after a cold reload.'

      - name: Cold Vision toggle smoke passed
        if: >-
          steps.smoke.outputs.status == 'pass' &&
          steps.sensitivity.outputs.status == 'fail' &&
          steps.sensitivity.outputs.kind == 'product-injection-regression'
        run: |
          echo 'Real DSH Host + Chromium cold Vision toggle smoke passed and the pre-fix baseline reproduced #387.'

      - name: Fail classified smoke
        if: steps.smoke.outputs.status == 'fail'
        run: exit 1
