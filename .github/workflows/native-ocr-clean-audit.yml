name: Native OCR clean candidate audit
on:
  pull_request:
    paths:
      - 'quality/native-ocr-clean-conversion.py'
      - 'quality/native-ocr-release-stage.mjs'
      - 'quality/native-ocr-canonical-labels.py'
      - 'quality/test-native-ocr-canonical-labels.py'
      - 'quality/native-ocr-staged-acceptance.mjs'
      - 'quality/native-ocr-desktop-acceptance.mjs'
      - 'quality/native-ocr-desktop-tool-evidence.mjs'
      - 'quality/test-native-ocr-desktop-acceptance.mjs'
      - 'scripts/dsh-desktop-renderer-e2e.mjs'
      - '.github/actions/native-ocr-desktop-acceptance/action.yml'
      - 'quality/native-ocr-delivery-preflight.py'
      - 'quality/test-native-ocr-delivery-preflight.py'
      - 'quality/test-native-ocr-staged-acceptance.mjs'
      - 'quality/test-native-ocr-release-stage.mjs'
      - 'quality/native-ocr-windows-reproduce-crt.py'
      - 'quality/native-ocr-final-link-audit.py'
      - 'quality/test-native-ocr-final-link-audit.py'
      - 'quality/test-native-ocr-clean-download.py'
      - 'quality/native-ocr-crt-reconstruct-LAB.py'
      - 'quality/native-ocr-crt-cross-relink-LAB.py'
      - 'quality/native-ocr-crt-relink-LAB.py'
      - 'quality/native-ocr-crt-ci-reconstruction-evidence.json'
      - 'quality/test-native-ocr-crt-reconstruction.py'
      - 'quality/native-ocr-mingw-source-evidence.json'
      - 'quality/native-ocr-candidate-*.py'
      - 'quality/native-ocr-candidate-models.json'
      - 'quality/native-ocr-candidate-*.ps1'
      - 'quality/native-ocr-*-build-LAB.*'
      - '.github/workflows/native-ocr-clean-audit.yml'
      - 'quality/native-ocr-provenance-LAB.json'
      - '.gitattributes'
      - 'scripts/package-native-ocr.mjs'
      - 'scripts/install-native-ocr.mjs'
      - 'src/lib/native-ocr-bundle-metadata.js'
permissions:
  contents: read
concurrency:
  group: native-ocr-clean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  conversion:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preflight Desktop scripts without native build or network
        shell: pwsh
        run: |
          node --check scripts/dsh-desktop-renderer-e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DESKTOP_SYNTAX_INVALID' }
          node --check quality/native-ocr-desktop-acceptance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DESKTOP_FIXTURE_SYNTAX_INVALID' }
          node --test quality/test-native-ocr-desktop-acceptance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DESKTOP_EVIDENCE_TEST_FAILED' }
      - name: Verify bounded native input downloads
        run: python -I quality/test-native-ocr-clean-download.py
      - name: Reacquire and match all five native model assets
        shell: pwsh
        run: python -I quality/native-ocr-clean-conversion.py --work-dir "$env:RUNNER_TEMP/dvr-ocr-conversion"
      - name: Test and emit canonical model labels only
        shell: pwsh
        run: |
          python -I quality/test-native-ocr-canonical-labels.py
          if ($LASTEXITCODE -ne 0) { throw 'LABEL_TEST_FAILED' }
          python -I quality/native-ocr-canonical-labels.py --mode emit --models "$env:RUNNER_TEMP/dvr-ocr-conversion/models" --recipe "$env:RUNNER_TEMP/canonical-labels.json"
          if ($LASTEXITCODE -ne 0) { throw 'LABEL_RECIPE_FAILED' }
      - name: Save canonical label recipe only (no parameters, weights or executables)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-canonical-label-recipe
          path: ${{ runner.temp }}/canonical-labels.json
          if-no-files-found: error
      - name: Save evidence only (no model files or executables)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-clean-conversion-evidence
          path: ${{ runner.temp }}/dvr-ocr-conversion/conversion-evidence.json
          if-no-files-found: error
  mac-worker:
    needs: conversion
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify bounded native input downloads
        run: python3 -I quality/test-native-ocr-clean-download.py
      - name: Test isolated staging gates
        run: node --test quality/test-native-ocr-release-stage.mjs
      - name: Acquire canonical label recipe only
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-ocr-canonical-label-recipe
          path: ${{ runner.temp }}/recipe
      - name: Build from pinned ncnn source on clean Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dvr-native-worker"
          mkdir -p "$root"
          git init "$root/ncnn"
          git -C "$root/ncnn" fetch --depth 1 https://github.com/Tencent/ncnn.git d1f6ac67e9fc91390cc70f7168573fd2626f1d66
          git -C "$root/ncnn" checkout --detach FETCH_HEAD
          git -C "$root/ncnn" submodule update --init --recursive
          export DVR_OCR_NCNN_SOURCE="$root/ncnn"
          # New candidate target; the old lab worker requires macOS 27.
          export MACOSX_DEPLOYMENT_TARGET=13.0
          /usr/bin/clang++ --version
          xcrun --show-sdk-version
          cmake --version
          ninja --version
          DVR_OCR_MAC_BUILD_ROOT="$root/build-a" bash quality/native-ocr-macos-build-LAB.sh
          DVR_OCR_MAC_BUILD_ROOT="$root/build-b" bash quality/native-ocr-macos-build-LAB.sh
          cmp "$root/build-a/worker" "$root/build-b/worker"
          otool -l "$root/build-a/worker" | grep -A6 LC_BUILD_VERSION
          otool -l "$root/build-a/worker" | awk '/cmd LC_BUILD_VERSION/{seen=1} seen && /minos/{if ($2 != "13.0") exit 1; ok=1; exit} END{if(!ok) exit 1}'
          actual="$(shasum -a 256 "$root/build-a/worker" | cut -d' ' -f1)"
          echo "REPRODUCIBLE_MAC_CANDIDATE_SHA256=$actual; not admitted or published"
          node quality/native-ocr-release-stage.mjs --verify-worker --target darwin-arm64 --binary "$root/build-a/worker"
          # Independently obtain the exact model identities without moving
          # binaries/weights between jobs or uploading them to artifacts.
          python3 -I quality/native-ocr-clean-conversion.py --work-dir "$root/conversion"
          python3 -I quality/native-ocr-candidate-fixture.py --output "$root/synthetic.bmp"
          python3 -I quality/native-ocr-canonical-labels.py --mode rebuild --models "$root/conversion/models" --recipe "$RUNNER_TEMP/recipe/canonical-labels.json" --out "$root/canonical"
          node quality/native-ocr-release-stage.mjs --verify-models --models "$root/canonical"
          python3 -I quality/native-ocr-candidate-smoke.py --worker "$root/build-a/worker" --models "$root/canonical" --bmp "$root/synthetic.bmp" --expected 'TEST 123' --report "$root/smoke-evidence.json"
          node quality/native-ocr-release-stage.mjs --stage --target darwin-arm64 --binary "$root/build-a/worker" --models "$root/canonical" --out "$root/release-stage"
      - name: Exact Mac archive settings route, installer, OCR and uninstall
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dvr-native-worker"
          node --test quality/test-native-ocr-staged-acceptance.mjs
          node quality/native-ocr-staged-acceptance.mjs --stage "$root/release-stage" --bmp "$root/synthetic.bmp" --expected 'TEST 123' --report "$root/release-stage/acceptance-evidence.json"
          python3 -I quality/native-ocr-delivery-preflight.py --target darwin-arm64 --archive "$root/release-stage/ppocrv6-small-darwin-arm64.tar.gz" --staging-evidence "$root/release-stage/staging-evidence.json" --report "$root/release-stage/archive-audit-evidence.json"
      - name: Save Mac evidence only (no worker, models or images)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-mac-candidate-evidence
          path: |
            ${{ runner.temp }}/dvr-native-worker/smoke-evidence.json
            ${{ runner.temp }}/dvr-native-worker/conversion/conversion-evidence.json
            ${{ runner.temp }}/dvr-native-worker/release-stage/staging-evidence.json
            ${{ runner.temp }}/dvr-native-worker/release-stage/acceptance-evidence.json
            ${{ runner.temp }}/dvr-native-worker/release-stage/archive-audit-evidence.json
          if-no-files-found: error

      - name: Real RC4 Desktop acceptance of this exact Mac archive
        uses: ./.github/actions/native-ocr-desktop-acceptance
        with:
          stage: ${{ runner.temp }}/dvr-native-worker/release-stage
          bmp: ${{ runner.temp }}/dvr-native-worker/synthetic.bmp
          expected: TEST 123

  windows-worker:
    needs: crt-reconstruction
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build with pinned LLVM UCRT and ncnn, no publication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'dvr-native-worker'
          New-Item -ItemType Directory -Path $root | Out-Null
          $ncnn = Join-Path $root 'ncnn'
          git init $ncnn
          git -C $ncnn config core.autocrlf false
          git -C $ncnn fetch --depth 1 https://github.com/Tencent/ncnn.git d1f6ac67e9fc91390cc70f7168573fd2626f1d66
          if ($LASTEXITCODE -ne 0) { throw 'NCNN_FETCH_FAILED' }
          git -C $ncnn checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'NCNN_CHECKOUT_FAILED' }
          git -C $ncnn submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'NCNN_SUBMODULE_FAILED' }
          $zip = Join-Path $root 'llvm-mingw-20261020-ucrt-x86_64.zip'
          curl.exe --fail --location --silent --show-error --max-time 300 --output $zip https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') { throw 'TOOLCHAIN_IDENTITY_FAILED' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $root 'toolchain')
          & ./quality/native-ocr-windows-llvm-build-LAB.ps1 -LabRoot $root -RepoRoot (Get-Location).Path -Candidate
          $worker = Join-Path $root 'worker-llvm-header-static.exe'
          $first = (Get-FileHash $worker -Algorithm SHA256).Hash.ToLowerInvariant()
          # Rebuild the complete object tree, not merely relink. Candidate
          # equality is tested without silently admitting a new worker hash.
          Remove-Item -LiteralPath (Join-Path $root 'ncnn-build-windows-llvm') -Force -Recurse
          & ./quality/native-ocr-windows-llvm-build-LAB.ps1 -LabRoot $root -RepoRoot (Get-Location).Path -Candidate
          $second = (Get-FileHash $worker -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($first -ne $second) { throw "NONDETERMINISTIC_WINDOWS_CANDIDATE: $first != $second" }
          Write-Output "REPRODUCIBLE_WINDOWS_CANDIDATE_SHA256=$second; not admitted or published"
          python -I quality/native-ocr-candidate-inventory.py --root $root --report (Join-Path $root 'header-evidence.json')
          if ($LASTEXITCODE -ne 0) { throw 'CANDIDATE_INVENTORY_FAILED' }
          python -I quality/native-ocr-candidate-link-inventory.py --root $root --trace (Join-Path $root 'candidate-link-trace.txt') --worker $worker --map (Join-Path $root 'candidate-link-map.txt') --report (Join-Path $root 'link-inventory.json')
          if ($LASTEXITCODE -ne 0) { throw 'CANDIDATE_LINK_INVENTORY_FAILED' }
          $conversion = Join-Path $root 'conversion'
          python -I quality/native-ocr-clean-conversion.py --work-dir $conversion
          if ($LASTEXITCODE -ne 0) { throw 'CANDIDATE_MODEL_CONVERSION_FAILED' }
          $bmp = Join-Path $root 'synthetic.bmp'
          powershell.exe -NoProfile -File quality/native-ocr-candidate-fixture.ps1 -Output $bmp
          if ($LASTEXITCODE -ne 0) { throw 'SYNTHETIC_FIXTURE_FAILED' }
          python -I quality/native-ocr-candidate-smoke.py --worker $worker --models (Join-Path $conversion 'models') --bmp $bmp --report (Join-Path $root 'smoke-evidence.json')
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_CANDIDATE_SMOKE_FAILED' }
      - name: Acquire source-only compile recipe (no compiled objects)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-ocr-crt-source-recipe
          path: ${{ runner.temp }}/dvr-crt-source-recipe
      - name: Reproduce exact CRT objects and final Windows worker natively
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'dvr-native-worker'
          $source = Join-Path $env:RUNNER_TEMP 'mingw-source.tar.gz'
          curl.exe --fail --location --silent --show-error --retry 2 --max-time 300 --output $source https://codeload.github.com/mingw-w64/mingw-w64/tar.gz/0d6dfbc348dfad714761c0a7151615767f96bcb5
          if ($LASTEXITCODE -ne 0) { throw 'MINGW_SOURCE_FETCH_FAILED' }
          python -I quality/native-ocr-windows-reproduce-crt.py --repo (Get-Location).Path --root $root --source $source --recipe "$env:RUNNER_TEMP/dvr-crt-source-recipe/crt-portable-source-recipe.json" --out "$env:RUNNER_TEMP/dvr-remediated-windows"
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_CRT_REPLAY_FAILED' }
          python -I quality/native-ocr-candidate-smoke.py --worker "$env:RUNNER_TEMP/dvr-remediated-windows/worker.exe" --models (Join-Path $root 'conversion/models') --bmp (Join-Path $root 'synthetic.bmp') --report "$env:RUNNER_TEMP/dvr-remediated-windows/smoke-evidence.json"
          if ($LASTEXITCODE -ne 0) { throw 'REMEDIATED_NATIVE_SMOKE_FAILED' }
          node quality/native-ocr-release-stage.mjs --stage --target win32-x64 --binary "$env:RUNNER_TEMP/dvr-remediated-windows/worker.exe" --models (Join-Path $root 'conversion/models') --out "$env:RUNNER_TEMP/dvr-win-release-stage"
          if ($LASTEXITCODE -ne 0) { throw 'REMEDIATED_STAGE_FAILED' }
      - name: Exact Windows archive settings route, installer, OCR and uninstall
        shell: pwsh
        run: |
          node --test quality/test-native-ocr-staged-acceptance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'STAGED_ACCEPTANCE_TEST_FAILED' }
          node quality/native-ocr-staged-acceptance.mjs --stage "$env:RUNNER_TEMP/dvr-win-release-stage" --bmp "$env:RUNNER_TEMP/dvr-native-worker/synthetic.bmp" --expected 'HELLO 123' --report "$env:RUNNER_TEMP/dvr-win-release-stage/acceptance-evidence.json"
          if ($LASTEXITCODE -ne 0) { throw 'STAGED_ACCEPTANCE_FAILED' }
          python -I quality/native-ocr-delivery-preflight.py --target win32-x64 --archive "$env:RUNNER_TEMP/dvr-win-release-stage/ppocrv6-small-win32-x64.tar.gz" --staging-evidence "$env:RUNNER_TEMP/dvr-win-release-stage/staging-evidence.json" --report "$env:RUNNER_TEMP/dvr-win-release-stage/archive-audit-evidence.json"
          if ($LASTEXITCODE -ne 0) { throw 'STAGED_ARCHIVE_AUDIT_FAILED' }
      - name: Inspect exact final PE selected members and named OS imports
        shell: pwsh
        run: |
          python -I quality/test-native-ocr-final-link-audit.py
          if ($LASTEXITCODE -ne 0) { throw 'FINAL_LINK_AUDIT_TEST_FAILED' }
          python -I quality/native-ocr-final-link-audit.py --repo (Get-Location).Path --root "$env:RUNNER_TEMP/dvr-remediated-windows" --report "$env:RUNNER_TEMP/dvr-remediated-windows/final-link-audit-evidence.json"
          if ($LASTEXITCODE -ne 0) { throw 'FINAL_LINK_AUDIT_FAILED' }
      - name: Save final Windows staging evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-windows-remediated-stage-evidence
          path: |
            ${{ runner.temp }}/dvr-remediated-windows/native-replay-evidence.json
            ${{ runner.temp }}/dvr-remediated-windows/final-link-audit-evidence.json
            ${{ runner.temp }}/dvr-remediated-windows/smoke-evidence.json
            ${{ runner.temp }}/dvr-win-release-stage/staging-evidence.json
            ${{ runner.temp }}/dvr-win-release-stage/acceptance-evidence.json
            ${{ runner.temp }}/dvr-win-release-stage/archive-audit-evidence.json
          if-no-files-found: ignore
      - name: Verify canonical staging models
        shell: pwsh
        run: node quality/native-ocr-release-stage.mjs --verify-models --models "$env:RUNNER_TEMP/dvr-native-worker/conversion/models"
      - name: Save candidate evidence only (no workers, models or photos)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-windows-candidate-evidence
          path: |
            ${{ runner.temp }}/dvr-native-worker/header-evidence.json
            ${{ runner.temp }}/dvr-native-worker/smoke-evidence.json
            ${{ runner.temp }}/dvr-native-worker/candidate-link-map.txt
            ${{ runner.temp }}/dvr-native-worker/candidate-link-trace.txt
            ${{ runner.temp }}/dvr-native-worker/link-inventory.json
          if-no-files-found: error

      - name: Real RC4 Desktop acceptance of this exact Windows archive
        uses: ./.github/actions/native-ocr-desktop-acceptance
        with:
          stage: ${{ runner.temp }}/dvr-win-release-stage
          bmp: ${{ runner.temp }}/dvr-native-worker/synthetic.bmp
          expected: HELLO 123

  crt-reconstruction:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify CRT reconstruction helpers
        run: |
          python3 -I quality/test-native-ocr-crt-reconstruction.py
          python3 -I -m py_compile quality/native-ocr-crt-cross-relink-LAB.py
      - name: Verify exact reconstruction input and delivery preflight helpers
        run: |
          python3 -I quality/test-native-ocr-crt-relink-input.py
          python3 -I quality/test-native-ocr-delivery-preflight.py
      - name: Regenerate historical stock evidence and reconstruct selected CRT objects
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dvr-crt-inputs"
          mkdir -p "$root"
          curl --fail --location --silent --show-error --retry 2 --max-time 300 --output "$root/mingw-source.tar.gz" https://codeload.github.com/mingw-w64/mingw-w64/tar.gz/0d6dfbc348dfad714761c0a7151615767f96bcb5
          curl --fail --location --silent --show-error --retry 2 --max-time 300 --output "$root/llvm-mac.tar.xz" https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-macos-universal.tar.xz
          curl --fail --location --silent --show-error --retry 2 --max-time 300 --output "$root/llvm-win.zip" https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip
          python3 -I quality/native-ocr-crt-reconstruct-LAB.py --repo "$PWD" --source-tar "$root/mingw-source.tar.gz" --compiler-tar "$root/llvm-mac.tar.xz" --stock-windows-zip "$root/llvm-win.zip" --out "$RUNNER_TEMP/dvr-crt-source-reconstruction"
      - name: Save reconstructed CRT evidence only (no object archives or binaries)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-crt-reconstruction-evidence
          path: |
            ${{ runner.temp }}/dvr-crt-source-reconstruction/crt-reconstruction-evidence.json
            ${{ runner.temp }}/dvr-crt-source-reconstruction/stock-crt/stock-crt-normalized-coff.json
          if-no-files-found: error
      - name: Save source-only portable compile recipe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-crt-source-recipe
          path: ${{ runner.temp }}/dvr-crt-source-reconstruction/crt-portable-source-recipe.json
          if-no-files-found: error
      - name: Link exact stock and remediated Windows x64 workers in the same runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -I quality/native-ocr-crt-cross-relink-LAB.py --repo "$PWD" --reconstruction "$RUNNER_TEMP/dvr-crt-source-reconstruction" --stock-windows-zip "$RUNNER_TEMP/dvr-crt-inputs/llvm-win.zip" --out "$RUNNER_TEMP/dvr-crt-cross-worker"
          node quality/native-ocr-release-stage.mjs --verify-worker --target win32-x64 --binary "$RUNNER_TEMP/dvr-crt-cross-worker/worker-llvm-header-static.exe"
      - name: Save cross-relink evidence only (no object archives or executables)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-crt-cross-relink-evidence
          path: ${{ runner.temp }}/dvr-crt-cross-worker/cross-relink-evidence.json
          if-no-files-found: ignore
