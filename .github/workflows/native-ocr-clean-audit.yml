name: Native OCR clean candidate audit
on:
  pull_request:
    paths:
      - 'quality/native-ocr-clean-conversion.py'
      - 'quality/test-native-ocr-clean-download.py'
      - 'quality/native-ocr-crt-reconstruct-LAB.py'
      - 'quality/test-native-ocr-crt-reconstruction.py'
      - 'quality/native-ocr-mingw-source-evidence.json'
      - 'quality/native-ocr-candidate-*.py'
      - 'quality/native-ocr-candidate-models.json'
      - 'quality/native-ocr-candidate-*.ps1'
      - 'quality/native-ocr-*-build-LAB.*'
      - '.github/workflows/native-ocr-clean-audit.yml'
      - 'quality/native-ocr-provenance-LAB.json'
      - '.gitattributes'
      - 'scripts/package-native-ocr.mjs'
      - 'scripts/install-native-ocr.mjs'
      - 'src/lib/native-ocr-bundle-metadata.js'
permissions:
  contents: read
concurrency:
  group: native-ocr-clean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  conversion:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify bounded native input downloads
        run: python -I quality/test-native-ocr-clean-download.py
      - name: Reacquire and match all five native model assets
        shell: pwsh
        run: python -I quality/native-ocr-clean-conversion.py --work-dir "$env:RUNNER_TEMP/dvr-ocr-conversion"
      - name: Save evidence only (no model files or executables)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-clean-conversion-evidence
          path: ${{ runner.temp }}/dvr-ocr-conversion/conversion-evidence.json
          if-no-files-found: error
  mac-worker:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify bounded native input downloads
        run: python3 -I quality/test-native-ocr-clean-download.py
      - name: Build from pinned ncnn source on clean Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dvr-native-worker"
          mkdir -p "$root"
          git init "$root/ncnn"
          git -C "$root/ncnn" fetch --depth 1 https://github.com/Tencent/ncnn.git d1f6ac67e9fc91390cc70f7168573fd2626f1d66
          git -C "$root/ncnn" checkout --detach FETCH_HEAD
          git -C "$root/ncnn" submodule update --init --recursive
          export DVR_OCR_NCNN_SOURCE="$root/ncnn"
          # New candidate target; the old lab worker requires macOS 27.
          export MACOSX_DEPLOYMENT_TARGET=13.0
          /usr/bin/clang++ --version
          xcrun --show-sdk-version
          cmake --version
          ninja --version
          DVR_OCR_MAC_BUILD_ROOT="$root/build-a" bash quality/native-ocr-macos-build-LAB.sh
          DVR_OCR_MAC_BUILD_ROOT="$root/build-b" bash quality/native-ocr-macos-build-LAB.sh
          cmp "$root/build-a/worker" "$root/build-b/worker"
          otool -l "$root/build-a/worker" | grep -A6 LC_BUILD_VERSION
          otool -l "$root/build-a/worker" | awk '/cmd LC_BUILD_VERSION/{seen=1} seen && /minos/{if ($2 != "13.0") exit 1; ok=1; exit} END{if(!ok) exit 1}'
          actual="$(shasum -a 256 "$root/build-a/worker" | cut -d' ' -f1)"
          echo "REPRODUCIBLE_MAC_CANDIDATE_SHA256=$actual; not admitted or published"
          # Independently obtain the exact model identities without moving
          # binaries/weights between jobs or uploading them to artifacts.
          python3 -I quality/native-ocr-clean-conversion.py --work-dir "$root/conversion"
          python3 -I quality/native-ocr-candidate-fixture.py --output "$root/synthetic.bmp"
          python3 -I quality/native-ocr-candidate-smoke.py --worker "$root/build-a/worker" --models "$root/conversion/models" --bmp "$root/synthetic.bmp" --expected 'TEST 123' --model-origin mac-audit-only --report "$root/smoke-evidence.json"
      - name: Save Mac evidence only (no worker, models or images)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-mac-candidate-evidence
          path: |
            ${{ runner.temp }}/dvr-native-worker/smoke-evidence.json
            ${{ runner.temp }}/dvr-native-worker/conversion/conversion-evidence.json
          if-no-files-found: error

  windows-worker:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build with pinned LLVM UCRT and ncnn, no publication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'dvr-native-worker'
          New-Item -ItemType Directory -Path $root | Out-Null
          $ncnn = Join-Path $root 'ncnn'
          git init $ncnn
          git -C $ncnn config core.autocrlf false
          git -C $ncnn fetch --depth 1 https://github.com/Tencent/ncnn.git d1f6ac67e9fc91390cc70f7168573fd2626f1d66
          if ($LASTEXITCODE -ne 0) { throw 'NCNN_FETCH_FAILED' }
          git -C $ncnn checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'NCNN_CHECKOUT_FAILED' }
          git -C $ncnn submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'NCNN_SUBMODULE_FAILED' }
          $zip = Join-Path $root 'llvm-mingw-20261020-ucrt-x86_64.zip'
          curl.exe --fail --location --silent --show-error --max-time 300 --output $zip https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') { throw 'TOOLCHAIN_IDENTITY_FAILED' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $root 'toolchain')
          & ./quality/native-ocr-windows-llvm-build-LAB.ps1 -LabRoot $root -RepoRoot (Get-Location).Path -Candidate
          $worker = Join-Path $root 'worker-llvm-header-static.exe'
          $first = (Get-FileHash $worker -Algorithm SHA256).Hash.ToLowerInvariant()
          # Rebuild the complete object tree, not merely relink. Candidate
          # equality is tested without silently admitting a new worker hash.
          Remove-Item -LiteralPath (Join-Path $root 'ncnn-build-windows-llvm') -Force -Recurse
          & ./quality/native-ocr-windows-llvm-build-LAB.ps1 -LabRoot $root -RepoRoot (Get-Location).Path -Candidate
          $second = (Get-FileHash $worker -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($first -ne $second) { throw "NONDETERMINISTIC_WINDOWS_CANDIDATE: $first != $second" }
          Write-Output "REPRODUCIBLE_WINDOWS_CANDIDATE_SHA256=$second; not admitted or published"
          python -I quality/native-ocr-candidate-inventory.py --root $root --report (Join-Path $root 'header-evidence.json')
          if ($LASTEXITCODE -ne 0) { throw 'CANDIDATE_INVENTORY_FAILED' }
          python -I quality/native-ocr-candidate-link-inventory.py --root $root --trace (Join-Path $root 'candidate-link-trace.txt') --worker $worker --map (Join-Path $root 'candidate-link-map.txt') --report (Join-Path $root 'link-inventory.json')
          if ($LASTEXITCODE -ne 0) { throw 'CANDIDATE_LINK_INVENTORY_FAILED' }
          $conversion = Join-Path $root 'conversion'
          python -I quality/native-ocr-clean-conversion.py --work-dir $conversion
          if ($LASTEXITCODE -ne 0) { throw 'CANDIDATE_MODEL_CONVERSION_FAILED' }
          $bmp = Join-Path $root 'synthetic.bmp'
          powershell.exe -NoProfile -File quality/native-ocr-candidate-fixture.ps1 -Output $bmp
          if ($LASTEXITCODE -ne 0) { throw 'SYNTHETIC_FIXTURE_FAILED' }
          python -I quality/native-ocr-candidate-smoke.py --worker $worker --models (Join-Path $conversion 'models') --bmp $bmp --report (Join-Path $root 'smoke-evidence.json')
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_CANDIDATE_SMOKE_FAILED' }
      - name: Save candidate evidence only (no workers, models or photos)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-windows-candidate-evidence
          path: |
            ${{ runner.temp }}/dvr-native-worker/header-evidence.json
            ${{ runner.temp }}/dvr-native-worker/smoke-evidence.json
            ${{ runner.temp }}/dvr-native-worker/candidate-link-map.txt
            ${{ runner.temp }}/dvr-native-worker/candidate-link-trace.txt
            ${{ runner.temp }}/dvr-native-worker/link-inventory.json
          if-no-files-found: error

  crt-reconstruction:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify CRT reconstruction helpers
        run: python3 -I quality/test-native-ocr-crt-reconstruction.py
      - name: Regenerate historical stock evidence and reconstruct selected CRT objects
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dvr-crt-inputs"
          mkdir -p "$root"
          curl --fail --location --silent --show-error --retry 2 --max-time 300 --output "$root/mingw-source.tar.gz" https://codeload.github.com/mingw-w64/mingw-w64/tar.gz/0d6dfbc348dfad714761c0a7151615767f96bcb5
          curl --fail --location --silent --show-error --retry 2 --max-time 300 --output "$root/llvm-mac.tar.xz" https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-macos-universal.tar.xz
          curl --fail --location --silent --show-error --retry 2 --max-time 300 --output "$root/llvm-win.zip" https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip
          python3 -I quality/native-ocr-crt-reconstruct-LAB.py --repo "$PWD" --source-tar "$root/mingw-source.tar.gz" --compiler-tar "$root/llvm-mac.tar.xz" --stock-windows-zip "$root/llvm-win.zip" --out "$RUNNER_TEMP/dvr-crt-source-reconstruction"
      - name: Save reconstructed CRT evidence only (no object archives or binaries)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ocr-crt-reconstruction-evidence
          path: |
            ${{ runner.temp }}/dvr-crt-source-reconstruction/crt-reconstruction-evidence.json
            ${{ runner.temp }}/dvr-crt-source-reconstruction/stock-crt/stock-crt-normalized-coff.json
          if-no-files-found: error
