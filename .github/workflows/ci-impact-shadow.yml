name: CI impact shadow

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-impact-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: ${{ !github.event.pull_request.draft }}
    name: trusted impact shadow
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Fetch trusted base classifier
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid base SHA"; exit 1; }
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/scripts/ci-impact-classifier.mjs?ref=$BASE_SHA" \
            > "$RUNNER_TEMP/dvr-ci-impact-classifier.json"
          test "$(jq -r '.encoding' "$RUNNER_TEMP/dvr-ci-impact-classifier.json")" = 'base64'
          jq -r '.content' "$RUNNER_TEMP/dvr-ci-impact-classifier.json" \
            | tr -d '\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/dvr-ci-impact-classifier.mjs"
          CLASSIFIER_BYTES="$(wc -c < "$RUNNER_TEMP/dvr-ci-impact-classifier.mjs")"
          (( CLASSIFIER_BYTES > 0 && CLASSIFIER_BYTES <= 65536 )) || {
            echo "::error::trusted classifier size out of bounds"
            exit 1
          }
          EXPECTED_BLOB="$(jq -r '.sha' "$RUNNER_TEMP/dvr-ci-impact-classifier.json")"
          ACTUAL_BLOB="$(git hash-object "$RUNNER_TEMP/dvr-ci-impact-classifier.mjs")"
          [[ "$EXPECTED_BLOB" =~ ^[0-9a-f]{40}$ && "$ACTUAL_BLOB" = "$EXPECTED_BLOB" ]] || {
            echo "::error::trusted classifier blob mismatch"
            exit 1
          }

      - name: Install Node 24 for trusted classifier
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Collect changed filenames as JSON lines
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::invalid PR number"; exit 1; }
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename | @json' \
            > "$RUNNER_TEMP/dvr-ci-impact-files.jsonl"
          test -s "$RUNNER_TEMP/dvr-ci-impact-files.jsonl"

      - name: Report trusted shadow decision
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/dvr-ci-impact-classifier.mjs" --json-lines \
            < "$RUNNER_TEMP/dvr-ci-impact-files.jsonl"
