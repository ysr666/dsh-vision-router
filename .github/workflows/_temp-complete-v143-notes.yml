name: temp-complete-v1.4.3-notes

on:
  push:
    branches:
      - docs/complete-v1.4.3-notes

permissions:
  contents: write

jobs:
  update-notes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete v1.4.3 changelog
        shell: bash
        env:
          V143_SECTION_B64: 
        run: python3 -c "import os,base64,pathlib; p=pathlib.Path('CHANGELOG.md'); t=p.read_text(); s=t.index('## v1.4.3\\n'); e=t.index('## v1.4.2\\n',s); n=base64.b64decode(os.environ['V143_SECTION_B64']).decode(); p.write_text(t[:s]+n+t[e:])"
      - name: Build corrected GitHub Release notes
        shell: bash
        run: |
          echo '# v1.4.3' > release-notes.md
          echo >> release-notes.md
          awk '$0 == "## v1.4.3" { flag=1; next } $0 == "## v1.4.2" && flag { exit } flag' CHANGELOG.md >> release-notes.md
          echo >> release-notes.md
          echo '## Commits' >> release-notes.md
          echo >> release-notes.md
          git log --pretty=format:'- %s' v1.4.2..v1.4.3 >> release-notes.md
      - name: Update GitHub Release
        shell: bash
        run: gh release edit v1.4.3 --title v1.4.3 --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit corrected changelog
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m 'docs: complete v1.4.3 release notes'
          git push origin HEAD:docs/complete-v1.4.3-notes
