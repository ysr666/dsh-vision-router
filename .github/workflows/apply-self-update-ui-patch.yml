name: Apply self-update UI patch

on:
  push:
    branches: [agent/update-check-settings]
    paths:
      - .github/workflows/apply-self-update-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/update-check-settings
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic patch
        run: node scripts/apply-self-update-ui-patch.mjs
      - name: Validate
        run: pnpm test
      - name: Remove temporary patch machinery
        run: rm scripts/apply-self-update-ui-patch.mjs .github/workflows/apply-self-update-ui-patch.yml
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.js lib/client.js scripts/apply-self-update-ui-patch.mjs .github/workflows/apply-self-update-ui-patch.yml
          git commit -m "feat: add safe one-click update action"
          git push
