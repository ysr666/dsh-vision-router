name: "Issue 860/877 Desktop upgrade first-stack diagnostic"

# Diagnostic branch only: isolated Windows Host updates the immutable *published*
# npm 3.2.1 to 3.4.0 and records first Fiber failure. Never releases/merges.
on:
  push:
    branches:
      - diagnostics/issue-860-877-desktop-upgrade
    paths:
      - "scripts/issue-877-desktop-upgrade-probe.mjs"
      - ".github/workflows/issue-877-desktop-upgrade-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-upgrade-first-stack:
    name: "Windows Desktop 3.2.1 -> 3.4.0 / Node 24.21.0"
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic DVR tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr
      - name: Checkout immutable DSH 0.2.2-rc.5 Host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 9c2670d3bce5275e0d1610272958121af87787bb
          persist-credentials: false
          path: dsh-host
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
      - name: Build only DVR diagnostic dependencies
        working-directory: dvr
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
      - name: Build immutable Windows Desktop Host
        working-directory: dsh-host
        env:
          CI: "true"
          LEFTHOOK: "0"
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Run actual PluginManager updateBundle with the two npm versions
        working-directory: dsh-host
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-host
          DSH_EXPECTED_VERSION: 0.2.2-rc.5
          DVR_DESKTOP_BASE_PORT: "19861"
        run: node --import tsx ../dvr/scripts/issue-877-desktop-upgrade-probe.mjs
