name: one-shot alpha README contract fix

on:
  push:
    branches: [fix/dsh-0.1.2-alpha1-compat]

permissions:
  contents: write

jobs:
  patch-readmes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/dsh-0.1.2-alpha1-compat
      - name: Tighten canonical-pixel wording and remove this one-shot workflow
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'README.md': [
                  (
                      'This plugin keeps the **original pixels on the vision model\'s side** and DeepSeek on the reasoning side, and makes looking at an image an **ordinary tool call**:',
                      'This plugin keeps the **Host-canonical image pixels on the vision model\'s side** and DeepSeek on the reasoning side, and makes looking at an image an **ordinary tool call**:',
                  ),
                  ('(routing bridge — pixel-faithful), with a built-in keyless free fallback.', '(routing bridge — pixel-level), with a built-in keyless free fallback.'),
                  ('| Pixel fidelity | ✅ full (when switched) | ❌ text description only | ✅ full, on the image turn |', '| Image pixels | ✅ available (when switched) | ❌ text description only | ✅ Host-canonical raster, on the image turn |'),
                  ('this plugin adds raw-image routing, with `vision_describe` covering descriptions on demand', 'this plugin adds image routing, with `vision_describe` covering descriptions on demand'),
              ],
              'README.zh.md': [
                  ('本插件把**原图像素留在视觉模型侧**、把推理留在 DeepSeek 侧，并把“看图”变成一次**普通的工具调用**：', '本插件把**Host 规范化后的图像像素留在视觉模型侧**、把推理留在 DeepSeek 侧，并把“看图”变成一次**普通的工具调用**：'),
                  ('本插件主打"**图片轮直接交给视觉模型看原图**"（路由桥，像素保真），同时内置免 Key 免费模型兜底。', '本插件主打"**图片轮直接交给视觉模型看图像像素**"（路由桥，像素级），同时内置免 Key 免费模型兜底。'),
                  ('| 像素保真 | ✅ 完整（切换后） | ❌ 只有文字描述 | ✅ 完整，图片轮内 |', '| 图像像素 | ✅ 可用（切换后） | ❌ 只有文字描述 | ✅ Host 规范化栅格，图片轮内 |'),
                  ('描述桥方案；本插件提供"原图直看"路由，描述能力由 `vision_describe` 按需替代', '描述桥方案；本插件提供"图像直看"路由，描述能力由 `vision_describe` 按需替代'),
              ],
          }

          notes = {
              'README.md': '''\n> [!NOTE]\n> On DSH 0.1.2-alpha.1+, attachments remain Host-owned. Vision Router consumes the Host-persisted canonical image: clean single-frame 8-bit sRGB/sRGBA images inside the configured normalization limits can pass through byte-identically, while images that need orientation, color-space, metadata, animation, or size normalization may be re-encoded. Pixel tools therefore promise the Host-canonical raster, not preservation of the uploader's original encoded bytes.\n''',
              'README.zh.md': '''\n> [!NOTE]\n> 在 DSH 0.1.2-alpha.1+ 上，附件仍由 Host 单一持有。Vision Router 消费的是 Host 持久化后的 canonical image：落在规范化限制内的单帧 8-bit sRGB/sRGBA 图片可以逐字节直通；需要旋转、色彩空间、元数据、动画或尺寸规范化的图片可能会被重新编码。因此像素工具承诺的是 Host canonical raster，而不是上传源文件编码字节逐字节不变。\n''',
          }

          anchors = {
              'README.md': '(routing bridge — pixel-level), with a built-in keyless free fallback.\n',
              'README.zh.md': '本插件主打"**图片轮直接交给视觉模型看图像像素**"（路由桥，像素级），同时内置免 Key 免费模型兜底。\n',
          }

          changed = []
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text and new not in text:
                      raise SystemExit(f'{name}: expected contract wording not found: {old!r}')
                  text = text.replace(old, new)
              note = notes[name]
              if note.strip() not in text:
                  anchor = anchors[name]
                  if anchor not in text:
                      raise SystemExit(f'{name}: note anchor not found')
                  text = text.replace(anchor, anchor + note, 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(name)

          Path('.github/workflows/alpha-readme-contract-fix.yml').unlink()
          print('patched:', ', '.join(changed) if changed else 'already patched')
      - name: Commit exact wording patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md README.zh.md .github/workflows/alpha-readme-contract-fix.yml
          git commit -m "docs: clarify Host-canonical image contract"
          git push origin HEAD:fix/dsh-0.1.2-alpha1-compat
