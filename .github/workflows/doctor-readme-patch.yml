name: Patch doctor troubleshooting docs

on:
  push:
    branches: [docs/doctor-readme]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/doctor-readme
      - name: Update troubleshooting docs
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'README.zh.md': (
                  '''**解决**：把该文件重新保存为 **UTF-8（无 BOM）** 即可：\n\n- VS Code：右下角编码 → “通过编码保存” → 选择 `UTF-8`；\n- 或命令行去掉开头的 BOM（把 `web` 换成你的 profile 名，改完重启 `dsh web`）：\n\n```sh\nnode -e "const fs=require('fs');const p=process.argv[1];const b=fs.readFileSync(p);if(b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF)fs.writeFileSync(p,b.subarray(3))" "$HOME/.dsh/profiles/web/package.json"\n```\n\n> 提示：保存后如果不确定是否还带 BOM，可以用上面的命令自查；带 BOM 时它会帮你去掉。''',
                  '''**推荐修复**：直接运行 Vision Router 自带的独立修复命令。它不需要 DSH 先成功启动，会定位 profile、检测 UTF-8 BOM，只删除开头的三个 BOM 字节，然后重新验证 JSON：\n\n```sh\nnpx dsh-vision-router repair --profile web\n```\n\n只想检查、不修改文件时：\n\n```sh\nnpx dsh-vision-router doctor --profile web\n```\n\n如果你使用的不是 `web` profile，把 `web` 换成对应名称；也可以不传 `--profile`，让 doctor 扫描全部 profile。\n\n手动兜底方式：VS Code 右下角编码 → “通过编码保存” → 选择 `UTF-8`（无 BOM）。若 `repair` 去掉 BOM 后仍提示 JSON 非法，它不会猜测或重写其他 JSON 内容，请再手动检查文件。'''
              ),
              'README.md': (
                  '''**Fix:** re-save the file as **UTF-8 without BOM**:\n\n- VS Code: click the encoding label in the status bar → “Save with Encoding” → `UTF-8`;\n- or strip the leading BOM from the command line (replace `web` with your profile name, then restart `dsh web`):\n\n```sh\nnode -e "const fs=require('fs');const p=process.argv[1];const b=fs.readFileSync(p);if(b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF)fs.writeFileSync(p,b.subarray(3))" "$HOME/.dsh/profiles/web/package.json"\n```\n\n> Tip: if you are not sure whether the file still has a BOM, run the command above again — it removes it only when present.''',
                  '''**Recommended fix:** run Vision Router's standalone repair command. It does not require DSH to boot first; it locates the profile, detects a UTF-8 BOM, removes only the three leading BOM bytes, and then validates the JSON again:\n\n```sh\nnpx dsh-vision-router repair --profile web\n```\n\nTo diagnose without changing the file:\n\n```sh\nnpx dsh-vision-router doctor --profile web\n```\n\nReplace `web` if you use another profile, or omit `--profile` to scan all profiles.\n\nManual fallback: in VS Code, use “Save with Encoding” → `UTF-8` (without BOM). If `repair` removes the BOM but the JSON is still invalid, it will not guess or rewrite any other JSON content; inspect the file manually.'''
              ),
          }

          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected troubleshooting block not found in {name}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit docs and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/doctor-readme-patch.yml
          git add README.md README.zh.md
          git commit -m "docs: prefer doctor repair for BOM startup failures"
          git push origin HEAD:docs/doctor-readme
