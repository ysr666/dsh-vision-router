name: Apply guide refactor on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute staged refactor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/guide-lifecycle-refactor.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(code, 'guide-lifecycle-refactor', 'exec'))
          PY
          rm -f .github/workflows/guide-lifecycle-pr.yml

      - name: Run focused regression tests
        run: node --test tests/client.test.js tests/guide-scroll-gate.test.js

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make guide lifecycle state-driven (#207)"
          git push origin HEAD:${{ github.head_ref }}
