name: Fix structured bootstrap tool gate

on:
  push:
    branches: [feat/structured-vision-bootstrap]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python3 scripts/fix-structured-bootstrap-gate.py
      - run: git diff --check
      - run: node --test tests/structured-bootstrap.test.js
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js lib/client.js tests/structured-bootstrap.test.js
          git commit -m "fix: require vision tools for structured bootstrap"
          git push origin HEAD:${GITHUB_REF_NAME}
