name: Issue 864 shared model-directory contract prototype
on:
  push:
    branches: [diagnostics/issue-864-shared-directory-contract]
permissions:
  contents: read
jobs:
  upstream-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: dvr
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 4b399c39a6d1479cd84ca591b4d7c88e24d38a96
          path: dsh-host
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Apply diagnostic-only upstream prototype
        run: node dvr/scripts/issue-864-shared-directory-prototype.mjs dsh-host
      - name: Install immutable upstream workspace
        working-directory: dsh-host
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Run real Cordis browser model-selection tests and Host catalog tests
        working-directory: dsh-host
        run: pnpm exec vitest run packages/client/ui-model-selection/tests/browser-plugin.client.spec.ts packages/api/session-controller/tests/session-models.host.spec.ts
      - name: Build patched upstream Host and client including generated contracts
        working-directory: dsh-host
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm run build
